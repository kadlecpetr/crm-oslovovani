<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.anthropic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oslovovací CRM</title>
<meta name="theme-color" content="#0f6e66" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oslovování">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Mřížka jako v Excelu: sticky hlavička, zmrazený sloupec Jméno, tenké čáry, inline editace. Detail kontaktu je boční panel. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f4f4f2; --ink:#1c1c1a; --muted:#6b6b66; --line:#e3e3df; --line2:#c9c9c3;
  --accent:#0f6e66; --accent-ink:#ffffff; --late:#c2362b; --warn:#a85a05;
  --turnbg:#fff4df; --head:#f1f1ee; --zebra:#fafaf8; --hover:#f0f4f3; --chkbg:#e3f1ef; --selbg:rgba(15,110,102,.13);
  --f-body:'Instrument Sans',system-ui,sans-serif;
  --overlay:rgba(20,20,18,.35); --rh:30px; --numw:46px; --ckw:34px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#141413; --surface2:#1f1f1d; --ink:#ebebe8; --muted:#9a9a94; --line:#2e2e2b; --line2:#46463f;
  --accent:#3cc2b4; --accent-ink:#06201d; --late:#ff8a7e; --warn:#f0a94a; --overlay:rgba(0,0,0,.55);
  --head:#1f1f1d; --zebra:#181817; --hover:#212625; --chkbg:#16302d; --selbg:rgba(60,194,180,.17); --turnbg:#2d2615; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#141413; --surface2:#1f1f1d; --ink:#ebebe8; --muted:#9a9a94; --line:#2e2e2b; --line2:#46463f;
  --accent:#3cc2b4; --accent-ink:#06201d; --late:#ff8a7e; --warn:#f0a94a; --overlay:rgba(0,0,0,.55);
  --head:#1f1f1d; --zebra:#181817; --hover:#212625; --chkbg:#16302d; --selbg:rgba(60,194,180,.17); --turnbg:#2d2615; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;margin:0;overflow:hidden}
.wrap{height:100dvh;display:flex;flex-direction:column;min-height:0;
  padding:0 max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 0 8px;flex:none}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{border:0;background:transparent;border-radius:6px;padding:6px 11px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn.sm{padding:4px 8px;font-size:13px;color:var(--muted)}
.btn.sm:hover{color:var(--ink)}
.btn.danger{color:var(--late)}
.hbtns{display:flex;gap:4px;align-items:center}
.toolbar{display:flex;gap:8px;align-items:center;flex:none;margin-bottom:6px}
.toolbar input[type=search]{background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:6px 10px;min-width:0;width:300px;max-width:100%;font-size:14px}
.toolbar input[type=search]:focus-visible{outline-offset:1px}
.views{display:flex;gap:2px;align-items:flex-end;flex:none;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.vt{display:inline-flex;align-items:center;gap:2px;border:0;border-bottom:2px solid transparent;background:none;padding:6px 10px 5px;color:var(--muted);font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0}
.vt:hover{background:var(--surface2);color:var(--ink)}
.vt.on{color:var(--ink);border-bottom-color:var(--accent)}
.vw{display:inline-flex;align-items:center}
.vw .vx{border:0;background:none;color:var(--muted);padding:0 5px;font-size:12px;border-radius:4px}
.vw .vx:hover{color:var(--late)}
.stats{display:flex;gap:6px;flex-wrap:wrap;flex:none;padding:8px 0;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
button.chip:hover{background:var(--surface2)}
.chip b{color:var(--ink);font-weight:600}.chip.late b{color:var(--late)}.chip.today b{color:var(--warn)}
.chip.on{background:var(--surface2);border-color:var(--accent)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--sc,var(--muted));display:inline-block}
[data-s=ignor]{--sc:#8c7a5b}[data-s=novy]{--sc:#9a9a94}[data-s=osloven]{--sc:#d4a017}[data-s=ceka]{--sc:#d4781c}[data-s=kontakt]{--sc:#2f7fd1}[data-s=schuzka]{--sc:#7c4fd0}[data-s=spoluprace]{--sc:#2a9d5c}[data-s=nezajem]{--sc:#c2362b}
/* hromadná lišta */
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;background:var(--chkbg);border:1px solid var(--accent);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.bulk[hidden]{display:none}
.bulk select,.bulk input{background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:13px;min-height:28px}
.bulk input{width:130px}
/* mřížka */
.gw{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);position:relative;overscroll-behavior:contain}
.gw:focus{outline:none}
.gw:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.g{width:max(var(--total),100%)}
.row,.hrow{display:grid;grid-template-columns:var(--cols);height:var(--rh);width:100%;border-bottom:1px solid var(--line);background:var(--rowbg,var(--surface))}
.row{content-visibility:auto;contain-intrinsic-size:auto 30px}
.row:nth-child(even){--rowbg:var(--zebra)}
.row:hover{--rowbg:var(--hover)}
.row.turn{--rowbg:var(--turnbg)}
.row.turn .cell.num{box-shadow:inset 4px 0 0 var(--warn)}
.row.chk{--rowbg:var(--chkbg)}
.row.done .cell:not(.num):not(.ck){opacity:.8}
.hrow{position:sticky;top:0;z-index:6;--rowbg:var(--head);height:32px}
.cell{min-width:0;height:100%;padding:0 8px;display:flex;align-items:center;gap:4px;border-right:1px solid var(--line);overflow:hidden;white-space:nowrap;position:relative;background:inherit}
.cell.rng{background-image:linear-gradient(var(--selbg),var(--selbg))}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.gw:not(:focus-within) .cell.sel{box-shadow:inset 0 0 0 2px var(--muted)}
.cell.num,.cell.ck{position:sticky;z-index:2;justify-content:center;padding:0;color:var(--muted);font-size:12px;background:var(--rowbg,var(--surface))}
.cell.num{left:0;background-color:var(--head)}
.cell.num.hl{background-color:var(--line);color:var(--ink);font-weight:600}
.cell.ck{left:var(--numw)}
.cell.ck input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.cell[data-k=name]{position:sticky;left:calc(var(--numw) + var(--ckw));z-index:2}
.gw.sx .cell[data-k=name]{border-right:2px solid var(--line2)}
.hrow .cell{font-size:12px;font-weight:600;color:var(--muted);gap:2px}
.hrow .cell.num,.hrow .cell.ck{z-index:8}
.hrow .cell[data-k=name]{z-index:8}
.hl2{background:none;border:0;padding:0;font-weight:600;font-size:12px;color:inherit;display:inline-flex;gap:4px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left;height:100%}
.hl2:hover{color:var(--ink)}
.ar{font-size:9px;color:var(--accent)}.ar.dim{opacity:.35}
.hf{background:none;border:0;border-radius:4px;padding:1px 4px;font-size:11px;color:var(--muted)}
.hf:hover,.hf.on{background:var(--line);color:var(--ink)}
.hf.on{color:var(--accent)}
.rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:3}
.rz:hover,.rz.drag{background:var(--accent);opacity:.5}
.t{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ph{color:var(--muted)}
.cell[data-k=name] .t{font-weight:500}
.acts{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:none;gap:2px;align-items:center;background:var(--rowbg,var(--surface));padding-left:4px}
.row:hover .acts,.cell.sel .acts,.acts:focus-within{display:flex}
.open,.msgb{height:22px;border:0;border-radius:4px;background:var(--line);color:var(--ink);font-size:12.5px;line-height:1;padding:0 6px;white-space:nowrap}
.open{width:22px;padding:0;font-size:13px}
.open:hover,.msgb:hover{background:var(--accent);color:var(--accent-ink)}
.mbtn{display:none}
.wrote{display:flex;align-items:center;gap:7px;min-width:0}
.wrote input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.wl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.turn .wl{color:var(--warn);font-weight:600}
.banner{display:flex;flex-wrap:wrap;gap:6px 8px;flex:none;align-items:center;margin:6px 0 2px}
.banner[hidden]{display:none}
.panel:focus,.dlg:focus{outline:none}
.bn{overflow-wrap:anywhere;word-break:break-word;min-width:0;max-width:100%;border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:6px 12px;text-align:left}
.bn:hover{background:var(--surface2)}
.bn.today{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.bn.late{border-color:var(--late);background:color-mix(in srgb,var(--late) 12%,transparent)}
.bn.today b{color:var(--warn)}.bn.late b{color:var(--late)}
.bn.x{border:0;background:none;color:var(--muted);padding:6px 8px}
.note2{font-size:12.5px;color:var(--muted);margin:8px 0 4px;line-height:1.4}
.note.ts{font-size:12px;color:var(--muted)}
.lk{display:flex;gap:2px;flex:none}
.lnk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;color:var(--accent);text-decoration:none;font-size:13px}
.lnk:hover{background:var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:1px 9px 1px 7px;border-radius:999px;font-size:12.5px;background:color-mix(in srgb,var(--sc) 17%,transparent);overflow:hidden;white-space:nowrap;cursor:pointer}
.badge::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--sc)}
.due{color:var(--muted)}
.cd{display:inline-flex;align-items:center;gap:4px;padding:2px 11px;border-radius:999px;font-weight:700;font-size:13.5px;background:var(--surface2);color:var(--muted);white-space:nowrap;flex:none}
.cd.late{background:var(--late);color:var(--bg)}.cd.late::before{content:"⚠"}
.cd.today{background:var(--warn);color:var(--bg)}
.cd.soon{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
.cd.far{font-weight:600}
.cdd{color:var(--muted);font-size:12px;margin-left:8px;white-space:nowrap}
.fuc{display:inline-block;padding:0 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px;margin-right:4px;white-space:nowrap;flex:none}
.sendnow{border:1px solid var(--line2);background:var(--surface);border-radius:5px;padding:1px 7px;font-size:12px;margin-left:6px;white-space:nowrap}
.sendnow:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint2{font-size:11.5px;color:var(--warn);margin-left:6px;white-space:nowrap}
.ph.w{color:var(--warn);font-style:italic;font-size:12.5px}
.cell[data-w]::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;border-bottom:1.5px dotted var(--warn);opacity:.7;pointer-events:none}
.ln{display:flex;gap:6px;align-items:center;min-width:0;flex:1;cursor:pointer}
.ln .badge{flex:none}
.ago{color:var(--muted);font-size:12px;flex:none}
.due.late{color:var(--late);font-weight:600}.due.late::before{content:"⚠ "}
.due.today{color:var(--warn);font-weight:600}
.last{color:var(--muted)}
.cell.ed{overflow:visible;padding:0;z-index:4}
.cell.ed input{width:100%;height:100%;border:0;outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface);padding:0 8px;font:inherit;color:var(--ink)}
.row.addrow .num{font-size:15px}
.row.addrow .cell[data-k=name] .t{font-weight:400}
.empty{padding:28px 16px;text-align:center;color:var(--muted);position:sticky;left:0}
.empty p{margin:0 0 12px}
.sbar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:6px;font-size:12.5px;color:var(--muted)}
/* popover */
.pop{position:fixed;z-index:25;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:4px;min-width:190px;max-width:min(420px,calc(100vw - 16px));max-height:min(380px,60vh);overflow:auto;font-size:13.5px}
.pi{display:flex;width:100%;gap:8px;align-items:center;justify-content:space-between;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;white-space:nowrap}
.pi:hover,.pi.hi,.pi:focus-visible{background:var(--surface2);outline:none}
.pi.hi{box-shadow:inset 2px 0 0 var(--accent)}
.pi .sub{color:var(--muted);font-size:12px}
.pi.cur{font-weight:600}
.pop .pd{padding:6px 10px 4px}
.pop .pd input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.pop h4{margin:6px 10px 4px;font-size:12px;color:var(--muted);font-weight:600}
.pop .sc{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:6px 10px;font-size:13px;min-width:340px}
.pop .sc kbd{font:inherit;font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.pop label.pc{display:flex;gap:8px;align-items:center;margin:0;padding:6px 10px;font-size:13.5px;color:var(--ink)}
.msgpop{width:350px;padding:6px 12px 12px}
.mf label{margin:10px 0 3px}
.mf input,.mf select,.mf textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.mf textarea{min-height:56px}
.mf .foot{margin-top:12px}
.histpop{width:380px}
.hl{list-style:none;margin:0;padding:4px 10px;display:grid;gap:8px}
.hl li{display:grid;grid-template-columns:62px 1fr;gap:8px}
.hl .when,.log .when{color:var(--muted);white-space:nowrap}
.note{display:block;color:var(--muted);margin-top:2px;white-space:pre-wrap}
.sech{margin:24px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.pop .vsave{display:flex;gap:6px;padding:6px}
.pop .vsave input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0}
/* panel */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:30;display:flex;justify-content:flex-end;overscroll-behavior:contain}
.panel{background:var(--surface);width:min(480px,100%);height:100%;overflow-y:auto;
  padding:28px max(24px,env(safe-area-inset-right,0px)) 48px 24px;padding-top:calc(28px + env(safe-area-inset-top,0px))}
.panel h3{font-size:18px;font-weight:600;margin:0}
.ph2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;position:sticky;top:-28px;background:var(--surface);padding:8px 0;z-index:1}
label{display:block;font-size:12px;color:var(--muted);margin:18px 0 4px}
.panel input,.panel select,.panel textarea{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:8px 10px;min-width:0}
.panel input:focus-visible,.panel select:focus-visible,.panel textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:8px}
.quick button{background:none;border:0;padding:2px 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.quick button:hover{color:var(--ink)}
.sec{margin-top:32px}
.log{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;font-size:14px;align-items:start}
.log .mbt{display:flex}
.log .note{color:var(--ink)}
.log .x{background:none;border:0;color:var(--muted);padding:0 4px}.log .x:hover{color:var(--late)}
.log .when{color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:24px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin-top:16px}
.toast button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;margin-left:12px;padding:0}
.toast{animation:tin .15s ease-out;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:60;font-size:14px;max-width:calc(100vw - 24px)}
/* dialogy (import, paměť stylu, psaní zprávy) */
.dlg-ov{position:fixed;inset:0;background:var(--overlay);z-index:45;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;overscroll-behavior:contain}
.dlg{background:var(--surface);border-radius:12px;width:min(880px,100%);padding:18px 22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.dlg-h h3{margin:0;font-size:18px;font-weight:600}
.dlg label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.dlg input,.dlg select,.dlg textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.dlg textarea{min-height:60px;resize:vertical}
.dlg input[type=file]{display:none}
.dl-hint{font-size:13px;color:var(--muted);margin:6px 0;line-height:1.45}
.dl-err{color:var(--late);font-size:13.5px;margin:8px 0;font-weight:500}
.dl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.dl-sum{font-size:13.5px;font-weight:500;margin:12px 0 6px}
.dl-t{width:100%;border-collapse:collapse;font-size:13.5px}
.dl-t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.dl-t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.dl-ok{color:var(--accent);font-size:12px;margin-left:6px}.dl-warn{color:var(--warn);font-size:12px;margin-left:6px;font-weight:600}.dl-new{color:var(--muted);font-size:12px;margin-left:6px}
.dl-t details{margin-top:4px;font-size:12.5px}.dl-t summary{cursor:pointer;color:var(--muted)}
.dl-t .cv-x{min-height:44px}
.quote{display:block;margin-top:3px;padding-left:8px;border-left:3px solid var(--line2);font-size:13px;color:var(--muted);white-space:pre-wrap}
.quote.me{border-left-color:var(--accent)}.quote.them{border-left-color:var(--warn)}
.quote b{color:var(--ink);font-weight:600}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.mem-s{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.mem-s b{font-size:20px}.mem-s span{font-size:12px;color:var(--muted)}
.mem-r{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}

<body>
<div class="wrap">
  <header>
    <h1>Oslovovací CRM</h1>
    <div class="hbtns"><button class="btn sm desk" id="ics" title="Stáhnout .ics se všemi budoucími follow-upy (kalendář tě upozorní i při zavřené appce)">Do kalendáře</button><button class="btn sm desk" id="imsg" title="Nahrát historii odeslaných zpráv a odpovědí">Nahrát zprávy</button><button class="btn sm desk" id="memb" title="Paměť stylu: vzorové zprávy, Jak píšu, Co nabízím">Paměť stylu</button><button class="btn sm desk" id="kb" title="Klávesové zkratky (Ctrl+/)">⌨ Zkratky</button><button class="btn sm" id="exp" title="Stáhnout CSV pro Excel">Export</button><button class="btn sm" id="imp" title="Načíst CSV nebo JSON zálohu">Import</button><button class="btn sm mob" id="more" aria-haspopup="true" aria-label="Další akce" title="Další akce">⋯</button><button class="btn primary" id="add">+ Nový</button><input type="file" id="file" accept=".csv,.json,text/csv,application/json" hidden></div>
  </header>
  <div class="alertbar" id="savebar" role="alert" hidden><span>Data nejsou uložená v prohlížeči (úložiště je plné nebo zakázané). Změny by se ztratily.</span><button class="btn sm" data-act="backup">Stáhnout zálohu</button></div>
  <div class="alertbar warn" id="brokenbar" role="alert" hidden></div>
  <div class="toolbar">
    <input id="fs" type="search" placeholder="Hledat…  ( / )" aria-label="Hledat">
    <button class="btn sm desk" id="colbtn" aria-haspopup="true">Sloupce ▾</button>
    <button class="btn sm" id="setbtn" aria-haspopup="true" title="Interval follow-upů, připomínky">⚙ Nastavení</button>
  </div>
  <div class="banner" id="banner" role="status" aria-label="Připomínky" hidden></div>
  <div class="views" id="views" role="tablist" aria-label="Pohledy"></div>
  <div class="stats" id="stats"></div>
  <div class="bulk" id="bulk" hidden></div>
  <div class="gw" id="gw" tabindex="0" role="grid" aria-label="Kontakty" aria-multiselectable="true">
    <div class="g" id="g"><div class="hrow" id="hrow" role="row"></div><div id="rows"></div><div id="extra"></div></div>
  </div>
  <div class="sbar"><span id="count"></span><span>Enter upravit · Alt+M zpráva · Mezerník detail · Shift+Enter nový řádek · Ctrl+Z zpět · Ctrl+/ zkratky</span></div>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';
var STATUSES=[['novy','Neoslovený'],['osloven','Osloven (bez výsledku)'],['ceka','Čeká se na odpověď'],['ignor','Ignor (bez odpovědi)'],['kontakt','Jednáme o schůzce'],['schuzka','Schůzka domluvena'],['spoluprace','Zájem / spolupráce'],['nezajem','Odmítl']];
var SHORT={novy:'Neoslovený',osloven:'Osloven',ceka:'Čeká se',ignor:'Ignor',kontakt:'Jednáme',schuzka:'Schůzka',spoluprace:'Spolupráce',nezajem:'Odmítl'};
/* výsledek zprávy: [klíč, popisek, odpovídající stav kontaktu, krátký popisek] */
var OUTCOMES=[['ceka','Čeká se na odpověď','ceka','Čeká se'],['ignor','Ignor (bez odpovědi)','ignor','Ignor'],['odmitl','Odmítl','nezajem','Odmítl'],['jednani','Jednáme o schůzce','kontakt','Jednáme'],['schuzka','Schůzka domluvena','schuzka','Schůzka'],['zajem','Zájem / spolupráce','spoluprace','Zájem']];
var KINDS=[['prvni','První zpráva'],['followup','Follow-up'],['odpoved','Odpověď'],['hovor','Hovor'],['schuzka','Schůzka'],['poznamka','Poznámka']];
var KINDTYPE={prvni:'napsal',followup:'napsal',odpoved:'odpoved',hovor:'hovor',schuzka:'schuzka',poznamka:'poznamka'};   // původní pole log[].type zůstává vyplněné
var DONE=['nezajem','schuzka','spoluprace'];   // ukončené kontakty (v řazení dole)
var IGNOR_N=3;                                 // po tolika follow-upech bez odpovědi nápověda „zvaž ukončit“
var DEFHIDE=['other','last','desc','nextAction'];
/* sloupce mřížky: k = pole kontaktu, w = výchozí šířka, t = typ buňky (ro = jen ke čtení, počítá se z historie zpráv) */
var COLS=[
  {k:'name',l:'Jméno',w:170,t:'text'},{k:'wrote',l:'Napsáno',w:118,t:'ro'},{k:'nextDate',l:'Další follow-up',w:190,t:'date'},{k:'act',l:'Akce',w:148,t:'ro'},
  {k:'status',l:'Stav',w:150,t:'status',f:1},{k:'mail',l:'Mail',w:150,t:'text'},{k:'phone',l:'Telefon',w:142,t:'text'},{k:'field',l:'Obor',w:88,t:'field',f:1},
  {k:'first',l:'První zpráva',w:195,t:'date'},{k:'fu',l:'Follow-upy',w:150,t:'ro'},{k:'lastnote',l:'Poslední poznámka',w:270,t:'ro'},{k:'other',l:'Jiné',w:130,t:'text'},
  {k:'last',l:'Poslední kontakt',w:115,t:'ro'},{k:'desc',l:'Popis',w:200,t:'text'},{k:'nextAction',l:'Co udělat',w:160,t:'text'}
];
var NUMW=46,CKW=34,ADD='__new';
var contacts=[],fSearch='',fField='',fStatus='',fDue='',fGroup='',sortS=null;
var VC=COLS;                    // právě viditelné sloupce
var view=[],pos=new Map();      // aktuální (filtrované a seřazené) řádky, id -> index
var picked=new Set(),lastPick=-1;
var cur={id:null,c:0},anc={id:null,c:0},extras=[];   // kurzor, kotva výběru, další (Ctrl) oblasti
var ce=null;                    // probíhající editace buňky
var $=function(s){return document.querySelector(s)};
var wrap=$('#gw');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function isIso(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&validYmd(+s.slice(0,4),+s.slice(5,7),+s.slice(8,10))!==null}
function addDays(base,n){var p=base.split('-');return ymd(new Date(+p[0],+p[1]-1,+p[2]+n))}
function addMonths(base,n){var p=base.split('-'),d=new Date(+p[0],+p[1]-1+n,1),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(+p[2],last));return ymd(d)}
function diffDays(a,b){var pa=a.split('-'),pb=b.split('-');return Math.round((new Date(+pa[0],+pa[1]-1,+pa[2])-new Date(+pb[0],+pb[1]-1,+pb[2]))/864e5)}
var WD=['ne','po','út','st','čt','pá','so'],fmtCache=Object.create(null);
function fmtDate(s){
  var r=fmtCache[s];if(r)return r;var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  return fmtCache[s]=WD[d.getDay()]+' '+ +p[2]+'. '+ +p[1]+'.'+(+p[0]!==new Date().getFullYear()?' '+p[0]:'');
}
function fmtCz(s){if(!isIso(s))return s||'';var p=s.split('-');return +p[2]+'. '+ +p[1]+'. '+p[0]}
function fmtStamp(iso){return new Date(iso).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}
function statusLabel(k){for(var i=0;i<STATUSES.length;i++)if(STATUSES[i][0]===k)return STATUSES[i][1];return k}
var uidN=0;function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+(uidN++).toString(36)}
var coll=new Intl.Collator('cs');function csc(a,b){return coll.compare(a,b)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function isMobile(){return window.matchMedia('(max-width:699px)').matches}
function toast(t,undoFn,extras,isErr){
  var o=document.querySelectorAll('.toast:not(.err)');for(var i=0;i<o.length;i++)o[i].remove();
  var hasErr=!!document.querySelector('.toast.err');
  var e=document.createElement('div');e.className='toast'+(isErr?' err':'')+(hasErr&&!isErr?' above':'');e.setAttribute('role',isErr?'alert':'status');e.textContent=t;
  if(undoFn){var b=document.createElement('button');b.textContent='Vrátit';b.onclick=function(){undoFn();e.remove()};e.appendChild(b)}
  (extras||[]).forEach(function(x){var b2=document.createElement('button');b2.textContent=x.l;b2.onclick=function(){x.fn();e.remove()};e.appendChild(b2)});
  document.body.appendChild(e);setTimeout(function(){e.remove()},isErr?12000:extras&&extras.length?9000:undoFn?6000:3000);
}
function toastErr(t){toast(t,null,null,true)}

/* ---------- úložiště (localStorage) ---------- */
var KEY='crm_contacts',UIKEY='crm_ui',WKEY='crm_colw',VKEY='crm_views',BROKENKEY='crm_contacts_broken';
var saveFailed=false,brokenInfo=null,snap=new Map();   // snap = poslední známý stav uložených kontaktů (id -> JSON), kvůli slučování s jinými kartami
function renderSaveBar(){var b=$('#savebar');if(b)b.hidden=!saveFailed}
function renderBrokenBar(){
  var b=$('#brokenbar');if(!b)return;
  if(!brokenInfo){b.hidden=true;return}
  b.hidden=false;b.innerHTML='<span>Uložená data byla poškozená ('+esc(brokenInfo)+'). Použitelné záznamy jsem načetl, původní obsah je zachovaný.</span><button class="btn sm" data-act="dlbroken">Stáhnout poškozená data</button><button class="btn sm" data-act="brokenclose" aria-label="Skrýt">✕</button>';
}
function lsGet(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v==null?def:v}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){saveFailed=true;renderSaveBar();toastErr('Nastavení se nepodařilo uložit (plné úložiště prohlížeče). Stáhni zálohu.');return false}}
/* nepoužitelné prvky se zahodí, ostatním se doplní id, název, stav a historie */
function sanitizeList(a){
  var out=[],seen=new Set(),bad=0;
  a.forEach(function(c){
    if(!c||typeof c!=='object'||Array.isArray(c)){bad++;return}
    c=Object.assign({},c);
    if(typeof c.id!=='string'||!c.id||seen.has(c.id))c.id=uid();
    seen.add(c.id);
    ['name','contact','desc','field','nextAction'].forEach(function(k){if(typeof c[k]!=='string')c[k]=c[k]==null?'':String(c[k])});
    if(typeof c.nextDate!=='string')c.nextDate=c.nextDate==null?'':String(c.nextDate);
    if(!STATUSES.some(function(x){return x[0]===c.status}))c.status='novy';
    c.log=Array.isArray(c.log)?c.log.filter(function(l){return l&&typeof l==='object'&&!Array.isArray(l)}):[];
    out.push(c);
  });
  return {list:out,bad:bad};
}
function backupBroken(raw,why){
  try{   // až 3 různé kopie: první (původní) zůstává, další se ukládají do crm_contacts_broken2/3, nejstarší z nich se přepíše
    var bk=[BROKENKEY,BROKENKEY+'2',BROKENKEY+'3'],bv=bk.map(function(k){return localStorage.getItem(k)});
    if(bv.indexOf(raw)<0){
      if(bv[0]==null)localStorage.setItem(bk[0],raw);
      else if(bv[1]==null)localStorage.setItem(bk[1],raw);
      else if(bv[2]==null)localStorage.setItem(bk[2],raw);
      else{localStorage.setItem(bk[2],bv[1]);localStorage.setItem(bk[1],raw)}
    }
  }catch(e){}
  brokenInfo=why;renderBrokenBar();
}
function load(){
  var raw=null,a;
  try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw==null)return [];
  try{a=JSON.parse(raw)}catch(e){backupBroken(raw,'neplatný JSON');return []}
  if(!Array.isArray(a)){backupBroken(raw,'data nejsou seznam kontaktů');return []}
  var sn=sanitizeList(a);if(sn.bad)backupBroken(raw,sn.bad+' záznamů nešlo použít');
  return sn.list;
}
function snapAll(){snap=new Map();contacts.forEach(function(c){snap.set(c.id,JSON.stringify(c))})}
function readStored(){
  var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){return []}
  if(raw==null)return [];
  try{
    var a=JSON.parse(raw);if(!Array.isArray(a))return [];
    var seen=new Set();   // záznamy bez platného id (poškozené) už má tahle karta opravené v paměti
    return sanitizeList(a.filter(function(c){if(!c||typeof c!=='object'||Array.isArray(c)||typeof c.id!=='string'||!c.id||seen.has(c.id))return false;seen.add(c.id);return true})).list;
  }catch(e){return []}
}
/* ukládá se sloučením: načte se aktuální obsah úložiště a přepíšou se jen kontakty změněné v téhle kartě
   (když je změnila i jiná karta, vyhrává novější `upd`); změny z jiných karet se tím nepřepíšou */
function persistAll(){
  var stored=readStored(),mem=new Map(),smap=new Map(),result=[],other=false;
  contacts.forEach(function(c){mem.set(c.id,c)});stored.forEach(function(c){smap.set(c.id,c)});
  stored.forEach(function(sc){
    var m=mem.get(sc.id);
    if(!m){if(snap.has(sc.id))return;result.push(sc);other=true;return}    // smazáno tady / přidáno jinde
    var ms=JSON.stringify(m),was=snap.get(sc.id),ss=JSON.stringify(sc);
    if(ms===was){if(ss!==was)other=true;result.push(sc);return}
    if(was!==undefined&&ss!==was&&ss!==ms&&(sc.upd||'')>(m.upd||'')){result.push(sc);other=true;return}
    result.push(m);
  });
  contacts.forEach(function(c){
    if(smap.has(c.id))return;
    if(snap.has(c.id)&&JSON.stringify(c)===snap.get(c.id)){other=true;return}   // jiná karta ho smazala a tady se nezměnil
    result.push(c);
  });
  try{localStorage.setItem(KEY,JSON.stringify(result))}
  catch(e){saveFailed=true;renderSaveBar();toastErr('Uložení se nepovedlo – data nejsou uložená! Stáhni zálohu (Export).');return false}
  contacts=result;snapAll();
  if(saveFailed){saveFailed=false;renderSaveBar()}
  if(other)setTimeout(function(){toast('Data z jiné karty byla sloučena')},0);
  return true;
}

/* ---------- kontakt: Mail / Telefon / Jiné (migrace ze starého pole contact) ---------- */
var RE_MAIL=/[^\s@,;<>()]+@[^\s@,;<>()]+\.[a-z]{2,}/i;

  r.mail=mails[0]||'';mails.slice(1).forEach(function(x){oth.push(x)});
  if((m=rest.match(RE_URL))){oth.push(m[0]);rest=rest.replace(m[0],' ')}
  if((m=rest.match(RE_TEL))&&m[0].replace(/\D/g,'').length>=9){r.phone=m[0].trim();rest=rest.replace(m[0],' ')}

/* ---------- hodnoty buněk, data ---------- */
function validYmd(y,m,d){var dt=new Date(y,m-1,d);return dt.getFullYear()===+y&&dt.getMonth()===m-1&&dt.getDate()===+d?y+'-'+pad(m)+'-'+pad(d):null}
/* '' = bez termínu, null = nerozumím. Zná: 2026-11-05, 5.11., 5. 11. 2026, dnes, zítra, +3, +2t, +1m, po…ne */
function parseDateInput(raw,thisYear){   // thisYear = datum zprávy: bez roku platí aktuální rok (nepřeskakuje na příští)
  var v=norm(raw);if(!v)return '';var t=today(),m;
  if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return validYmd(+m[1],+m[2],+m[3]);

    var y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):+t.slice(0,4),r=validYmd(y,+m[2],+m[1]);
    if(r&&!m[3]&&r<t&&!thisYear)r=validYmd(y+1,+m[2],+m[1]);          // bez roku = nejbližší budoucí výskyt
    return r;
  }

    else n.log.push({at:dateToAt(fd),type:'napsal',kind:'prvni',outcome:'ceka',text:''});

function parseDelim(t,d){
  var rows=[],row=[],cell='',q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"'&&cell==='')q=true;
    else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cell);cell='';rows.push(row);row=[]}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}

}

    a.forEach(function(o){if(!o||typeof o!=='object')return;var g={};Object.keys(o).forEach(function(k){var nk=norm(k);for(var i=0;i<MRX.length;i++){if(g[MRX[i][0]]===undefined&&MRX[i][1].test(nk)){g[MRX[i][0]]=o[k];break}}});rows.push(mkRow(g.name,g.channel,g.date,g.sent,g.reply,g.outcome))});

/* import starších zpráv nemění stav: ukončený kontakt zůstane ukončený a zprávy starší než poslední existující stav nepřepíšou */

    var m=line.match(re),lab=m?norm(m[2]):'',words=m?m[2].trim().split(/\s+/).length:9,isMe=m&&me.indexOf(lab)>=0,isThem=m&&nameToks(m[2]).some(function(w){return them.indexOf(w)>=0}),isOther=m&&words<=3&&!/[.!?,;]/.test(m[2])&&/^[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]/.test(m[2].trim());

function convSave(){
  var c=byId(cv.id);if(!c)return;
  var turns=cv.turns.filter(function(t){return t.text.trim()}),items=[],i=0;
  while(i<turns.length){
    var t=turns[i];
    if(t.who==='me'){var e={sent:t.text.trim(),reply:'',date:t.date};if(turns[i+1]&&turns[i+1].who==='them'){e.reply=turns[i+1].text.trim();if(!e.date)e.date=turns[i+1].date;i+=2}else i++;items.push(e)}
    else{items.push({sent:'',reply:t.text.trim(),date:t.date});i++}
  }
  if(!items.length){toast('Není co uložit');return}
  var n=Object.assign({},c);n.log=(c.log||[]).slice();var chan=$('#cv-chan').value,lastD=today(),now=new Date().toISOString(),added=0,maxAt='';
  items.forEach(function(it,k){
    var d=it.date||lastD;lastD=d;
    if(n.log.some(function(l){return l.at&&ymd(new Date(l.at))===d&&(l.sent||'')===it.sent&&(l.reply||'')===it.reply}))return;
    var kind=!it.sent?'odpoved':(n.log.some(function(l){return l.kind==='prvni'})?'followup':'prvni');
    var later=items.slice(k+1).some(function(x){return x.sent});
    var e={at:dateToAt(d),type:KINDTYPE[kind],kind:kind,outcome:it.reply?'jednani':(later?'ignor':'ceka'),text:'',ts:now,channel:chan};
    if(it.sent)e.sent=it.sent;if(it.reply)e.reply=it.reply;n.log.push(e);added++;if(e.at>maxAt)maxAt=e.at;
  });
  if(!added){toast('Všechno už v historii je');return}
  n.status=keepStatus(c,maxAt)?c.status:statusFromLog(n);
  var ev=commitChanges([{id:c.id,before:c,after:n}],'vložená konverzace');closeDlg();
  toast('Uloženo záznamů: '+added,function(){undo(ev)});
}

/* ---------- psaní zprávy za uživatele: prompt, šablona, volitelně Claude API ---------- */
function pickSamples(c,max){
  var f=norm(c.field),wantFirst=!firstMsg(c),all=allMsgs().filter(function(x){return x.c.id!==c.id&&x.l.sent&&String(x.l.sent).trim()}),out=[];
  all.forEach(function(x){
    var l=x.l,sc=0;if(!(l.star||isSuccess(l)))return;
    if(l.star)sc+=4;if(l.outcome==='schuzka'||l.outcome==='zajem')sc+=3;else if(l.outcome==='jednani')sc+=2;if(l.reply)sc+=1;
    if(f&&norm(x.c.field)===f)sc+=3;if((l.kind==='prvni')===wantFirst)sc+=2;
    out.push({x:x,sc:sc});
  });
  out.sort(function(a,b){return b.sc-a.sc});
  var r=out.slice(0,max).map(function(o){return o.x});
  if(!r.length){all.sort(function(a,b){return ((b.l.kind==='prvni')===wantFirst)-((a.l.kind==='prvni')===wantFirst)||(b.l.at<a.l.at?-1:1)});r=all.slice(0,Math.min(max,2)).map(function(x){x.unverified=true;return x})}
  return r;
}
function histLines(c){
  var L=msgs(c).sort(byAt).map(function(l){
    var s='- '+fmtShort(ymd(new Date(l.at)))+(l.channel?' ['+chanLabel(l.channel)+']':'')+' '+kindLabel(l.kind)+(l.outcome?' (výsledek: '+outLabel(l.outcome)+')':'')+':';
    if(l.sent)s+='\n  Já: "'+clip(l.sent,700)+'"';
    if(l.reply)s+='\n  Odpověď: "'+clip(l.reply,700)+'"';
    if(l.text)s+='\n  Moje poznámka: '+clip(l.text,300);
    if(!l.sent&&!l.reply&&!l.text)s+=' (bez textu)';
    return s;
  });
  return L.length?L.join('\n'):'(zatím žádná komunikace, tohle bude první zpráva)';
}
function kindText(c){return firstMsg(c)?'follow-up č. '+(fus(c).length+1)+' (další zpráva, protože odpověď zatím nepřišla nebo je potřeba navázat)':'první zpráva'}
function buildPrompt(c,o){

   '## Kontakt','Jméno: '+(c.name||'?')+(c.field?'\nObor: '+c.field:'')+(c.desc?'\nPopis / kontext: '+c.desc:'')+(c.nextAction?'\nPlánovaná akce: '+c.nextAction:'')+'\nAktuální stav: '+statusLabel(c.status)+(last?'\nPoslední zpráva jsem poslal: '+fmtShort(ymd(new Date(last.at)))+' ('+agoText(last.at)+')':''),'',
   '## Dosavadní komunikace s tímto člověkem (od nejstarší)',histLines(c),''];

  p.push('- Nevymýšlej fakta o kontaktu, která nejsou výše. Pokud něco chybí, nech to obecné.');
  if(o.extra&&o.extra.trim())p.push('- Navíc od mě: '+o.extra.trim());

function escRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function defaultChannel(c){var l=lastChannel(c);if(l)return l;if(c.mail)return 'email';if(c.phone)return 'sms';if(c.other)return /linkedin/i.test(c.other)?'linkedin':'other';return 'email'}
/* 5. pád českých jmen (heuristika – běžná jména, výsledek je dobré zkontrolovat) */
function vocative(n){
  n=String(n||'').trim();if(!n)return '';var l=n.toLowerCase();
  if(/a$/.test(l))return n.slice(0,-1)+'o';
  if(/ek$/.test(l))return n.slice(0,-2)+'ku';
  if(/el$/.test(l))return n.slice(0,-2)+'le';
  if(/ec$/.test(l))return n.slice(0,-2)+'če';
  if(/[šžčřj]$/.test(l))return n+'i';
  if(/[^aeiouyáéěíóúůý]r$/.test(l))return n.slice(0,-1)+'ře';
  if(/(ch|[kgh])$/.test(l))return n+'u';
  if(/[eiyíéoóuúůýá]$/.test(l))return n;
  return n+'e';
}
function sentence(x){x=String(x||'').trim();return x?x.replace(/[.!?]+$/,'')+'.':''}
function templateDraft(c){
  var st=getStyle(),smp=pickSamples(c,1)[0],sig=((st.how.match(/podpis[^:\n]*:\s*(.+)/i)||[])[1]||'').trim(),first=!firstMsg(c);
  var nt=String(c.name||'').split(/\s+/).filter(Boolean),voc=vocative(nt[0]||'');
  var greet='Dobrý den'+(voc?', '+voc:'')+',';
  if(smp){
    var txt=smp.l.sent,ot=String(smp.c.name||'').split(/\s+/).filter(Boolean);
    if(ot[0]&&nt[0]&&ot[0].length>2){txt=txt.replace(new RegExp(escRe(vocative(ot[0])),'g'),voc||nt[0]);txt=txt.replace(new RegExp(escRe(ot[0]),'g'),nt[0])}
    if(ot.length>1&&nt.length>1&&ot[ot.length-1].length>2)txt=txt.replace(new RegExp(escRe(ot[ot.length-1]),'g'),nt[nt.length-1]);
    if(smp.c.field&&c.field&&norm(smp.c.field)!==norm(c.field))txt=txt.replace(new RegExp(escRe(smp.c.field),'gi'),c.field);
    if(sig&&txt.indexOf(sig)<0)txt=txt.replace(/\s+$/,'')+'\n\n'+sig;
    return txt;
  }
  var offer=sentence((st.offer.trim().split(/[.!?]\s+/)[0]||'').trim()),ls=lastSentMsg(c);
  if(first){
    var l1=sentence('ozývám se Vám'+(c.field?' v souvislosti s oborem '+c.field:'')+(c.desc?' ('+c.desc.replace(/[.!?]+$/,'')+')':''));
    return [greet,'',[l1,offer].filter(Boolean).join(' '),'','Máte chvilku na krátký hovor, nebo Vám mám poslat víc informací e-mailem?','','Děkuji a přeji hezký den'+(sig?'\n'+sig:'')].join('\n');
  }
  var f1=sentence('jen se krátce vracím k mé předchozí zprávě'+(ls?' z '+fmtShort(ymd(new Date(ls.at))):''));
  return [greet,'',[f1,offer].filter(Boolean).join(' '),'','Pokud to teď není aktuální, klidně mi dejte vědět a nebudu Vás dále obtěžovat.','','Přeji hezký den'+(sig?'\n'+sig:'')].join('\n');
}

async function cpAi(mode){
  var st=$('#cp-status'),btns=[].slice.call(dlg.el.querySelectorAll('[data-act=cp-ai]'));

function apiError(status,d){
  var m=d&&d.error&&d.error.message?d.error.message:'';
  if(status===401)return 'Klíč nebyl přijat (401). Zkontroluj ho v Nastavení, nebo vytvoř nový v konzoli Anthropic.';
  if(status===403)return 'Klíč nemá oprávnění (403). Zkontroluj ho a nastavení účtu v konzoli Anthropic.';
  if(status===404)return 'Model „'+AI_MODEL+'“ není pro tenhle klíč dostupný (404).';
  if(status===429)return 'Je dosažen limit požadavků nebo útraty (429). Počkej chvíli, případně limit zvyš v konzoli Anthropic.';
  if(status===400&&/credit|balance/i.test(m))return 'Na účtu Anthropic nejsou kredity (400). Dobij je v konzoli Anthropic.';
  if(status===529||status>=500)return 'Služba Anthropic je přetížená nebo nedostupná ('+status+'). Zkus to za chvíli.';
  return 'Chyba API ('+status+')'+(m?': '+m:'')+'.';
}
/* jediné místo, kde appka posílá data ven: přímé volání api.anthropic.com s klíčem uživatele (žádná telemetrie) */
async function callClaude(content){
  var key=getKey();if(!key)throw new Error('Nejdřív vlož API klíč v Nastavení.');
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},60000),res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ctl.signal,
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:AI_MODEL,max_tokens:600,system:'Píšeš za uživatele oslovovací zprávy v češtině podle jeho stylu a vzorů. Odpovídej pouze textem zprávy.',messages:[{role:'user',content:content}]})});
  }catch(e){clearTimeout(to);throw new Error(e&&e.name==='AbortError'?'Claude neodpověděl do 60 s. Zkus to znovu.':'Nepodařilo se spojit s api.anthropic.com. Zkontroluj připojení (nebo blokování rozšířením prohlížeče).')}
  clearTimeout(to);
  var data=null;try{data=await res.json()}catch(e){}
  if(!res.ok)throw new Error(apiError(res.status,data));
  var txt=((data&&data.content)||[]).filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('\n').trim();
  if(!txt)throw new Error('Claude vrátil prázdnou odpověď. Zkus to znovu.');
  return txt;
}

function gridKey(e){
  var k=e.key,mod=e.ctrlKey||e.metaKey;
  if(mod){
    var l=k.toLowerCase();
    if(l==='z'){e.preventDefault();e.shiftKey?redo():undo()}
    else if(l==='y'){e.preventDefault();redo()}
    else if(l==='a'){e.preventDefault();anc={id:view.length?view[0].id:ADD,c:0};cur={id:view.length?view[view.length-1].id:ADD,c:VC.length-1};extras=[];paintSel()}
    else if(k==='/'){e.preventDefault();helpPop(wrap)}
    else if(k==='Enter'){e.preventDefault();if(cur.id!==ADD)msgPop(cur.id)}
    else if(k==='Home'){e.preventDefault();setCur(0,0,e.shiftKey)}
    else if(k==='End'){e.preventDefault();setCur(view.length-1,VC.length-1,e.shiftKey)}
    else if(k.indexOf('Arrow')===0){e.preventDefault();moveCur(k==='ArrowDown'?1:k==='ArrowUp'?-1:0,k==='ArrowRight'?1:k==='ArrowLeft'?-1:0,e.shiftKey,true)}
    return;
  }
  if(e.altKey){var a=k.toLowerCase();if(a==='n'){e.preventDefault();openPanel(null)}else if(a==='w'){e.preventDefault();if(cur.id!==ADD)openCompose(cur.id)}else if(a==='m'){e.preventDefault();if(cur.id!==ADD)msgPop(cur.id)}else if(a==='h'){e.preventDefault();$('#fs').focus()}return}
  switch(k){
    case 'ArrowDown':e.preventDefault();moveCur(1,0,e.shiftKey);break;
    case 'ArrowUp':e.preventDefault();moveCur(-1,0,e.shiftKey);break;
    case 'ArrowRight':e.preventDefault();moveCur(0,1,e.shiftKey);break;
    case 'ArrowLeft':e.preventDefault();moveCur(0,-1,e.shiftKey);break;
    case 'PageDown':e.preventDefault();moveCur(10,0,e.shiftKey);break;
    case 'PageUp':e.preventDefault();moveCur(-10,0,e.shiftKey);break;
    case 'Home':e.preventDefault();moveCur(0,-1,e.shiftKey,true);break;
    case 'End':e.preventDefault();moveCur(0,1,e.shiftKey,true);break;
    case 'Tab':{
      var i=idxOf(cur.id),c=cur.c+(e.shiftKey?-1:1);
      if(c<0){if(i===0)return;e.preventDefault();setCur(i-1,VC.length-1);return}
      if(c>=VC.length){if(i>=view.length)return;e.preventDefault();setCur(i+1,0);return}
      e.preventDefault();setCur(i,c);return}
    case 'Enter':e.preventDefault();if(e.shiftKey)insertBelow();else startEdit();break;
    case 'F2':e.preventDefault();startEdit();break;
    case ' ':e.preventDefault();if(cur.id!==ADD)openPanel(cur.id);break;
    case 'Delete':case 'Backspace':e.preventDefault();clearRanges();break;
    case 'Escape':if(picked.size){picked.clear();renderBulk();render()}else if(extras.length||range().r1!==range().r2||range().c1!==range().c2)setCur(idxOf(cur.id),cur.c);else wrap.blur();break;
    case '/':e.preventDefault();$('#fs').focus();break;
    default:
      if((k==='n'||k==='N')&&!e.isComposing&&VC[cur.c].t==='ro'){e.preventDefault();openPanel(null);break}   // v čtecím sloupci nic nepíšeš, takže N = nový kontakt (v editovatelném sloupci by N přebilo psaní jmen; tam funguje Alt+N)
      if(k.length===1&&!e.isComposing&&VC[cur.c].t!=='ro'){e.preventDefault();startEdit(k)}
  }
}

    if(e.key==='Tab'){var f=[].slice.call(document.querySelectorAll('.panel button,.panel input,.panel select,.panel textarea')).filter(function(x){return !x.disabled});if(!f.length)return;var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){var b=document.querySelector(t.id==='m-text'?'[data-p=addlog]':'[data-p=save]');if(b)b.click()}
    return;
  }
  if(ce&&ce.input&&t===ce.input){editorKey(e);return}
  if(t===wrap){if(ce&&ce.kind==='status'){menuKey(e);return}gridKey(e);return}
  if(t.id==='fs'){
    if(e.key==='Escape'){if(t.value){t.value='';fSearch='';render()}else wrap.focus({preventScroll:true})}
    else if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();wrap.focus({preventScroll:true})}
    return;
  }
  if(e.key==='Escape'&&pop){closePop();return}
  if(e.key==='/'&&(e.ctrlKey||e.metaKey)){e.preventDefault();helpPop(wrap);return}
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&/^[zy]$/i.test(e.key)&&t.tagName!=='INPUT'&&t.tagName!=='TEXTAREA'&&t.tagName!=='SELECT'&&!(t.isContentEditable)){e.preventDefault();if(/y/i.test(e.key)||e.shiftKey)redo();else undo();return}
  var tg=t.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(t===document.body&&/^Arrow/.test(e.key)&&!isMobile()){wrap.focus({preventScroll:true});gridKey(e);return}
  if(t.closest&&t.closest('.pop'))return;
  if(e.key==='n'){e.preventDefault();openPanel(null)}
  if(e.key==='/'){e.preventDefault();$('#fs').focus()}
  if(e.key==='?'){e.preventDefault();helpPop(wrap)}
});
document.addEventListener('input',function(e){
  if(e.target.id==='fs'){var fv=e.target.value;clearTimeout(window.__fst);window.__fst=setTimeout(function(){fSearch=fv;render()},150)}
  if(e.target.classList&&e.target.classList.contains('cv-x')&&cv)cv.turns[+e.target.dataset.i].text=e.target.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='file'){var f=t.files[0];if(f)readFileText(f,function(tx){importText(f.name,tx)});t.value='';return}
  if(t.id==='b-status'&&t.value){var v=t.value;bulkApply(function(c){c.status=v;return c},'změna stavu');return}
  if(t.id==='b-due'&&t.value){bulkDue(t.value);return}
  if(t.id==='im-file'){var f0=t.files[0];if(f0)readFileText(f0,function(tx){$('#im-text').value=tx;impParse()});t.value='';return}
  if(t.classList&&t.classList.contains('im-sel')){imp.groups[+t.dataset.g].sel=t.value;impSummary();return}
  if(t.classList&&t.classList.contains('cv-who')){cv.turns[+t.dataset.i].who=t.value;return}
  if(t.classList&&t.classList.contains('cv-d')){cv.turns[+t.dataset.i].date=t.value;return}
  if(t.id==='mem-how'||t.id==='mem-offer'){lsSet(STYLEKEY,{how:$('#mem-how').value,offer:$('#mem-offer').value});return}
  if(t.id==='s-base'||t.id==='s-prog'||t.id==='s-steps'){var io=ui.intv||{};var rawB=+$('#s-base').value;io.base=clamp(rawB||7,1,365);if(rawB!==io.base)toast('Základní interval musí být 1 až 365 dní, nastavil jsem '+io.base+'.');$('#s-base').value=io.base;io.prog=$('#s-prog').checked;io.steps=parseSteps($('#s-steps').value);ui.intv=io;saveUi();$('#s-steps').value=io.steps.join(', ');render();return}
  if(t.id==='s-time'){ui.remind=Object.assign(ui.remind||{},{time:t.value||'09:00'});saveUi();return}
  if(t.id==='df-date'&&pop&&pop.kind==='datefix'){var nx=$('#df-next');if(nx&&!nx.dataset.touched&&pop.dfGap!=null&&t.value)nx.value=addDays(t.value,pop.dfGap);return}
  if(t.id==='df-next'){t.dataset.touched='1';return}
  if(t.id==='p-date'){t.dataset.touched='1';return}
  if(t.id==='m-fu'){t.dataset.touched='1';$('#m-fud').hidden=t.value!=='custom';return}
  if(t.id==='m-outcome'){var fu=$('#m-fu');if(fu&&!fu.dataset.touched&&fu.options[0].value!=='keep'){var term=['odmitl','schuzka','zajem'].indexOf(t.value)>=0;fu.value=term?'none':String(+ui.fuDays||7);$('#m-fud').hidden=true}return}
  if(t.id==='dp'&&ce&&ce.input){ce.input.value=t.value;commitEdit('none');return}
  if(t.dataset&&t.dataset.col){
    var hide=hiddenCols();hide=hide.filter(function(x){return x!==t.dataset.col});if(!t.checked)hide.push(t.dataset.col);ui.hide=hide;saveUi();
    var kept=pop;render();pop=kept;placePop();return;
  }
});
document.addEventListener('keydown',function(e){   // Enter v poli Obor v hromadné liště
  if(e.target.id==='b-field'&&e.key==='Enter'){e.preventDefault();var b=document.querySelector('[data-bulk=field]');if(b)b.click()}
});
/* schránka */
function gridActive(){return !editing&&!ce&&document.activeElement===wrap}
document.addEventListener('copy',function(e){if(!gridActive())return;e.clipboardData.setData('text/plain',rangeTsv());e.preventDefault();toast('Zkopírováno')});
document.addEventListener('cut',function(e){if(!gridActive())return;e.clipboardData.setData('text/plain',rangeTsv());e.preventDefault();clearRanges()});
document.addEventListener('paste',function(e){if(!gridActive())return;var t=e.clipboardData.getData('text/plain');if(!t)return;e.preventDefault();doPaste(t)});

/* ---------- start ---------- */
var rawBefore=null;try{rawBefore=localStorage.getItem(KEY)}catch(e){}
contacts=load();snapAll();
if(contacts.some(needsMig)){   // jednorázová migrace starých dat (původní data zůstanou zálohovaná)
  try{if(rawBefore&&!localStorage.getItem(KEY+'_premigrace'))localStorage.setItem(KEY+'_premigrace',rawBefore)}catch(e){}
  contacts.forEach(migrateContact);persistAll();
}
render();
/* přepočet „dnes / po termínu“: každou minutu hlídáme změnu dne a hodiny, při návratu na kartu vždy */
var lastDay=today(),lastHour=new Date().getHours();
function idle(){return !editing&&!ce&&!pop}
function tick(){
  var t=today(),h=new Date().getHours();
  if((t!==lastDay||h!==lastHour)&&idle()){lastDay=t;lastHour=h;render()}
  timedNotify();
}
function resume(){
  if(document.visibilityState!=='visible')return;
  if(idle()){lastDay=today();lastHour=new Date().getHours();render()}
  timedNotify();
}
setInterval(tick,60*1000);
document.addEventListener('visibilitychange',resume);
window.addEventListener('focus',resume);
timedNotify();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  var hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtl)toast('Je dostupná nová verze appky.',null,[{l:'Obnovit',fn:function(){location.reload()}}]);hadCtl=true});
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
