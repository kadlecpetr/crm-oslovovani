<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oslovovací CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: hlavička, filtry, jeden seznam kontaktů, detail kontaktu jako boční panel. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eaeef3; --ink:#16202e; --muted:#5d6b7e; --line:#d9e0e8;
  --accent:#0f6e66; --accent-ink:#ffffff; --late:#c2362b; --late-bg:#fbe9e7; --warn:#a15c07; --warn-bg:#fcf0dc; --ok:#1d7a46; --ok-bg:#e2f4e9;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'Instrument Sans',system-ui,sans-serif;
  --shadow:0 12px 40px rgba(20,32,50,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --surface:#171f2a; --surface2:#212b38; --ink:#e8edf3; --muted:#92a0b2; --line:#2a3646;
  --accent:#3cc2b4; --accent-ink:#06201d; --late:#ff8a7e; --late-bg:#3a1c19; --warn:#f0b35a; --warn-bg:#35270f; --ok:#6fd49a; --ok-bg:#12301f;
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --surface:#171f2a; --surface2:#212b38; --ink:#e8edf3; --muted:#92a0b2; --line:#2a3646;
  --accent:#3cc2b4; --accent-ink:#06201d; --late:#ff8a7e; --late-bg:#3a1c19; --warn:#f0b35a; --warn-bg:#35270f; --ok:#6fd49a; --ok-bg:#12301f;
  --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:980px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:22px 0 14px}
h1{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--late)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.filters input{flex:1 1 200px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;align-items:center}
.row.late{border-left:4px solid var(--late)}
.row.today{border-left:4px solid var(--warn)}
.main{min-width:0;cursor:pointer}
.name{font-weight:600;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--surface2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.st{background:transparent;border:1px solid var(--line);color:var(--muted)}
.st.s-win{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.st.s-lost{opacity:.7}
.due{font-size:13px;font-weight:600;white-space:nowrap}
.due.late{color:var(--late)} .due.today{color:var(--warn)} .due.none{color:var(--muted);font-weight:400}
.act{font-size:13.5px;margin-top:4px}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--ink);margin:0 0 6px;font-size:18px}
/* panel */
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.5);z-index:20;display:flex;justify-content:flex-end}
.panel{background:var(--surface);width:min(520px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);
  padding:20px max(16px,env(safe-area-inset-right,0px)) 40px 20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.panel h3{font-family:var(--f-display);font-size:20px;margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin:12px 0 4px;letter-spacing:.02em}
.panel input,.panel select,.panel textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.two{grid-template-columns:1fr}.row{grid-template-columns:1fr}.side{align-items:flex-start}}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sec{border-top:1px solid var(--line);margin-top:22px;padding-top:4px}
.sec h4{font-family:var(--f-display);margin:12px 0 0;font-size:15px}
.log{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:10px}
.log li{border-left:2px solid var(--line);padding-left:12px}
.log .when{font-size:12px;color:var(--muted)}
.log .t{font-weight:600;font-size:13px}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-size:14px}
@media(prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{transform:translateX(30px);opacity:0}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Oslovovací CRM</h1><div class="sub" id="sub"></div></div>
    <button class="btn primary" id="add">+ Nový kontakt</button>
  </header>
  <div class="filters">
    <input id="fs" type="search" placeholder="Hledat jméno, kontakt, popis…" aria-label="Hledat">
    <select id="ff" aria-label="Obor"></select>
    <select id="fst" aria-label="Stav"></select>
  </div>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';
var STATUSES=[['novy','Nový / zatím neoslovený'],['osloven','Osloven'],['ceka','Čekám na odpověď'],['kontakt','V kontaktu'],['schuzka','Schůzka domluvena'],['spoluprace','Spolupráce'],['nezajem','Nezájem']];
var LOGTYPES=[['napsal','Napsal jsem'],['odpoved','Odpověděl mi'],['hovor','Hovor'],['schuzka','Schůzka'],['vysledek','Výsledek'],['poznamka','Poznámka']];
var contacts=[], fSearch='', fField='', fStatus='';
var $=function(s){return document.querySelector(s)};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function addDays(base,n){var p=base.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return ymd(d)}
function diffDays(a,b){var pa=a.split('-'),pb=b.split('-');return Math.round((new Date(+pa[0],+pa[1]-1,+pa[2])-new Date(+pb[0],+pb[1]-1,+pb[2]))/864e5)}
function fmtDate(s){if(!s)return '';var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric'})}
function fmtStamp(iso){return new Date(iso).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}
function statusLabel(k){for(var i=0;i<STATUSES.length;i++)if(STATUSES[i][0]===k)return STATUSES[i][1];return k}
function typeLabel(k){for(var i=0;i<LOGTYPES.length;i++)if(LOGTYPES[i][0]===k)return LOGTYPES[i][1];return k}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function fieldChip(f){if(!f)return '<span class="chip st">bez oboru</span>';return '<span class="chip"><span class="dot" style="background:hsl('+hue(f.toLowerCase())+' 62% 50%)"></span>'+esc(f)+'</span>'}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}

/* ---------- úložiště (localStorage) ---------- */
var KEY='crm_contacts';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function persistAll(){try{localStorage.setItem(KEY,JSON.stringify(contacts))}catch(e){toast('Uložení se nepovedlo')}}
function saveContact(c){var i=contacts.findIndex(function(x){return x.id===c.id});if(i<0)contacts.push(c);else contacts[i]=c;persistAll();render()}
function removeContact(id){contacts=contacts.filter(function(x){return x.id!==id});persistAll();render()}

/* ---------- logika ---------- */
function fields(){var m={};contacts.forEach(function(c){if(c.field)m[c.field]=(m[c.field]||0)+1});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'cs')})}
function filtered(){
  var q=fSearch.trim().toLowerCase();
  return contacts.filter(function(c){
    if(fField&&(c.field||'')!==fField)return false;
    if(fStatus&&c.status!==fStatus)return false;
    if(q&&[c.name,c.contact,c.desc,c.field,c.nextAction].join(' ').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function sortByDue(a,b){return (a.nextDate||'9999').localeCompare(b.nextDate||'9999')||a.name.localeCompare(b.name,'cs')}
/* ---------- vykreslení ---------- */
function dueHtml(c){
  if(!c.nextDate)return '<span class="due none">bez follow-upu</span>';
  var d=diffDays(c.nextDate,today());
  if(d<0)return '<span class="due late">po termínu '+(-d)+' d ('+fmtDate(c.nextDate)+')</span>';
  if(d===0)return '<span class="due today">dnes</span>';
  if(d===1)return '<span class="due">zítra</span>';
  return '<span class="due">'+fmtDate(c.nextDate)+'</span>';
}
function rowHtml(c){
  var d=c.nextDate?diffDays(c.nextDate,today()):null;
  var cls=d!==null&&d<0?' late':d===0?' today':'';
  var sc=c.status==='spoluprace'?' s-win':c.status==='nezajem'?' s-lost':'';
  return '<div class="row'+cls+'" data-id="'+esc(c.id)+'">'+
    '<div class="main" data-act="open"><div class="name">'+esc(c.name)+'</div>'+
    (c.desc?'<div class="desc">'+esc(c.desc)+'</div>':'')+
    (c.nextAction&&c.nextDate?'<div class="act">→ '+esc(c.nextAction)+'</div>':'')+
    '<div class="meta">'+fieldChip(c.field)+'<span class="chip st'+sc+'">'+esc(statusLabel(c.status))+'</span>'+
    (c.contact?'<span class="desc">'+esc(c.contact)+'</span>':'')+'</div></div>'+
    '<div class="side">'+dueHtml(c)+'</div></div>';
}
function listHtml(arr){return '<div class="list">'+arr.map(rowHtml).join('')+'</div>'}

function render(){
  $('#sub').textContent=contacts.length?contacts.length+' kontaktů':'Zatím nic nezaznamenáno';
  $('#ff').innerHTML='<option value="">Všechny obory</option>'+fields().map(function(f){return '<option'+(f===fField?' selected':'')+'>'+esc(f)+'</option>'}).join('');
  $('#fst').innerHTML='<option value="">Všechny stavy</option>'+STATUSES.map(function(s){return '<option value="'+s[0]+'"'+(s[0]===fStatus?' selected':'')+'>'+esc(s[1])+'</option>'}).join('');
  var v;
  if(!contacts.length){
    v='<div class="empty"><h3>Zatím tu nikdo není</h3>Přidej prvního člověka, kterého jsi oslovil nebo chceš oslovit.</div>';
  } else {
    var a=filtered().sort(sortByDue);
    v=a.length?listHtml(a):'<div class="empty">Nic neodpovídá filtru.</div>';
  }
  $('#view').innerHTML=v;
}

/* ---------- panel kontaktu ---------- */
var editing=null; // kopie kontaktu
function openPanel(id){
  var c=id?contacts.find(function(x){return x.id===id}):null;
  editing=c?JSON.parse(JSON.stringify(c)):{id:uid(),name:'',contact:'',desc:'',field:'',status:'novy',nextDate:'',nextAction:'',created:new Date().toISOString(),log:[]};
  editing._new=!c;
  drawPanel();
  if(!c){var n=$('#p-name');if(n)n.focus()}
}
function drawPanel(){
  var c=editing,t=today();
  var logs=(c.log||[]).slice().sort(function(a,b){return b.at.localeCompare(a.at)});
  $('#layer').innerHTML='<div class="overlay" id="ov"><div class="panel" role="dialog" aria-label="Kontakt">'+
   '<div class="ph"><h3>'+(c._new?'Nový kontakt':esc(c.name||'Kontakt'))+'</h3><button class="btn sm" data-p="close">Zavřít</button></div>'+
   '<label for="p-name">Jméno</label><input id="p-name" value="'+esc(c.name)+'" autocomplete="off">'+
   '<label for="p-contact">Kontakt (e-mail, telefon, LinkedIn…)</label><input id="p-contact" value="'+esc(c.contact)+'" autocomplete="off">'+
   '<div class="two"><div><label for="p-field">Obor</label><input id="p-field" list="fieldlist" value="'+esc(c.field)+'" placeholder="např. Marketing" autocomplete="off"><datalist id="fieldlist">'+fields().map(function(f){return '<option value="'+esc(f)+'">'}).join('')+'</datalist></div>'+
   '<div><label for="p-status">Stav</label><select id="p-status">'+STATUSES.map(function(s){return '<option value="'+s[0]+'"'+(s[0]===c.status?' selected':'')+'>'+esc(s[1])+'</option>'}).join('')+'</select></div></div>'+
   '<label for="p-desc">Krátký popis</label><textarea id="p-desc" placeholder="Kdo to je, odkud ho znám, proč ho oslovuju">'+esc(c.desc)+'</textarea>'+
   '<div class="sec"><h4>Follow-up</h4><div class="two"><div><label for="p-date">Kdy se ozvat</label><input id="p-date" type="date" value="'+esc(c.nextDate)+'"></div>'+
   '<div><label for="p-act">Co udělat</label><input id="p-act" value="'+esc(c.nextAction)+'" placeholder="Připomenout nabídku" autocomplete="off"></div></div>'+
   '<div class="quick"><button class="btn sm" data-q="1">Zítra</button><button class="btn sm" data-q="3">Za 3 dny</button><button class="btn sm" data-q="7">Za týden</button><button class="btn sm" data-q="14">Za 2 týdny</button><button class="btn sm" data-q="30">Za měsíc</button><button class="btn sm" data-q="0">Bez follow-upu</button></div></div>'+
   '<div class="foot"><button class="btn primary" data-p="save">Uložit</button>'+(c._new?'':'<button class="btn danger" data-p="del">Smazat kontakt</button>')+'</div>'+
   (c._new?'<div class="hint">Historii komunikace můžeš zapisovat po prvním uložení.</div>':
   '<div class="sec"><h4>Zapsat komunikaci a výsledek</h4>'+
   '<div class="two"><div><label for="logtype">Druh</label><select id="logtype">'+LOGTYPES.map(function(s){return '<option value="'+s[0]+'">'+s[1]+'</option>'}).join('')+'</select></div>'+
   '<div><label for="lognext">Další follow-up</label><select id="lognext"><option value="keep">Nechat jak je</option><option value="1">Zítra</option><option value="3">Za 3 dny</option><option value="7">Za týden</option><option value="14">Za 2 týdny</option><option value="30">Za měsíc</option><option value="0">Žádný (hotovo)</option></select></div></div>'+
   '<label for="logtext">Co se stalo / jak to dopadlo</label><textarea id="logtext" placeholder="Napsal jsem mu na LinkedIn, slíbil odpověď do pátku…"></textarea>'+
   '<div class="foot"><button class="btn primary" data-p="addlog">Přidat záznam</button></div>'+
   '<ul class="log">'+(logs.length?logs.map(function(l){return '<li><div class="when">'+fmtStamp(l.at)+'</div><div class="t">'+esc(typeLabel(l.type))+'</div>'+(l.text?'<div>'+esc(l.text)+'</div>':'')+'</li>'}).join(''):'<li class="hint" style="border:0;padding:0">Zatím žádné záznamy.</li>')+'</ul></div>')+
   '</div></div>';
}
function readForm(){
  var c=editing;
  c.name=$('#p-name').value.trim();c.contact=$('#p-contact').value.trim();c.field=$('#p-field').value.trim();
  c.status=$('#p-status').value;c.desc=$('#p-desc').value.trim();c.nextDate=$('#p-date').value;c.nextAction=$('#p-act').value.trim();
}
function stripNew(c){var o=Object.assign({},c);delete o._new;return o}
function closePanel(){editing=null;$('#layer').innerHTML=''}
function persist(c,msg){saveContact(stripNew(c));if(msg)toast(msg)}

/* ---------- události ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-p],[data-q],#add');if(!el)return;
  if(el.id==='add'){openPanel(null);return}
  if(el.dataset.act==='open'){openPanel(el.closest('.row').dataset.id);return}
  if(el.dataset.q!==undefined&&editing){
    var n=+el.dataset.q;$('#p-date').value=n?addDays(today(),n):'';return;
  }
  if(el.dataset.p){
    var a=el.dataset.p;
    if(a==='close')closePanel();
    else if(a==='save'){
      readForm();if(!editing.name){toast('Doplň jméno');$('#p-name').focus();return}
      var isNew=editing._new;
      persist(editing,'Uloženo');if(isNew){editing._new=false;drawPanel()}else closePanel();
    }
    else if(a==='addlog'){
      readForm();if(!editing.name){toast('Doplň jméno');return}
      var text=$('#logtext').value.trim(),type=$('#logtype').value,nx=$('#lognext').value;
      if(!text&&type==='poznamka'){toast('Napiš poznámku');return}
      editing.log=(editing.log||[]).concat([{at:new Date().toISOString(),type:type,text:text}]);
      if(nx!=='keep'){editing.nextDate=nx==='0'?'':addDays(today(),+nx)}
      if(type==='napsal'&&(editing.status==='novy'))editing.status='osloven';
      if(type==='odpoved'&&(editing.status==='osloven'||editing.status==='ceka'||editing.status==='novy'))editing.status='kontakt';
      if(type==='schuzka'&&editing.status!=='spoluprace')editing.status='schuzka';
      persist(editing,'Záznam přidán');drawPanel();
    }
    else if(a==='del'){
      if(el.dataset.sure){removeContact(editing.id);closePanel();toast('Smazáno')}
      else{el.dataset.sure='1';el.textContent='Opravdu smazat?'}
    }
  }
});
document.addEventListener('mousedown',function(e){if(e.target.id==='ov')closePanel()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&editing)closePanel()});
document.addEventListener('input',function(e){
  if(e.target.id==='fs'){fSearch=e.target.value;render()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='ff'){fField=e.target.value;render()}
  if(e.target.id==='fst'){fStatus=e.target.value;render()}
});

/* ---------- start ---------- */
contacts=load();
render();
setInterval(function(){if(!editing&&document.visibilityState==='visible')render()},5*60*1000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!editing)render()});
})();
</script>
</body>
</html>
