<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oslovovací CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Minimalistický layout: hlavička, filtry, jedna tabulka kontaktů, detail jako boční panel. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f4f4f2; --ink:#1c1c1a; --muted:#8a8a85; --line:#ececea;
  --accent:#0f6e66; --accent-ink:#ffffff; --late:#c2362b; --warn:#c26a0a;
  --f-body:'Instrument Sans',system-ui,sans-serif;
  --overlay:rgba(20,20,18,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#141413; --surface2:#1f1f1d; --ink:#ebebe8; --muted:#8c8c86; --line:#262624;
  --accent:#3cc2b4; --accent-ink:#06201d; --late:#ff8a7e; --warn:#f0a94a; --overlay:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#141413; --surface2:#1f1f1d; --ink:#ebebe8; --muted:#8c8c86; --line:#262624;
  --accent:#3cc2b4; --accent-ink:#06201d; --late:#ff8a7e; --warn:#f0a94a; --overlay:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:900px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:40px 0 20px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{border:0;background:transparent;border-radius:6px;padding:7px 12px;font-weight:500;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn.sm{padding:4px 8px;font-size:13px;color:var(--muted)}
.btn.danger{color:var(--late)}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters input,.filters select{background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:8px 10px;min-width:0;font-size:14px}
.filters input{flex:1 1 auto}
.filters select{flex:0 1 170px;color:var(--muted)}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--accent)}
.list{border-top:1px solid var(--line)}
.row,.thead{display:grid;grid-template-columns:minmax(0,1fr) 150px 170px 96px;gap:0 20px;align-items:center}
.sub2{display:contents}
.thead{padding:10px 0;font-size:12px;color:var(--muted)}
.row{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--surface2);box-shadow:-10px 0 0 var(--surface2),10px 0 0 var(--surface2)}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.field{color:var(--ink)}
.due{font-size:14px;color:var(--muted);white-space:nowrap;text-align:right}
.due.late{color:var(--late)} .due.today{color:var(--warn);font-weight:700}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.empty p{margin:0 0 16px}
/* panel */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;justify-content:flex-end}
.panel{background:var(--surface);width:min(480px,100%);height:100%;overflow-y:auto;
  padding:28px max(24px,env(safe-area-inset-right,0px)) 48px 24px;padding-top:calc(28px + env(safe-area-inset-top,0px))}
.panel h3{font-size:18px;font-weight:600;margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin:18px 0 4px}
.panel input,.panel select,.panel textarea{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:8px 10px;min-width:0}
.panel input:focus,.panel select:focus,.panel textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:8px}
.quick button{background:none;border:0;padding:2px 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.quick button:hover{color:var(--ink)}
.sec{margin-top:32px}
.log{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:84px 1fr;gap:12px;font-size:14px}
.log .when{color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:24px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:30;font-size:14px}
@media(max-width:600px){
  header{padding-top:28px}
  .thead{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0}
  .row .main{grid-column:1;grid-row:1}
  .row .due{grid-column:2;grid-row:1}
  .row .sub2{grid-column:1 / -1;grid-row:2;display:flex;gap:8px;min-width:0;font-size:13px;color:var(--muted)}
  .row .sub2 .cell{font-size:13px}
  .row .sub2 .cell:empty{display:none}
  .row .sub2 .cell+.cell::before{content:"·";margin-right:8px}
  .row:hover{box-shadow:none}
  .two{grid-template-columns:1fr}
  .filters{flex-wrap:wrap}.filters input{flex-basis:100%}.filters select{flex:1 1 0}
}
@media(prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:0}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Oslovovací CRM</h1>
    <button class="btn primary" id="add">+ Nový</button>
  </header>
  <div class="filters">
    <input id="fs" type="search" placeholder="Hledat…" aria-label="Hledat">
    <select id="ff" aria-label="Obor"></select>
    <select id="fst" aria-label="Stav"></select>
  </div>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';
var STATUSES=[['novy','Nový / zatím neoslovený'],['osloven','Osloven'],['ceka','Čekám na odpověď'],['kontakt','V kontaktu'],['schuzka','Schůzka domluvena'],['spoluprace','Spolupráce'],['nezajem','Nezájem']];
var LOGTYPES=[['napsal','Napsal jsem'],['odpoved','Odpověděl mi'],['hovor','Hovor'],['schuzka','Schůzka'],['vysledek','Výsledek'],['poznamka','Poznámka']];
var contacts=[], fSearch='', fField='', fStatus='';
var $=function(s){return document.querySelector(s)};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function addDays(base,n){var p=base.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return ymd(d)}
function diffDays(a,b){var pa=a.split('-'),pb=b.split('-');return Math.round((new Date(+pa[0],+pa[1]-1,+pa[2])-new Date(+pb[0],+pb[1]-1,+pb[2]))/864e5)}
function fmtDate(s){if(!s)return '';var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric'})}
function fmtStamp(iso){return new Date(iso).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}
function statusLabel(k){for(var i=0;i<STATUSES.length;i++)if(STATUSES[i][0]===k)return STATUSES[i][1];return k}
function typeLabel(k){for(var i=0;i<LOGTYPES.length;i++)if(LOGTYPES[i][0]===k)return LOGTYPES[i][1];return k}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}

/* ---------- úložiště (localStorage) ---------- */
var KEY='crm_contacts';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function persistAll(){try{localStorage.setItem(KEY,JSON.stringify(contacts))}catch(e){toast('Uložení se nepovedlo')}}
function saveContact(c){var i=contacts.findIndex(function(x){return x.id===c.id});if(i<0)contacts.push(c);else contacts[i]=c;persistAll();render()}
function removeContact(id){contacts=contacts.filter(function(x){return x.id!==id});persistAll();render()}

/* ---------- logika ---------- */
function fields(){var m={};contacts.forEach(function(c){if(c.field)m[c.field]=(m[c.field]||0)+1});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,'cs')})}
function filtered(){
  var q=fSearch.trim().toLowerCase();
  return contacts.filter(function(c){
    if(fField&&(c.field||'')!==fField)return false;
    if(fStatus&&c.status!==fStatus)return false;
    if(q&&[c.name,c.contact,c.desc,c.field,c.nextAction].join(' ').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function sortByDue(a,b){return (a.nextDate||'9999').localeCompare(b.nextDate||'9999')||a.name.localeCompare(b.name,'cs')}
/* ---------- vykreslení ---------- */
function dueHtml(c){
  if(!c.nextDate)return '<span class="due">–</span>';
  var d=diffDays(c.nextDate,today());
  if(d<0)return '<span class="due late" title="po termínu '+(-d)+' d">'+fmtDate(c.nextDate)+'</span>';
  if(d===0)return '<span class="due today">dnes</span>';
  if(d===1)return '<span class="due">zítra</span>';
  return '<span class="due">'+fmtDate(c.nextDate)+'</span>';
}
function rowHtml(c){
  return '<div class="row" data-id="'+esc(c.id)+'" data-act="open">'+
    '<div class="main"><div class="name">'+esc(c.name)+'</div>'+(c.desc?'<div class="desc">'+esc(c.desc)+'</div>':'')+'</div>'+
    '<div class="sub2"><div class="cell field">'+(c.field?esc(c.field):'')+'</div><div class="cell">'+esc(statusLabel(c.status))+'</div></div>'+
    dueHtml(c)+'</div>';
}
function listHtml(arr){return '<div class="list"><div class="thead"><div>Jméno</div><div>Obor</div><div>Stav</div><div style="text-align:right">Follow-up</div></div>'+arr.map(rowHtml).join('')+'</div>'}

function render(){
  $('#ff').innerHTML='<option value="">Všechny obory</option>'+fields().map(function(f){return '<option'+(f===fField?' selected':'')+'>'+esc(f)+'</option>'}).join('');
  $('#fst').innerHTML='<option value="">Všechny stavy</option>'+STATUSES.map(function(s){return '<option value="'+s[0]+'"'+(s[0]===fStatus?' selected':'')+'>'+esc(s[1])+'</option>'}).join('');
  var v;
  if(!contacts.length){
    v='<div class="empty"><p>Zatím tu nikdo není.</p><button class="btn primary" data-act="new">+ Nový</button></div>';
  } else {
    var a=filtered().sort(sortByDue);
    v=a.length?listHtml(a):'<div class="empty"><p>Nic neodpovídá filtru.</p></div>';
  }
  $('#view').innerHTML=v;
}

/* ---------- panel kontaktu ---------- */
var editing=null; // kopie kontaktu
function openPanel(id){
  var c=id?contacts.find(function(x){return x.id===id}):null;
  editing=c?JSON.parse(JSON.stringify(c)):{id:uid(),name:'',contact:'',desc:'',field:'',status:'novy',nextDate:'',nextAction:'',created:new Date().toISOString(),log:[]};
  editing._new=!c;
  drawPanel();
  if(!c){var n=$('#p-name');if(n)n.focus()}
}
function drawPanel(){
  var c=editing,t=today();
  var logs=(c.log||[]).slice().sort(function(a,b){return b.at.localeCompare(a.at)});
  $('#layer').innerHTML='<div class="overlay" id="ov"><div class="panel" role="dialog" aria-label="Kontakt">'+
   '<div class="ph"><h3>'+(c._new?'Nový kontakt':esc(c.name||'Kontakt'))+'</h3><button class="btn sm" data-p="close">Zavřít</button></div>'+
   '<label for="p-name">Jméno</label><input id="p-name" value="'+esc(c.name)+'" autocomplete="off">'+
   '<label for="p-contact">Kontakt (e-mail, telefon, LinkedIn…)</label><input id="p-contact" value="'+esc(c.contact)+'" autocomplete="off">'+
   '<div class="two"><div><label for="p-field">Obor</label><input id="p-field" list="fieldlist" value="'+esc(c.field)+'" placeholder="např. Marketing" autocomplete="off"><datalist id="fieldlist">'+fields().map(function(f){return '<option value="'+esc(f)+'">'}).join('')+'</datalist></div>'+
   '<div><label for="p-status">Stav</label><select id="p-status">'+STATUSES.map(function(s){return '<option value="'+s[0]+'"'+(s[0]===c.status?' selected':'')+'>'+esc(s[1])+'</option>'}).join('')+'</select></div></div>'+
   '<label for="p-desc">Krátký popis</label><textarea id="p-desc" placeholder="Kdo to je, odkud ho znám, proč ho oslovuju">'+esc(c.desc)+'</textarea>'+
   '<div class="two"><div><label for="p-date">Follow-up</label><input id="p-date" type="date" value="'+esc(c.nextDate)+'"></div>'+
   '<div><label for="p-act">Co udělat</label><input id="p-act" value="'+esc(c.nextAction)+'" placeholder="Připomenout nabídku" autocomplete="off"></div></div>'+
   '<div class="quick"><button data-q="1">Zítra</button><button data-q="3">Za 3 dny</button><button data-q="7">Za týden</button><button data-q="14">Za 2 týdny</button><button data-q="30">Za měsíc</button><button data-q="0">Bez follow-upu</button></div>'+
   '<div class="foot"><button class="btn primary" data-p="save">Uložit</button>'+(c._new?'':'<button class="btn danger" data-p="del">Smazat kontakt</button>')+'</div>'+
   (c._new?'<div class="hint">Historii komunikace můžeš zapisovat po prvním uložení.</div>':
   '<div class="sec">'+
   '<div class="two"><div><label for="logtype">Zapsat komunikaci</label><select id="logtype">'+LOGTYPES.map(function(s){return '<option value="'+s[0]+'">'+s[1]+'</option>'}).join('')+'</select></div>'+
   '<div><label for="lognext">Další follow-up</label><select id="lognext"><option value="keep">Nechat jak je</option><option value="1">Zítra</option><option value="3">Za 3 dny</option><option value="7">Za týden</option><option value="14">Za 2 týdny</option><option value="30">Za měsíc</option><option value="0">Žádný (hotovo)</option></select></div></div>'+
   '<label for="logtext">Co se stalo / jak to dopadlo</label><textarea id="logtext" placeholder="Napsal jsem mu na LinkedIn, slíbil odpověď do pátku…"></textarea>'+
   '<div class="foot"><button class="btn primary" data-p="addlog">Přidat záznam</button></div>'+
   '<ul class="log">'+logs.map(function(l){return '<li><span class="when">'+fmtStamp(l.at)+'</span><span>'+esc(typeLabel(l.type))+(l.text?' – '+esc(l.text):'')+'</span></li>'}).join('')+'</ul></div>')+
   '</div></div>';
}
function readForm(){
  var c=editing;
  c.name=$('#p-name').value.trim();c.contact=$('#p-contact').value.trim();c.field=$('#p-field').value.trim();
  c.status=$('#p-status').value;c.desc=$('#p-desc').value.trim();c.nextDate=$('#p-date').value;c.nextAction=$('#p-act').value.trim();
}
function stripNew(c){var o=Object.assign({},c);delete o._new;return o}
function closePanel(){editing=null;$('#layer').innerHTML=''}
function persist(c,msg){saveContact(stripNew(c));if(msg)toast(msg)}

/* ---------- události ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-p],[data-q],#add');if(!el)return;
  if(el.id==='add'||el.dataset.act==='new'){openPanel(null);return}
  if(el.dataset.act==='open'){openPanel(el.closest('.row').dataset.id);return}
  if(el.dataset.q!==undefined&&editing){
    var n=+el.dataset.q;$('#p-date').value=n?addDays(today(),n):'';return;
  }
  if(el.dataset.p){
    var a=el.dataset.p;
    if(a==='close')closePanel();
    else if(a==='save'){
      readForm();if(!editing.name){toast('Doplň jméno');$('#p-name').focus();return}
      var isNew=editing._new;
      persist(editing,'Uloženo');if(isNew){editing._new=false;drawPanel()}else closePanel();
    }
    else if(a==='addlog'){
      readForm();if(!editing.name){toast('Doplň jméno');return}
      var text=$('#logtext').value.trim(),type=$('#logtype').value,nx=$('#lognext').value;
      if(!text&&type==='poznamka'){toast('Napiš poznámku');return}
      editing.log=(editing.log||[]).concat([{at:new Date().toISOString(),type:type,text:text}]);
      if(nx!=='keep'){editing.nextDate=nx==='0'?'':addDays(today(),+nx)}
      if(type==='napsal'&&(editing.status==='novy'))editing.status='osloven';
      if(type==='odpoved'&&(editing.status==='osloven'||editing.status==='ceka'||editing.status==='novy'))editing.status='kontakt';
      if(type==='schuzka'&&editing.status!=='spoluprace')editing.status='schuzka';
      persist(editing,'Záznam přidán');drawPanel();
    }
    else if(a==='del'){
      if(el.dataset.sure){removeContact(editing.id);closePanel();toast('Smazáno')}
      else{el.dataset.sure='1';el.textContent='Opravdu smazat?'}
    }
  }
});
document.addEventListener('mousedown',function(e){if(e.target.id==='ov')closePanel()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&editing)closePanel()});
document.addEventListener('input',function(e){
  if(e.target.id==='fs'){fSearch=e.target.value;render()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='ff'){fField=e.target.value;render()}
  if(e.target.id==='fst'){fStatus=e.target.value;render()}
});

/* ---------- start ---------- */
contacts=load();
render();
setInterval(function(){if(!editing&&document.visibilityState==='visible')render()},5*60*1000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!editing)render()});
})();
</script>
</body>
</html>
