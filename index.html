<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oslovovací CRM</title>
<meta name="theme-color" content="#0f6e66" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oslovování">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Mřížka jako v Excelu: sticky hlavička, zmrazený sloupec Jméno, tenké čáry, inline editace. Detail kontaktu je boční panel. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f4f4f2; --ink:#1c1c1a; --muted:#6b6b66; --line:#e3e3df; --line2:#c9c9c3;
  --accent:#0f6e66; --accent-ink:#ffffff; --late:#c2362b; --warn:#a85a05;
  --turnbg:#fff4df; --head:#f1f1ee; --zebra:#fafaf8; --hover:#f0f4f3; --chkbg:#e3f1ef; --selbg:rgba(15,110,102,.13);
  --f-body:'Instrument Sans',system-ui,sans-serif;
  --overlay:rgba(20,20,18,.35); --rh:30px; --numw:46px; --ckw:34px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#141413; --surface2:#1f1f1d; --ink:#ebebe8; --muted:#9a9a94; --line:#2e2e2b; --line2:#46463f;
  --accent:#3cc2b4; --accent-ink:#06201d; --late:#ff8a7e; --warn:#f0a94a; --overlay:rgba(0,0,0,.55);
  --head:#1f1f1d; --zebra:#181817; --hover:#212625; --chkbg:#16302d; --selbg:rgba(60,194,180,.17); --turnbg:#2d2615; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#141413; --surface2:#1f1f1d; --ink:#ebebe8; --muted:#9a9a94; --line:#2e2e2b; --line2:#46463f;
  --accent:#3cc2b4; --accent-ink:#06201d; --late:#ff8a7e; --warn:#f0a94a; --overlay:rgba(0,0,0,.55);
  --head:#1f1f1d; --zebra:#181817; --hover:#212625; --chkbg:#16302d; --selbg:rgba(60,194,180,.17); --turnbg:#2d2615; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;margin:0;overflow:hidden}
.wrap{height:100dvh;display:flex;flex-direction:column;min-height:0;
  padding:0 max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 0 8px;flex:none}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{border:0;background:transparent;border-radius:6px;padding:6px 11px;font-weight:500;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn.sm{padding:4px 8px;font-size:13px;color:var(--muted)}
.btn.sm:hover{color:var(--ink)}
.btn.danger{color:var(--late)}
.hbtns{display:flex;gap:4px;align-items:center}
.toolbar{display:flex;gap:8px;align-items:center;flex:none;margin-bottom:6px}
.toolbar input[type=search]{background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:6px 10px;min-width:0;width:300px;max-width:100%;font-size:14px}
.toolbar input[type=search]:focus-visible{outline-offset:1px}
.views{display:flex;gap:2px;align-items:flex-end;flex:none;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.vt{display:inline-flex;align-items:center;gap:2px;border:0;border-bottom:2px solid transparent;background:none;padding:6px 10px 5px;color:var(--muted);font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0}
.vt:hover{background:var(--surface2);color:var(--ink)}
.vt.on{color:var(--ink);border-bottom-color:var(--accent)}
.vw{display:inline-flex;align-items:center}
.vw .vx{border:0;background:none;color:var(--muted);padding:0 5px;font-size:12px;border-radius:4px}
.vw .vx:hover{color:var(--late)}
.stats{display:flex;gap:6px;flex-wrap:wrap;flex:none;padding:8px 0;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
button.chip:hover{background:var(--surface2)}
.chip b{color:var(--ink);font-weight:600}.chip.late b{color:var(--late)}.chip.today b{color:var(--warn)}
.chip.on{background:var(--surface2);border-color:var(--accent)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--sc,var(--muted));display:inline-block}
[data-s=ignor]{--sc:#8c7a5b}[data-s=novy]{--sc:#9a9a94}[data-s=osloven]{--sc:#d4a017}[data-s=ceka]{--sc:#d4781c}[data-s=kontakt]{--sc:#2f7fd1}[data-s=schuzka]{--sc:#7c4fd0}[data-s=spoluprace]{--sc:#2a9d5c}[data-s=nezajem]{--sc:#c2362b}
/* hromadná lišta */
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;background:var(--chkbg);border:1px solid var(--accent);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.bulk[hidden]{display:none}
.bulk select,.bulk input{background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:13px;min-height:28px}
.bulk input{width:130px}
/* mřížka */
.gw{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);position:relative;overscroll-behavior:contain}
.gw:focus{outline:none}
.gw:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.g{width:max(var(--total),100%)}
.row,.hrow{display:grid;grid-template-columns:var(--cols);height:var(--rh);width:100%;border-bottom:1px solid var(--line);background:var(--rowbg,var(--surface))}
.row{content-visibility:auto;contain-intrinsic-size:auto 30px}
.row:nth-child(even){--rowbg:var(--zebra)}
.row:hover{--rowbg:var(--hover)}
.row.turn{--rowbg:var(--turnbg)}
.row.turn .cell.num{box-shadow:inset 4px 0 0 var(--warn)}
.row.chk{--rowbg:var(--chkbg)}
.row.done .cell:not(.num):not(.ck){opacity:.62}
.hrow{position:sticky;top:0;z-index:6;--rowbg:var(--head);height:32px}
.cell{min-width:0;height:100%;padding:0 8px;display:flex;align-items:center;gap:4px;border-right:1px solid var(--line);overflow:hidden;white-space:nowrap;position:relative;background:inherit}
.cell.rng{background-image:linear-gradient(var(--selbg),var(--selbg))}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.gw:not(:focus-within) .cell.sel{box-shadow:inset 0 0 0 2px var(--muted)}
.cell.num,.cell.ck{position:sticky;z-index:2;justify-content:center;padding:0;color:var(--muted);font-size:12px;background:var(--rowbg,var(--surface))}
.cell.num{left:0;background-color:var(--head)}
.cell.num.hl{background-color:var(--line);color:var(--ink);font-weight:600}
.cell.ck{left:var(--numw)}
.cell.ck input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.cell[data-k=name]{position:sticky;left:calc(var(--numw) + var(--ckw));z-index:2}
.gw.sx .cell[data-k=name]{border-right:2px solid var(--line2)}
.hrow .cell{font-size:12px;font-weight:600;color:var(--muted);gap:2px}
.hrow .cell.num,.hrow .cell.ck{z-index:8}
.hrow .cell[data-k=name]{z-index:8}
.hl2{background:none;border:0;padding:0;font-weight:600;font-size:12px;color:inherit;display:inline-flex;gap:4px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left;height:100%}
.hl2:hover{color:var(--ink)}
.ar{font-size:9px;color:var(--accent)}.ar.dim{opacity:.35}
.hf{background:none;border:0;border-radius:4px;padding:1px 4px;font-size:11px;color:var(--muted)}
.hf:hover,.hf.on{background:var(--line);color:var(--ink)}
.hf.on{color:var(--accent)}
.rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:3}
.rz:hover,.rz.drag{background:var(--accent);opacity:.5}
.t{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ph{color:var(--muted)}
.cell[data-k=name] .t{font-weight:500}
.acts{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:none;gap:2px;align-items:center;background:var(--rowbg,var(--surface));padding-left:4px}
.row:hover .acts,.cell.sel .acts,.acts:focus-within{display:flex}
.open,.msgb{height:22px;border:0;border-radius:4px;background:var(--line);color:var(--ink);font-size:12.5px;line-height:1;padding:0 6px;white-space:nowrap}
.open{width:22px;padding:0;font-size:13px}
.open:hover,.msgb:hover{background:var(--accent);color:var(--accent-ink)}
.mbtn{display:none}
.wrote{display:flex;align-items:center;gap:7px;min-width:0}
.wrote input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.wl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.turn .wl{color:var(--warn);font-weight:600}
.banner{display:flex;flex-wrap:wrap;gap:6px 8px;flex:none;align-items:center;margin:6px 0 2px}
.banner[hidden]{display:none}
.bn{border:1px solid var(--line2);border-radius:8px;background:var(--surface);padding:6px 12px;text-align:left}
.bn:hover{background:var(--surface2)}
.bn.today{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.bn.late{border-color:var(--late);background:color-mix(in srgb,var(--late) 12%,transparent)}
.bn.today b{color:var(--warn)}.bn.late b{color:var(--late)}
.bn.x{border:0;background:none;color:var(--muted);padding:6px 8px}
.note2{font-size:12.5px;color:var(--muted);margin:8px 0 4px;line-height:1.4}
.note.ts{font-size:12px;color:var(--muted)}
.lk{display:flex;gap:2px;flex:none}
.lnk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;color:var(--accent);text-decoration:none;font-size:13px}
.lnk:hover{background:var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:1px 9px 1px 7px;border-radius:999px;font-size:12.5px;background:color-mix(in srgb,var(--sc) 17%,transparent);overflow:hidden;white-space:nowrap;cursor:pointer}
.badge::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--sc)}
.due{color:var(--muted)}
.cd{display:inline-flex;align-items:center;gap:4px;padding:2px 11px;border-radius:999px;font-weight:700;font-size:13.5px;background:var(--surface2);color:var(--muted);white-space:nowrap;flex:none}
.cd.late{background:var(--late);color:var(--bg)}.cd.late::before{content:"⚠"}
.cd.today{background:var(--warn);color:var(--bg)}
.cd.soon{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
.cd.far{font-weight:600}
.cdd{color:var(--muted);font-size:12px;margin-left:8px;white-space:nowrap}
.fuc{display:inline-block;padding:0 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px;margin-right:4px;white-space:nowrap;flex:none}
.sendnow{border:1px solid var(--line2);background:var(--surface);border-radius:5px;padding:1px 7px;font-size:12px;margin-left:6px;white-space:nowrap}
.sendnow:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint2{font-size:11.5px;color:var(--warn);margin-left:6px;white-space:nowrap}
.ph.w{color:var(--warn);font-style:italic;font-size:12.5px}
.cell[data-w]::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;border-bottom:1.5px dotted var(--warn);opacity:.7;pointer-events:none}
.ln{display:flex;gap:6px;align-items:center;min-width:0;flex:1;cursor:pointer}
.ln .badge{flex:none}
.ago{color:var(--muted);font-size:12px;flex:none}
.due.late{color:var(--late);font-weight:600}.due.late::before{content:"⚠ "}
.due.today{color:var(--warn);font-weight:600}
.last{color:var(--muted)}
.cell.ed{overflow:visible;padding:0;z-index:4}
.cell.ed input{width:100%;height:100%;border:0;outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface);padding:0 8px;font:inherit;color:var(--ink)}
.row.addrow .num{font-size:15px}
.row.addrow .cell[data-k=name] .t{font-weight:400}
.empty{padding:28px 16px;text-align:center;color:var(--muted);position:sticky;left:0}
.empty p{margin:0 0 12px}
.sbar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:6px;font-size:12.5px;color:var(--muted)}
/* popover */
.pop{position:fixed;z-index:25;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:4px;min-width:190px;max-width:min(420px,calc(100vw - 16px));max-height:min(380px,60vh);overflow:auto;font-size:13.5px}
.pi{display:flex;width:100%;gap:8px;align-items:center;justify-content:space-between;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;white-space:nowrap}
.pi:hover,.pi.hi,.pi:focus-visible{background:var(--surface2);outline:none}
.pi.hi{box-shadow:inset 2px 0 0 var(--accent)}
.pi .sub{color:var(--muted);font-size:12px}
.pi.cur{font-weight:600}
.pop .pd{padding:6px 10px 4px}
.pop .pd input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.pop h4{margin:6px 10px 4px;font-size:12px;color:var(--muted);font-weight:600}
.pop .sc{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:6px 10px;font-size:13px;min-width:340px}
.pop .sc kbd{font:inherit;font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.pop label.pc{display:flex;gap:8px;align-items:center;margin:0;padding:6px 10px;font-size:13.5px;color:var(--ink)}
.msgpop{width:350px;padding:6px 12px 12px}
.mf label{margin:10px 0 3px}
.mf input,.mf select,.mf textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.mf textarea{min-height:56px}
.mf .foot{margin-top:12px}
.histpop{width:380px}
.hl{list-style:none;margin:0;padding:4px 10px;display:grid;gap:8px}
.hl li{display:grid;grid-template-columns:62px 1fr;gap:8px}
.hl .when,.log .when{color:var(--muted);white-space:nowrap}
.note{display:block;color:var(--muted);margin-top:2px;white-space:pre-wrap}
.sech{margin:24px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.pop .vsave{display:flex;gap:6px;padding:6px}
.pop .vsave input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0}
/* panel */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:30;display:flex;justify-content:flex-end;overscroll-behavior:contain}
.panel{background:var(--surface);width:min(480px,100%);height:100%;overflow-y:auto;
  padding:28px max(24px,env(safe-area-inset-right,0px)) 48px 24px;padding-top:calc(28px + env(safe-area-inset-top,0px))}
.panel h3{font-size:18px;font-weight:600;margin:0}
.ph2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;position:sticky;top:-28px;background:var(--surface);padding:8px 0;z-index:1}
label{display:block;font-size:12px;color:var(--muted);margin:18px 0 4px}
.panel input,.panel select,.panel textarea{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:8px 10px;min-width:0}
.panel input:focus-visible,.panel select:focus-visible,.panel textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:8px}
.quick button{background:none;border:0;padding:2px 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.quick button:hover{color:var(--ink)}
.sec{margin-top:32px}
.log{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;font-size:14px;align-items:start}
.log .mbt{display:flex}
.log .note{color:var(--ink)}
.log .x{background:none;border:0;color:var(--muted);padding:0 4px}.log .x:hover{color:var(--late)}
.log .when{color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:24px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin-top:16px}
.toast button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;margin-left:12px;padding:0}
.toast{animation:tin .15s ease-out;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:60;font-size:14px;max-width:calc(100vw - 24px)}
/* dialogy (import, paměť stylu, psaní zprávy) */
.dlg-ov{position:fixed;inset:0;background:var(--overlay);z-index:45;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;overscroll-behavior:contain}
.dlg{background:var(--surface);border-radius:12px;width:min(880px,100%);padding:18px 22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.dlg-h h3{margin:0;font-size:18px;font-weight:600}
.dlg label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.dlg input,.dlg select,.dlg textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.dlg textarea{min-height:60px;resize:vertical}
.dlg input[type=file]{display:none}
.dl-hint{font-size:13px;color:var(--muted);margin:6px 0;line-height:1.45}
.dl-err{color:var(--late);font-size:13.5px;margin:8px 0;font-weight:500}
.dl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.dl-sum{font-size:13.5px;font-weight:500;margin:12px 0 6px}
.dl-t{width:100%;border-collapse:collapse;font-size:13.5px}
.dl-t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.dl-t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.dl-ok{color:var(--accent);font-size:12px;margin-left:6px}.dl-warn{color:var(--warn);font-size:12px;margin-left:6px;font-weight:600}.dl-new{color:var(--muted);font-size:12px;margin-left:6px}
.dl-t details{margin-top:4px;font-size:12.5px}.dl-t summary{cursor:pointer;color:var(--muted)}
.dl-t .cv-x{min-height:44px}
.quote{display:block;margin-top:3px;padding-left:8px;border-left:3px solid var(--line2);font-size:13px;color:var(--muted);white-space:pre-wrap}
.quote.me{border-left-color:var(--accent)}.quote.them{border-left-color:var(--warn)}
.quote b{color:var(--ink);font-weight:600}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.mem-s{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.mem-s b{font-size:20px}.mem-s span{font-size:12px;color:var(--muted)}
.mem-r{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.x.star{background:none;border:0;font-size:18px;color:var(--muted);padding:0 4px;line-height:1}
.x.star.on{color:#d4a017}.x.star:hover{color:#d4a017}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--surface2);box-shadow:inset 0 -2px 0 var(--accent)}
.pacts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}

<body>
<div class="wrap">
  <header>
    <h1>Oslovovací CRM</h1>
    <div class="hbtns"><button class="btn sm desk" id="ics" title="Stáhnout .ics se všemi budoucími follow-upy (kalendář tě upozorní i při zavřené appce)">Do kalendáře</button><button class="btn sm desk" id="imsg" title="Nahrát historii odeslaných zpráv a odpovědí">Nahrát zprávy</button><button class="btn sm desk" id="memb" title="Paměť stylu: vzorové zprávy, Jak píšu, Co nabízím">Paměť stylu</button><button class="btn sm desk" id="kb" title="Klávesové zkratky (Ctrl+/)">⌨ Zkratky</button><button class="btn sm" id="exp" title="Stáhnout CSV pro Excel">Export</button><button class="btn sm" id="imp" title="Načíst CSV nebo JSON zálohu">Import</button><button class="btn primary" id="add">+ Nový</button><input type="file" id="file" accept=".csv,.json,text/csv,application/json" hidden></div>
  </header>

    <div class="g" id="g"><div class="hrow" id="hrow" role="row"></div><div id="rows"></div><div id="extra"></div></div>
  </div>
  <div class="sbar"><span id="count"></span><span>Enter upravit · Alt+M zpráva · Mezerník detail · Shift+Enter nový řádek · Ctrl+Z zpět · Ctrl+/ zkratky</span></div>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';
var STATUSES=[['novy','Neoslovený'],['osloven','Osloven (bez výsledku)'],['ceka','Čeká se na odpověď'],['ignor','Ignor (bez odpovědi)'],['kontakt','Jednáme o schůzce'],['schuzka','Schůzka domluvena'],['spoluprace','Zájem / spolupráce'],['nezajem','Odmítl']];
var SHORT={novy:'Neoslovený',osloven:'Osloven',ceka:'Čeká se',ignor:'Ignor',kontakt:'Jednáme',schuzka:'Schůzka',spoluprace:'Spolupráce',nezajem:'Odmítl'};
/* výsledek zprávy: [klíč, popisek, odpovídající stav kontaktu, krátký popisek] */
var OUTCOMES=[['ceka','Čeká se na odpověď','ceka','Čeká se'],['ignor','Ignor (bez odpovědi)','ignor','Ignor'],['odmitl','Odmítl','nezajem','Odmítl'],['jednani','Jednáme o schůzce','kontakt','Jednáme'],['schuzka','Schůzka domluvena','schuzka','Schůzka'],['zajem','Zájem / spolupráce','spoluprace','Zájem']];
var KINDS=[['prvni','První zpráva'],['followup','Follow-up'],['odpoved','Odpověď'],['hovor','Hovor'],['schuzka','Schůzka'],['poznamka','Poznámka']];
var KINDTYPE={prvni:'napsal',followup:'napsal',odpoved:'odpoved',hovor:'hovor',schuzka:'schuzka',poznamka:'poznamka'};   // původní pole log[].type zůstává vyplněné
var DONE=['nezajem','schuzka','spoluprace'];   // ukončené kontakty (v řazení dole)
var IGNOR_N=3;                                 // po tolika follow-upech bez odpovědi nápověda „zvaž ukončit“
var DEFHIDE=['other','last','desc','nextAction'];
/* sloupce mřížky: k = pole kontaktu, w = výchozí šířka, t = typ buňky (ro = jen ke čtení, počítá se z historie zpráv) */
var COLS=[
  {k:'name',l:'Jméno',w:210,t:'text'},{k:'wrote',l:'Napsáno',w:165,t:'ro'},{k:'nextDate',l:'Další follow-up',w:215,t:'date'},{k:'status',l:'Stav',w:185,t:'status',f:1},
  {k:'first',l:'První zpráva',w:175,t:'date'},{k:'fu',l:'Follow-upy',w:150,t:'ro'},{k:'mail',l:'Mail',w:170,t:'text'},{k:'phone',l:'Telefon',w:150,t:'text'},
  {k:'field',l:'Obor',w:110,t:'field',f:1},{k:'lastnote',l:'Poslední poznámka',w:270,t:'ro'},{k:'other',l:'Jiné',w:130,t:'text'},
  {k:'last',l:'Poslední kontakt',w:115,t:'ro'},{k:'desc',l:'Popis',w:200,t:'text'},{k:'nextAction',l:'Co udělat',w:160,t:'text'}
];
var NUMW=46,CKW=34,ADD='__new';
var contacts=[],fSearch='',fField='',fStatus='',fDue='',fGroup='',sortS=null;
var VC=COLS;                    // právě viditelné sloupce
var view=[],pos=new Map();      // aktuální (filtrované a seřazené) řádky, id -> index
var picked=new Set(),lastPick=-1;
var cur={id:null,c:0},anc={id:null,c:0},extras=[];   // kurzor, kotva výběru, další (Ctrl) oblasti
var ce=null;                    // probíhající editace buňky
var $=function(s){return document.querySelector(s)};
var wrap=$('#gw');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function isIso(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')}
function addDays(base,n){var p=base.split('-');return ymd(new Date(+p[0],+p[1]-1,+p[2]+n))}
function addMonths(base,n){var p=base.split('-'),d=new Date(+p[0],+p[1]-1+n,1),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(+p[2],last));return ymd(d)}
function diffDays(a,b){var pa=a.split('-'),pb=b.split('-');return Math.round((new Date(+pa[0],+pa[1]-1,+pa[2])-new Date(+pb[0],+pb[1]-1,+pb[2]))/864e5)}
var WD=['ne','po','út','st','čt','pá','so'],fmtCache={};
function fmtDate(s){
  var r=fmtCache[s];if(r)return r;var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  return fmtCache[s]=WD[d.getDay()]+' '+ +p[2]+'. '+ +p[1]+'.'+(+p[0]!==new Date().getFullYear()?' '+p[0]:'');
}
function fmtCz(s){if(!isIso(s))return s||'';var p=s.split('-');return +p[2]+'. '+ +p[1]+'. '+p[0]}
function fmtStamp(iso){return new Date(iso).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}
function statusLabel(k){for(var i=0;i<STATUSES.length;i++)if(STATUSES[i][0]===k)return STATUSES[i][1];return k}
var uidN=0;function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+(uidN++).toString(36)}
var coll=new Intl.Collator('cs');function csc(a,b){return coll.compare(a,b)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function isMobile(){return window.matchMedia('(max-width:699px)').matches}
function toast(t,undoFn,extras){
  var o=document.querySelectorAll('.toast');for(var i=0;i<o.length;i++)o[i].remove();
  var e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;
  if(undoFn){var b=document.createElement('button');b.textContent='Vrátit';b.onclick=function(){undoFn();e.remove()};e.appendChild(b)}
  (extras||[]).forEach(function(x){var b2=document.createElement('button');b2.textContent=x.l;b2.onclick=function(){x.fn();e.remove()};e.appendChild(b2)});
  document.body.appendChild(e);setTimeout(function(){e.remove()},extras&&extras.length?9000:undoFn?6000:3000);
}

/* ---------- úložiště (localStorage) ---------- */
var KEY='crm_contacts',UIKEY='crm_ui',WKEY='crm_colw',VKEY='crm_views';
function lsGet(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v==null?def:v}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(){var raw=null;try{raw=localStorage.getItem(KEY);var a=JSON.parse(raw||'[]');return Array.isArray(a)?a:[]}catch(e){try{localStorage.setItem(KEY+'_broken_'+Date.now(),raw)}catch(_){}setTimeout(function(){toast('Uložená data byla poškozená, kopie je zachována')},300);return []}}
function persistAll(){try{localStorage.setItem(KEY,JSON.stringify(contacts))}catch(e){toast('Uložení se nepovedlo')}}
var widths=lsGet(WKEY,{}),ui=lsGet(UIKEY,{}),customViews=lsGet(VKEY,[]);
if(!widths||typeof widths!=='object')widths={};
if(!ui||typeof ui!=='object')ui={};
if(!Array.isArray(customViews))customViews=[];
if(ui.sort&&ui.sort.k&&COLS.some(function(c){return c.k===ui.sort.k}))sortS=ui.sort;
function saveUi(){ui.sort=sortS;lsSet(UIKEY,ui)}
window.addEventListener('storage',function(e){if(e.key===KEY&&!editing&&!ce){contacts=load();contacts.forEach(migrateContact);undoS=[];redoS=[];render()}});

/* ---------- změny a historie (undo/redo) ---------- */
var undoS=[],redoS=[];
function applyOne(id,obj){var i=contacts.findIndex(function(x){return x.id===id});if(!obj){if(i>=0)contacts.splice(i,1)}else if(i>=0)contacts[i]=obj;else contacts.push(obj)}
function byId(id){for(var i=0;i<contacts.length;i++)if(contacts[i].id===id)return contacts[i];return null}
/* changes: [{id,before,after}], before/after = celý kontakt nebo null */
function commitChanges(changes,label){
  if(!changes.length)return null;
  changes.forEach(function(ch){applyOne(ch.id,ch.after)});
  var e={label:label,changes:changes};undoS.push(e);if(undoS.length>100)undoS.shift();redoS=[];
  persistAll();render(changes.map(function(ch){return ch.id}));return e;
}
function undo(e){
  var i=e?undoS.indexOf(e):undoS.length-1;if(i<0){toast('Není co vracet');return}
  e=undoS.splice(i,1)[0];for(var k=e.changes.length-1;k>=0;k--)applyOne(e.changes[k].id,e.changes[k].before);
  redoS.push(e);persistAll();render(e.changes.map(function(ch){return ch.id}));toast('Zpět: '+e.label);
}
function redo(){
  var e=redoS.pop();if(!e){toast('Není co opakovat');return}
  e.changes.forEach(function(ch){applyOne(ch.id,ch.after)});undoS.push(e);persistAll();render(e.changes.map(function(ch){return ch.id}));toast('Znovu: '+e.label);
}
function saveContact(c,label){commitChanges([{id:c.id,before:byId(c.id),after:c}],label||'úprava kontaktu')}
function removeContact(id){var b=byId(id);if(b)commitChanges([{id:id,before:b,after:null}],'smazání kontaktu')}

/* ---------- logika ---------- */
function fields(){var m={};contacts.forEach(function(c){if(c.field)m[c.field]=(m[c.field]||0)+1});return Object.keys(m).sort(csc)}
function isDone(c){return DONE.indexOf(c.status)>=0}
function dueKind(c){if(!isIso(c.nextDate)||isDone(c))return '';var d=diffDays(c.nextDate,today());return d<0?'late':d===0?'today':''}
/* ---------- zprávy (log) a odvozené údaje ---------- */
function outObj(k){for(var i=0;i<OUTCOMES.length;i++)if(OUTCOMES[i][0]===k)return OUTCOMES[i];return null}
function outLabel(k){var o=outObj(k);return o?o[1]:''}
function outBadge(k){var o=outObj(k);return o?'<span class="badge" data-s="'+o[2]+'" title="'+esc(o[1])+'">'+esc(o[3])+'</span>':''}
function kindLabel(k){for(var i=0;i<KINDS.length;i++)if(KINDS[i][0]===k)return KINDS[i][1];return k||''}
function statusToOutcome(st){return {ceka:'ceka',ignor:'ignor',nezajem:'odmitl',kontakt:'jednani',schuzka:'schuzka',spoluprace:'zajem'}[st]||''}
function outcomeKey(v){var n=norm(v);if(!n)return '';if(/ignor/.test(n))return 'ignor';if(/odmit|nezaj/.test(n))return 'odmitl';if(/jedn/.test(n))return 'jednani';if(/schuz/.test(n))return 'schuzka';if(/zajem|spolup/.test(n))return 'zajem';if(/ceka|cekam/.test(n))return 'ceka';return ''}
function msgs(c){return (c.log||[]).filter(function(l){return l&&l.at&&!isNaN(new Date(l.at))})}
function byAt(a,b){return a.at<b.at?-1:a.at>b.at?1:0}
function firstIdx(c){var best=-1;(c.log||[]).forEach(function(l,i){if(l&&l.at&&l.kind==='prvni'&&(best<0||l.at<c.log[best].at))best=i});return best}
function firstMsg(c){var i=firstIdx(c);return i<0?null:c.log[i]}
function fus(c){return msgs(c).filter(function(l){return l.kind==='followup'}).sort(byAt)}
function lastMsg(c){var m=null;msgs(c).forEach(function(l){if(!m||l.at>=m.at)m=l});return m}
function isUnsent(c){return !firstMsg(c)&&c.status==='novy'}
/* stav kontaktu se odvozuje z výsledku poslední zprávy s výsledkem */
function statusFromLog(n){
  var m=null;msgs(n).forEach(function(l){if(l.outcome&&(!m||l.at>=m.at))m=l});
  if(m){var o=outObj(m.outcome);return o?o[2]:n.status}
  if(!(n.log||[]).length&&(n.status==='ceka'||n.status==='ignor'||n.status==='osloven'))return 'novy';
  return n.status;
}
function dateToAt(d,old){if(old&&ymd(new Date(old))===d)return old;if(d===today())return new Date().toISOString();var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2],12).toISOString()}
function fmtShort(s){var p=s.split('-');return +p[2]+'. '+ +p[1]+'.'+(+p[0]!==new Date().getFullYear()?' '+p[0]:'')}
/* ---------- kontakt: Mail / Telefon / Jiné (migrace ze starého pole contact) ---------- */
var RE_MAIL=/[^\s@,;<>()]+@[^\s@,;<>()]+\.[a-z]{2,}/i;
var RE_URL=/(?:https?:\/\/|www\.)[^\s,;<>"']+|(?:[a-z0-9-]+\.)*(?:linkedin\.com|facebook\.com|instagram\.com|twitter\.com|x\.com)\/[^\s,;<>"']*/i;
var RE_TEL=/(?:\+|00)?\d[\d ()\-\/.]{7,}\d/;
function contactStr(c){return [c.mail,c.phone,c.other].filter(Boolean).join(', ')}
function splitContact(str){
  var rest=String(str||''),m,mails=[],oth=[],r={mail:'',phone:'',other:''};
  while((m=rest.match(RE_MAIL))){mails.push(m[0]);rest=rest.replace(m[0],' ')}
  r.mail=mails[0]||'';mails.slice(1).forEach(function(x){oth.push(x)});
  if((m=rest.match(RE_URL))){oth.push(m[0]);rest=rest.replace(m[0],' ')}
  if((m=rest.match(RE_TEL))&&m[0].replace(/\D/g,'').length>=9){r.phone=m[0].trim();rest=rest.replace(m[0],' ')}
  rest=rest.replace(/\b(tel|mob|mobil|telefon|e-?mail|mail|web|linkedin)\b\.?:?/gi,' ').replace(/[,;|]+/g,' ').replace(/\s+/g,' ').trim();
  if(rest)oth.push(rest);
  r.other=oth.join(', ');return r;
}
function needsMig(c){return (c.mail===undefined&&c.phone===undefined&&c.other===undefined)||!Array.isArray(c.log)||c.log.some(function(l){return l&&!l.kind})}
/* doplní nová pole; staré záznamy dostanou kind a outcome, nic se nemaže. Vrací true, když se něco změnilo. */
function migrateContact(c){
  var ch=false;
  if(c.mail===undefined&&c.phone===undefined&&c.other===undefined){var sp=splitContact(c.contact);c.mail=sp.mail;c.phone=sp.phone;c.other=sp.other;ch=true}
  ['mail','phone','other'].forEach(function(k){if(typeof c[k]!=='string'){c[k]='';ch=true}});
  if(!Array.isArray(c.log)){c.log=[];ch=true}
  if(c.log.some(function(l){return l&&!l.kind})){
    var order=c.log.map(function(l,i){return i}).sort(function(a,b){return String((c.log[a]||{}).at||'')<String((c.log[b]||{}).at||'')?-1:1});
    var seen=c.log.some(function(l){return l&&l.kind==='prvni'});
    order.forEach(function(i){
      var l=c.log[i];if(!l||l.kind)return;
      if(l.type==='napsal'){l.kind=seen?'followup':'prvni';seen=true;if(l.outcome===undefined)l.outcome='ceka'}
      else{l.kind={odpoved:'odpoved',hovor:'hovor',schuzka:'schuzka'}[l.type]||'poznamka';if(l.outcome===undefined)l.outcome=l.type==='odpoved'?'jednani':l.type==='schuzka'?'schuzka':''}
      if(l.text==null)l.text='';
    });
    var lm=lastMsg(c),o=statusToOutcome(c.status);   // poslední zpráva odráží dosavadní stav kontaktu
    if(lm&&lm.outcome&&o)lm.outcome=o;
    ch=true;
  }
  return ch;
}
function agoText(iso){
  var d=diffDays(today(),ymd(new Date(iso)));
  if(d<=0)return 'dnes';if(d===1)return 'včera';if(d<14)return 'před '+d+' d';if(d<60)return 'před '+Math.round(d/7)+' týd';if(d<365)return 'před '+Math.floor(d/30)+' měs';return 'před '+Math.floor(d/365)+' r';
}
function matchesFilter(c,q){
  if(fField&&(c.field||'')!==fField)return false;
  if(fStatus&&c.status!==fStatus)return false;
  if(fGroup==='new'&&!isUnsent(c))return false;
  if(fGroup==='wait'&&c.status!=='ceka'&&c.status!=='ignor')return false;
  if(fGroup==='meet'&&c.status!=='kontakt'&&c.status!=='schuzka')return false;
  if(fDue){var k=dueKind(c);if(fDue==='due'?!k:k!==fDue)return false}

function sortByDue(a,b){return (isDone(a)-isDone(b))||(a.nextDate||'9999').localeCompare(b.nextDate||'9999')||csc(String(a.name||''),String(b.name||''))}
function sortVal(c,k){

  if(k==='wrote')return isWrote(c)?1:0;

  if(k==='fu'){return fus(c).length||null}

}

  return function(a,b){
    var x=sortVal(a,s.k),y=sortVal(b,s.k),r;
    if(x==null||y==null){if(x==null&&y==null)r=0;else return x==null?1:-1}   // prázdné vždy na konec
    else r=(typeof x==='number'?x-y:csc(x,y))*s.dir;

  };
}

/* ---------- hodnoty buněk, data ---------- */
function validYmd(y,m,d){var dt=new Date(y,m-1,d);return dt.getFullYear()===+y&&dt.getMonth()===m-1&&dt.getDate()===+d?y+'-'+pad(m)+'-'+pad(d):null}
/* '' = bez termínu, null = nerozumím. Zná: 2026-11-05, 5.11., 5. 11. 2026, dnes, zítra, +3, +2t, +1m, po…ne */
function parseDateInput(raw){
  var v=norm(raw);if(!v)return '';var t=today(),m;
  if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return validYmd(+m[1],+m[2],+m[3]);
  if(m=v.match(/^(\d{1,2})\s*[.\/]\s*(\d{1,2})(?:\s*[.\/]\s*(\d{2,4}))?\s*\.?$/)){
    var y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):+t.slice(0,4),r=validYmd(y,+m[2],+m[1]);
    if(r&&!m[3]&&r<t)r=validYmd(y+1,+m[2],+m[1]);          // bez roku = nejbližší budoucí výskyt
    return r;
  }
  if(v==='dnes'||v==='d'||v==='today')return t;
  if(v==='zitra')return addDays(t,1);
  if(v==='pozitri')return addDays(t,2);
  if(m=v.match(/^\+\s*(\d+)\s*(d|dn\w*|t|tyd\w*|w|m|mes\w*)?$/)){
    var n=+m[1],u=(m[2]||'d').charAt(0);
    return u==='t'||u==='w'?addDays(t,7*n):u==='m'?addMonths(t,n):addDays(t,n);
  }
  var wd=['ne','po','ut','st','ct','pa','so'];
  if(m=v.match(/^(ne|po|ut|st|ct|pa|so)[a-z]*$/)){var tg=wd.indexOf(m[1]),cd=new Date().getDay();return addDays(t,((tg-cd+6)%7)+1)}
  return null;
}
/* vrátí nový kontakt s upravenou buňkou, null = neplatná hodnota / buňka jen ke čtení */
function isRo(k){for(var i=0;i<COLS.length;i++)if(COLS[i].k===k)return COLS[i].t==='ro';return false}
function withValue(c,k,raw){
  var n=Object.assign({},c);raw=String(raw==null?'':raw);
  if(isRo(k))return null;
  if(k==='status'){n.status=raw.trim()?statusKey(raw):'novy';return n}
  if(k==='nextDate'){var d=parseDateInput(raw);if(d===null)return null;n.nextDate=d;return n}
  if(k==='first'){   // datum první zprávy = záznam kind:'prvni' v historii
    var fd=parseDateInput(raw);if(fd===null)return null;
    n.log=(c.log||[]).slice();var fi=firstIdx(n);
    if(!fd){if(fi>=0)n.log.splice(fi,1)}
    else if(fi>=0)n.log[fi]=Object.assign({},n.log[fi],{at:dateToAt(fd,n.log[fi].at)});
    else n.log.push({at:dateToAt(fd),type:'napsal',kind:'prvni',outcome:'ceka',text:''});
    n.status=statusFromLog(n);return n;
  }
  n[k]=raw.replace(/\s*[\r\n]+\s*/g,' ').trim();
  if(k==='mail'||k==='phone'||k==='other')n.contact=contactStr(n);
  return n;
}
function cellText(c,k){   // text pro kopírování a porovnání
  if(k==='status')return statusLabel(c.status);

  if(k==='wrote')return isWrote(c)?'ano':'';

  if(k==='fu')return fus(c).map(function(l,i){return 'FU'+(i+1)+' '+fmtShort(ymd(new Date(l.at)))}).join('; ');
  if(k==='lastnote'){var m=lastMsg(c);return m?(m.outcome?outLabel(m.outcome)+(m.text?': ':''):'')+(m.text||''):''}
  if(k==='last'){var l=lastMsg(c);return l?ymd(new Date(l.at)):''}

}

function doPaste(text){
  var rows=parseDelim(text.replace(/\r\n?/g,'\n'),'\t');

  if(!rows.length)return;
  var hdr=null;   // hlavička z Excelu: sloupce se přiřadí podle názvu, ne podle polohy
  if(rows.length>1&&rows[0].filter(function(x){return headerKey(x)}).length>=2){hdr=rows.shift().map(function(x){var k=headerKey(x);return VC.findIndex(function(c){return c.k===k})})}

  }else rows.forEach(function(row,i){row.forEach(function(v,j){var cc=hdr?hdr[j]:c0+j;if(cc>=0&&cc<VC.length)tg.push({r:r0+i,c:cc,v:v})})});

function opt(v,l,sel){return '<option value="'+esc(v)+'"'+(sel?' selected':'')+'>'+esc(l)+'</option>'}
/* formulář zprávy (popover v mřížce i panel detailu); o.entry/o.edit = úprava existujícího záznamu */
function msgFormHtml(c,o){
  var e=o.entry||null,edit=o.edit!=null&&o.edit!==undefined,kind=e?e.kind:(firstMsg(c)?'followup':'prvni'),outc=e?(e.outcome||''):'ceka',date=e?ymd(new Date(e.at)):today();
  var chan=e?(e.channel||''):(lastChannel(c)||'');
  var kinds=KINDS.filter(function(k){return edit||['prvni','followup','odpoved','hovor'].indexOf(k[0])>=0});
  var days=[3,7,14],rem=+ui.fuDays||7;if(days.indexOf(rem)<0){days.push(rem);days.sort(function(a,b){return a-b})}
  var h='<div class="mf"><div class="two"><div><label for="m-kind">Typ</label><select id="m-kind">'+kinds.map(function(k){return opt(k[0],k[1],k[0]===kind)}).join('')+'</select></div>'+
   '<div><label for="m-date">Datum</label><input type="date" id="m-date" value="'+esc(date)+'"></div></div>'+
   '<div class="two"><div><label for="m-outcome">Výsledek</label><select id="m-outcome">'+(edit&&outc===''?opt('','(bez výsledku)',true):'')+OUTCOMES.map(function(x){return opt(x[0],x[1],x[0]===outc)}).join('')+'</select></div>'+
   '<div><label for="m-chan">Kanál</label><select id="m-chan">'+opt('','(neuvedeno)',!chan)+CHANNELS.map(function(x){return opt(x[0],x[1],x[0]===chan)}).join('')+'</select></div></div>'+
   '<label for="m-text">Poznámka</label><textarea id="m-text" rows="2" placeholder="Co jsem napsal, co odpověděl…">'+esc(e?e.text:'')+'</textarea>'+
   '<details class="mfd"'+(e&&(e.sent||e.reply)?' open':'')+'><summary>Text odeslané zprávy a odpovědi (pro učení stylu)</summary><label for="m-sent">Odeslaná zpráva</label><textarea id="m-sent" rows="3">'+esc(e?e.sent||'':'')+'</textarea><label for="m-reply">Odpověď druhé strany</label><textarea id="m-reply" rows="3">'+esc(e?e.reply||'':'')+'</textarea></details>'+
   '<div class="two"><div><label for="m-fu">Další follow-up za</label><select id="m-fu">'+(edit?opt('keep','Beze změny',true):'')+days.map(function(d){return opt(String(d),d+' d',!edit&&d===rem)}).join('')+opt('custom','Vlastní datum…')+opt('none','Žádný')+'</select></div>'+
   '<div id="m-fud" hidden><label for="m-fudate">Datum follow-upu</label><input type="date" id="m-fudate" value="'+esc(addDays(date,rem))+'"></div></div>';
  h+=o.panel?'<div class="foot"><button class="btn primary" data-p="addlog">'+(edit?'Uložit změny':'Přidat zprávu')+'</button>'+(edit?'<button class="btn" data-p="mecancel">Zrušit úpravu</button>':'')+'</div>'
            :'<div class="foot"><button class="btn primary" data-act="msgsave">Uložit</button><button class="btn" data-act="msgcancel">Zrušit</button></div>';
  return h+'</div>';
}
function readMsgForm(){return {kind:$('#m-kind').value,date:$('#m-date').value||today(),outcome:$('#m-outcome').value,text:$('#m-text').value.trim(),fu:$('#m-fu').value,fudate:$('#m-fudate').value,channel:$('#m-chan').value,sent:$('#m-sent').value.trim(),reply:$('#m-reply').value.trim()}}
/* vrátí nový kontakt s přidanou (nebo upravenou: idx) zprávou; stav se odvodí z výsledku, další follow-up podle f.fu */
function applyMessage(c,f,idx){
  var n=Object.assign({},c);n.log=(c.log||[]).slice();
  var old=idx!=null?c.log[idx]:null;
  var entry={at:dateToAt(f.date,old?old.at:null),type:KINDTYPE[f.kind]||'poznamka',kind:f.kind,outcome:f.outcome,text:f.text};
  if(f.channel)entry.channel=f.channel;if(f.sent)entry.sent=f.sent;if(f.reply)entry.reply=f.reply;
  if(old){if(old.ts)entry.ts=old.ts;if(old.pn!==undefined)entry.pn=old.pn;if(old.star)entry.star=true}
  else{entry.ts=new Date().toISOString();if(f.pn!==undefined)entry.pn=f.pn}   // ts = skutečný čas zápisu, pn = předchozí follow-up (pro odškrtnutí)
  if(idx!=null&&c.log[idx])n.log[idx]=entry;else n.log.push(entry);
  n.status=statusFromLog(n);
  if(f.fu!=='keep')n.nextDate=f.fu==='none'?'':f.fu==='custom'?(f.fudate||''):addDays(f.date,+f.fu);
  if(/^\d+$/.test(f.fu)&&idx==null&&!f.noRemember){ui.fuDays=+f.fu;saveUi()}   // zapamatovat poslední interval
  return n;
}
function msgPop(id){
  var c=byId(id);if(!c)return;if(ce)commitEdit('none');
  var i=idxOf(id),cell=i>=0?cellEl(i,0):null;if(!cell)return;
  var el=openPop('msg',cell,'<h4>'+esc(c.name||'Kontakt')+' – nová zpráva</h4>'+msgFormHtml(c,{}),{opener:wrap});
  el.classList.add('msgpop');el.setAttribute('role','dialog');el.setAttribute('aria-label','Nová zpráva nebo follow-up');pop.msgId=id;placePop();
  var t=el.querySelector('#m-text');if(t)t.focus();
}
function saveMsgPop(){
  if(!pop||pop.kind!=='msg')return;var c=byId(pop.msgId);if(!c)return;
  var f=readMsgForm(),n=applyMessage(c,f);closePop(true);
  var e=commitChanges([{id:c.id,before:c,after:n}],'zpráva');
  toast('Zapsáno: '+kindLabel(f.kind)+(f.fu!=='keep'&&n.nextDate?' · další follow-up '+fmtShort(n.nextDate):''),function(){undo(e)});
  wrap.focus({preventScroll:true});
}
function sendNow(id){writeNow(id)}
/* ---------- Napsáno: zaškrtnutí zapíše zprávu a naplánuje další follow-up ---------- */
function isSentMsg(l){return l.kind==='prvni'||l.kind==='followup'}
function lastSentMsg(c){var m=null;msgs(c).forEach(function(l){if(isSentMsg(l)&&(!m||l.at>=m.at))m=l});return m}
function sentCount(c){return msgs(c).filter(isSentMsg).length}
function onTurn(c){return !isDone(c)&&isIso(c.nextDate)&&c.nextDate<=today()}   // termín nastal: kontakt je na řadě
function isWrote(c){return !!lastSentMsg(c)&&(c.status==='ceka'||c.status==='osloven')&&!onTurn(c)}
function parseSteps(v){var a=String(v||'').split(/[^\d]+/).map(Number).filter(function(n){return n>=1&&n<=365}).slice(0,6);return a.length?a:[3,7,14]}
function intv(){var i=ui.intv||{};return {base:clamp(+i.base||7,1,365),prog:!!i.prog,steps:parseSteps(Array.isArray(i.steps)?i.steps.join(','):i.steps)}}
function intervalFor(c){var o=intv();if(!o.prog)return o.base;return o.steps[Math.min(sentCount(c),o.steps.length-1)]}
function nextLabel(c){return firstMsg(c)?'FU'+(fus(c).length+1):'1. zpráva'}
/* o.date = den odeslání (výchozí dnes), o.next = datum dalšího follow-upu ('' = žádný; bez o.next podle intervalu) */
function writeNow(id,o){
  o=o||{};var c=byId(id);if(!c)return;
  var first=!firstMsg(c),days=intervalFor(c),custom=o.next!==undefined;
  var f={kind:first?'prvni':'followup',date:o.date||today(),outcome:'ceka',text:'',fu:custom?'custom':String(days),fudate:o.next||'',noRemember:true,pn:c.nextDate||'',sent:o.sent,channel:o.channel};
  var n=applyMessage(c,f),e=commitChanges([{id:id,before:c,after:n}],first?'první zpráva':'follow-up');
  toast('Zapsáno '+fmtShort(f.date)+(n.nextDate?', další follow-up '+fmtShort(n.nextDate):''),function(){undo(e)},
    [{l:'Změnit datum',fn:function(){dateFixPop(id,'fix')}},{l:'Přidat do kalendáře',fn:function(){exportIcsOne(id)}}]);
}
function unwrite(id){
  var c=byId(id),m=c&&lastSentMsg(c);if(!m)return;
  var n=Object.assign({},c);n.log=c.log.filter(function(l){return l!==m});n.status=statusFromLog(n);
  if(m.pn!==undefined)n.nextDate=m.pn;
  var e=commitChanges([{id:id,before:c,after:n}],'odškrtnutí');toast('Poslední zpráva smazána',function(){undo(e)});
}
function toggleWrote(id){var c=byId(id);if(!c||isDone(c))return;if(isWrote(c))unwrite(id);else writeNow(id)}
var fakeAnchor={getBoundingClientRect:function(){var x=Math.max(8,window.innerWidth/2-170);return{left:x,right:x,top:Math.max(8,window.innerHeight-360),bottom:Math.max(8,window.innerHeight-360)}}};
/* mode 'new' = Shift+klik na zaškrtávátko (zvolit den před zápisem), 'fix' = změnit datum poslední zprávy */
function dateFixPop(id,mode,anchor){
  var c=byId(id);if(!c)return;if(ce)commitEdit('none');
  var m=mode==='fix'?lastSentMsg(c):null;if(mode==='fix'&&!m)return;
  var date=m?ymd(new Date(m.at)):today(),gap=mode==='fix'?(isIso(c.nextDate)?diffDays(c.nextDate,date):null):intervalFor(c);
  var next=mode==='fix'?(c.nextDate||''):addDays(date,gap);
  var el=openPop('datefix',anchor||fakeAnchor,'<h4>'+esc(c.name)+' – '+(mode==='fix'?'změnit datum zprávy':'kdy jsi psal?')+'</h4><div class="mf"><label for="df-date">Odesláno dne</label><input type="date" id="df-date" value="'+esc(date)+'"><label for="df-next">Další follow-up</label><input type="date" id="df-next" value="'+esc(next)+'"><div class="foot"><button class="btn primary" data-act="dfsave">'+(mode==='fix'?'Uložit':'Zapsat')+'</button><button class="btn" data-act="msgcancel">Zrušit</button></div></div>',{opener:wrap});
  el.classList.add('msgpop');pop.dfId=id;pop.dfMode=mode;pop.dfGap=gap;placePop();
  var d=el.querySelector('#df-date');if(d)d.focus();
}
function saveDateFix(){
  if(!pop||pop.kind!=='datefix')return;
  var id=pop.dfId,mode=pop.dfMode,date=$('#df-date').value||today(),next=$('#df-next').value;closePop(true);
  if(mode==='new'){writeNow(id,{date:date,next:next});wrap.focus({preventScroll:true});return}
  var c=byId(id),m=c&&lastSentMsg(c);if(!m)return;
  var n=Object.assign({},c);n.log=c.log.slice();n.log[c.log.indexOf(m)]=Object.assign({},m,{at:dateToAt(date,m.at)});n.nextDate=next;
  var e=commitChanges([{id:id,before:c,after:n}],'změna data zprávy');
  toast('Datum změněno'+(next?', další follow-up '+fmtShort(next):''),function(){undo(e)});wrap.focus({preventScroll:true});
}
/* ---------- připomínky: banner, titulek, notifikace, kalendář ---------- */
var bannerOn=true;
function lidi(n){return n===1?'1 člověka':n+(n<5?' lidi':' lidí')}
function nm(list){return list.slice(0,3).map(function(c){return c.name||'?'}).join(', ')+(list.length>3?' +'+(list.length-3):'')}
function dueLists(){var l=[],t=[];contacts.forEach(function(c){var k=dueKind(c);if(k==='late')l.push(c);else if(k==='today')t.push(c)});return {late:l,today:t}}
function renderBanner(){
  var d=dueLists(),n=d.late.length+d.today.length,b=$('#banner');
  document.title=(n?'('+n+') ':'')+'Oslovovací CRM';
  if(!bannerOn||!n){b.hidden=true;b.innerHTML='';return}
  b.hidden=false;
  b.innerHTML=(d.today.length?'<button class="bn today" data-due="today" title="Zobrazit jen ty, co jsou na řadě dnes"><b>Dnes oslov: '+lidi(d.today.length)+'</b> – '+esc(nm(d.today))+'</button>':'')+
    (d.late.length?'<button class="bn late" data-due="late" title="Zobrazit jen ty po termínu"><b>Po termínu: '+d.late.length+'</b> – '+esc(nm(d.late))+'</button>':'')+
    '<button class="bn x" data-act="bandclose" aria-label="Skrýt připomínku" title="Skrýt">✕</button>';
}
function remind(){var r=ui.remind||{};return {on:!!r.on&&('Notification' in window)&&Notification.permission==='granted',time:/^\d\d:\d\d$/.test(r.time)?r.time:'09:00'}}
function digestText(){var d=dueLists(),p=[];if(d.today.length)p.push('Dnes oslov: '+lidi(d.today.length)+' ('+nm(d.today)+')');if(d.late.length)p.push('Po termínu: '+d.late.length+' ('+nm(d.late)+')');return p.join('\n')}
function notifyDigest(){var tx=digestText();if(!tx)return;try{new Notification('Oslovovací CRM',{body:tx,tag:'crm-digest'})}catch(e){}}
function nowHm(){var n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())}
function timedNotify(){var r=remind();if(!r.on)return;if(nowHm()>=r.time&&ui.lastNotified!==today()){ui.lastNotified=today();saveUi();notifyDigest()}}
function enableNotif(btn){
  if(!('Notification' in window)){toast('Tenhle prohlížeč notifikace nepodporuje');return}
  if(ui.remind&&ui.remind.on){ui.remind.on=false;saveUi();toast('Připomínky vypnuty');settingsPop(btn);return}
  var called=false,done=function(p){
    if(called)return;called=true;
    if(p==='granted'){ui.remind=Object.assign(ui.remind||{},{on:true});saveUi();toast('Připomínky zapnuty');notifyDigest()}
    else toast('Povolení nebylo uděleno – povol notifikace v nastavení prohlížeče');
    settingsPop(btn);
  };
  var r=Notification.requestPermission(done);if(r&&r.then)r.then(done);
}
function settingsPop(btn){
  var o=intv(),r=ui.remind||{},rs=remind();
  var h='<div class="mf"><h4 style="margin-left:0">Další follow-up po zaškrtnutí „Napsáno“</h4>'+
   '<label for="s-base">Základní interval (dní)</label><input type="number" id="s-base" min="1" max="365" value="'+o.base+'">'+

   '<label for="s-steps">Postup (dní po 1. zprávě, po FU1, po FU2…)</label><input id="s-steps" value="'+esc(o.steps.join(', '))+'" placeholder="3, 7, 14">'+
   '<h4 style="margin:16px 0 0">Připomínky v prohlížeči</h4><div class="two"><div><label for="s-time">Čas souhrnu</label><input type="time" id="s-time" value="'+esc(r.time||'09:00')+'"></div><div style="align-self:end"><button class="btn" data-act="notif">'+(rs.on?'Vypnout připomínky':'Zapnout připomínky')+'</button></div></div>'+
   '<p class="note2">Appka běží jen ve tvém prohlížeči, žádný server za ní není. Připomínky se proto zobrazí jen když je appka otevřená (nebo nainstalovaná jako aplikace). Když je zavřená, použij „Do kalendáře“ – kalendář tě upozorní sám.</p>'+
   '<div class="foot"><button class="btn" data-act="icsall">Do kalendáře (.ics)</button></div>'+
   '<h4 style="margin:16px 0 4px">Psaní zpráv</h4><div class="foot" style="margin-top:4px"><button class="btn" data-act="open-imsg">Nahrát zprávy…</button><button class="btn" data-act="open-mem">Paměť stylu…</button></div>'+
   '<h4 style="margin:16px 0 0">Claude API klíč (volitelné)</h4>'+
   '<p class="note2 warnbox"><b>Pozor:</b> klíč se uloží jen do localStorage tohoto prohlížeče a posílá se výhradně na api.anthropic.com. Kdokoli s přístupem k tomuhle prohlížeči ho může přečíst, proto ho používej jen na vlastním zařízení a v konzoli Anthropic si nastav měsíční limit útraty. Do exportu CSV ani JSON se nikdy nedostane. Bez klíče appka sestaví prompt, který si vložíš do Claude ručně.</p>'+
   '<label for="s-key">API klíč</label><input type="password" id="s-key" placeholder="'+(getKey()?'uložen: '+esc(maskKey(getKey())):'sk-ant-…')+'" autocomplete="off" spellcheck="false">'+
   '<div class="foot"><button class="btn" data-act="keysave">Uložit klíč</button>'+(getKey()?'<button class="btn danger" data-act="keydel">Smazat klíč</button>':'')+'</div></div>';
  var el=openPop('set',btn,h,{opener:btn});el.classList.add('msgpop');placePop();

function icsEsc(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFold(line){   // řádky max. 75 oktetů, pokračování začíná mezerou (RFC 5545 3.1)
  var enc=new TextEncoder(),out=[],cur='',bytes=0;
  for(var ch of line){var b=enc.encode(ch).length;if(bytes+b>75){out.push(cur);cur=' ';bytes=1}cur+=ch;bytes+=b}
  out.push(cur);return out.join('\r\n');
}
function icsStamp(){var d=new Date();return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z'}
function icsEvent(c,stamp){
  var rt=remind().time.split(':'),h=+rt[0],m=+rt[1],lm=lastMsg(c),desc=[],ct=contactStr(c);
  if(ct)desc.push('Kontakt: '+ct);
  if(lm&&(lm.text||lm.outcome))desc.push(('Poslední poznámka: '+(lm.outcome?'['+outLabel(lm.outcome)+'] ':'')+(lm.text||'')).trim());
  desc.push('Stav: '+statusLabel(c.status));
  return ['BEGIN:VEVENT','UID:'+String(c.id).replace(/[^A-Za-z0-9._-]/g,'')+'@oslovovaci-crm','DTSTAMP:'+stamp,'SEQUENCE:'+Math.floor(Date.now()/60000),
    'DTSTART;VALUE=DATE:'+c.nextDate.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(c.nextDate,1).replace(/-/g,''),
    'SUMMARY:'+icsEsc('Oslovit: '+(c.name||'kontakt')),'DESCRIPTION:'+icsEsc(desc.join('\n')),'TRANSP:TRANSPARENT',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Oslovit: '+(c.name||'kontakt')),'TRIGGER;RELATED=START:PT'+h+'H'+(m?m+'M':''),'END:VALARM','END:VEVENT'];
}
function buildIcs(list){
  var st=icsStamp(),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Oslovovaci CRM//CS','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Oslovovací CRM'];
  list.forEach(function(c){L=L.concat(icsEvent(c,st))});L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n')+'\r\n';
}
function exportIcsAll(){
  var t=today(),list=contacts.filter(function(c){return !isDone(c)&&isIso(c.nextDate)&&c.nextDate>=t}).sort(function(a,b){return a.nextDate<b.nextDate?-1:1});
  if(!list.length){toast('Žádný budoucí follow-up k exportu');return}
  download('oslovit-followupy-'+t+'.ics','text/calendar;charset=utf-8',buildIcs(list));
  toast('Staženo do kalendáře: '+list.length+' follow-upů. Při opakovaném importu se události aktualizují, nezdvojí.');
}
function exportIcsOne(id){
  var c=byId(id);if(!c||!isIso(c.nextDate)){toast('Kontakt nemá naplánovaný follow-up');return}
  download('oslovit-'+(norm(c.name).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'kontakt')+'.ics','text/calendar;charset=utf-8',buildIcs([c]));
}

function histText(c){
  return msgs(c).sort(byAt).reverse().slice(0,8).map(function(l){return fmtShort(ymd(new Date(l.at)))+' · '+kindLabel(l.kind)+(l.outcome?' ['+outLabel(l.outcome)+']':'')+(l.text?': '+l.text:'')}).join('\n');
}
function histPop(id){
  var c=byId(id),i=idxOf(id),cell=i>=0?cellEl(i,VC.findIndex(function(x){return x.k==='lastnote'})):null;if(!c||!cell)return;
  var items=msgs(c).sort(byAt).reverse();
  var h='<h4>Historie – '+esc(c.name)+'</h4>'+(items.length?'<ul class="hl">'+items.map(function(l){return '<li><span class="when">'+fmtShort(ymd(new Date(l.at)))+'</span><span><b>'+esc(kindLabel(l.kind))+'</b> '+(l.outcome?outBadge(l.outcome):'')+(l.text?'<span class="note">'+esc(l.text)+'</span>':'')+'</span></li>'}).join('')+'</ul>':'<div class="pd ph">Zatím žádné zprávy.</div>')+
    '<div class="pd"><button class="btn sm" data-msg-id="'+esc(id)+'">+ Zpráva</button> <button class="btn sm" data-openid="'+esc(id)+'">Otevřít detail</button></div>';
  var el=openPop('hist',cell,h,{opener:wrap});el.classList.add('histpop');el.tabIndex=-1;el.focus();
}

/* ---------- panel kontaktu ---------- */
var editing=null,lastFocus=null,msgEdit=null; // kopie kontaktu, index upravované zprávy
function openPanel(id){
  if(ce)commitEdit('none');
  lastFocus=document.activeElement;msgEdit=null;
  var c=id&&id!==ADD?byId(id):null;
  editing=c?JSON.parse(JSON.stringify(c)):blank();
  editing._new=!c;
  closePop(true);drawPanel();
  if(!c){var n=$('#p-name');if(n)n.focus()}
}
function drawPanel(){
  var c=editing;
  var logs=(c.log||[]).map(function(l,i){return {l:l,i:i}}).filter(function(x){return x.l&&x.l.at&&!isNaN(new Date(x.l.at))}).sort(function(a,b){return b.l.at<a.l.at?-1:b.l.at>a.l.at?1:0});
  $('#layer').innerHTML='<div class="overlay" id="ov"><div class="panel" role="dialog" aria-modal="true" aria-label="Kontakt">'+
   '<div class="ph2"><h3>'+(c._new?'Nový kontakt':esc(c.name||'Kontakt'))+'</h3><button class="btn sm" data-p="close" aria-label="Zavřít">✕</button></div>'+

function parseDelim(t,d){
  var rows=[],row=[],cell='',q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"'&&cell==='')q=true;
    else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cell);cell='';rows.push(row);row=[]}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}

  if(/ignor/.test(n))return 'ignor';if(/odmit|nezaj|odm/.test(n))return 'nezajem';if(/spolup|klient|zajem/.test(n))return 'spoluprace';if(/schuz/.test(n))return 'schuzka';
  if(/ceka|cekam/.test(n))return 'ceka';if(/jedn|kontakt|odpov/.test(n))return 'kontakt';if(/novy|neoslov|nekontakt/.test(n))return 'novy';

}

      var ix={name:col(/jmeno|name|osoba|kdo/),mail:col(/^e-?mail|^mail/),phone:col(/telefon|^tel$|phone|mobil/),other:col(/^jine|linkedin|^other|^web/),contact:col(/^kontakt|^contact/),

  var t=nameToks(name),key=t.slice().sort().join(' '),exact=[],sc=[];

function impCommit(){

      var later=rows.slice(ri+1).some(function(x){return x.sent});

      var e={at:dateToAt(d),type:KINDTYPE[kind],kind:kind,outcome:oc,text:'',ts:now};
      if(r.channel)e.channel=r.channel;if(r.sent)e.sent=r.sent;if(r.reply)e.reply=r.reply;

var cv=null;
function parseConv(text,meLabel,c){
  var me=['ja','me','moje','my','ja:']; String(meLabel||'').split(/[,;]/).forEach(function(x){x=norm(x);if(x)me.push(x)});
  var them=nameToks(c.name);
  var re=/^\s*(?:[\[(]?(\d{1,2}\.\s?\d{1,2}\.(?:\s?\d{2,4})?)(?:[ ,]+\d{1,2}:\d{2})?[\])]?\s*[-–,]?\s*)?([^:\n]{1,40}?)\s*:\s*(.*)$/;
  var turns=[],curT=null;
  String(text||'').replace(/\r\n?/g,'\n').split('\n').forEach(function(line){
    var m=line.match(re),lab=m?norm(m[2]):'',words=m?m[2].trim().split(/\s+/).length:9,isMe=m&&me.indexOf(lab)>=0,isThem=m&&nameToks(m[2]).some(function(w){return them.indexOf(w)>=0}),isOther=m&&words<=3&&!/[.!?,;]/.test(m[2])&&/^[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]/.test(m[2].trim());
    if(m&&(isMe||isThem||isOther)){
      var dt='';if(m[1]){var p=m[1].replace(/\s/g,'').split('.').filter(Boolean),y=p[2]?(p[2].length===2?2000+ +p[2]:+p[2]):new Date().getFullYear();dt=validYmd(y,+p[1],+p[0])||'';if(dt&&!p[2]&&dt>today())dt=validYmd(y-1,+p[1],+p[0])||dt}
      curT={who:isMe?'me':'them',text:m[3].trim(),date:dt};turns.push(curT);
    }else if(curT&&line.trim()){curT.text+=(curT.text?'\n':'')+line.trim()}
    else if(!curT&&line.trim()){curT={who:'them',text:line.trim(),date:''};turns.push(curT)}
  });
  return turns;
}

/* ---------- psaní zprávy za uživatele: prompt, šablona, volitelně Claude API ---------- */
function pickSamples(c,max){
  var f=norm(c.field),wantFirst=!firstMsg(c),all=allMsgs().filter(function(x){return x.c.id!==c.id&&x.l.sent&&String(x.l.sent).trim()}),out=[];
  all.forEach(function(x){
    var l=x.l,sc=0;if(!(l.star||isSuccess(l)))return;
    if(l.star)sc+=4;if(l.outcome==='schuzka'||l.outcome==='zajem')sc+=3;else if(l.outcome==='jednani')sc+=2;if(l.reply)sc+=1;
    if(f&&norm(x.c.field)===f)sc+=3;if((l.kind==='prvni')===wantFirst)sc+=2;
    out.push({x:x,sc:sc});
  });
  out.sort(function(a,b){return b.sc-a.sc});
  var r=out.slice(0,max).map(function(o){return o.x});
  if(!r.length){all.sort(function(a,b){return ((b.l.kind==='prvni')===wantFirst)-((a.l.kind==='prvni')===wantFirst)||(b.l.at<a.l.at?-1:1)});r=all.slice(0,Math.min(max,2)).map(function(x){x.unverified=true;return x})}
  return r;
}

function apiError(status,d){
  var m=d&&d.error&&d.error.message?d.error.message:'';
  if(status===401)return 'Klíč nebyl přijat (401). Zkontroluj ho v Nastavení, nebo vytvoř nový v konzoli Anthropic.';
  if(status===403)return 'Klíč nemá oprávnění (403). Zkontroluj ho a nastavení účtu v konzoli Anthropic.';
  if(status===404)return 'Model „'+AI_MODEL+'“ není pro tenhle klíč dostupný (404).';
  if(status===429)return 'Je dosažen limit požadavků nebo útraty (429). Počkej chvíli, případně limit zvyš v konzoli Anthropic.';
  if(status===400&&/credit|balance/i.test(m))return 'Na účtu Anthropic nejsou kredity (400). Dobij je v konzoli Anthropic.';
  if(status===529||status>=500)return 'Služba Anthropic je přetížená nebo nedostupná ('+status+'). Zkus to za chvíli.';
  return 'Chyba API ('+status+')'+(m?': '+m:'')+'.';
}
/* jediné místo, kde appka posílá data ven: přímé volání api.anthropic.com s klíčem uživatele (žádná telemetrie) */
async function callClaude(content){
  var key=getKey();if(!key)throw new Error('Nejdřív vlož API klíč v Nastavení.');
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},60000),res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ctl.signal,
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:AI_MODEL,max_tokens:600,system:'Píšeš za uživatele oslovovací zprávy v češtině podle jeho stylu a vzorů. Odpovídej pouze textem zprávy.',messages:[{role:'user',content:content}]})});
  }catch(e){clearTimeout(to);throw new Error(e&&e.name==='AbortError'?'Claude neodpověděl do 60 s. Zkus to znovu.':'Nepodařilo se spojit s api.anthropic.com. Zkontroluj připojení (nebo blokování rozšířením prohlížeče).')}
  clearTimeout(to);
  var data=null;try{data=await res.json()}catch(e){}
  if(!res.ok)throw new Error(apiError(res.status,data));
  var txt=((data&&data.content)||[]).filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('\n').trim();
  if(!txt)throw new Error('Claude vrátil prázdnou odpověď. Zkus to znovu.');
  return txt;
}

function gridKey(e){
  var k=e.key,mod=e.ctrlKey||e.metaKey;
  if(mod){
    var l=k.toLowerCase();
    if(l==='z'){e.preventDefault();e.shiftKey?redo():undo()}
    else if(l==='y'){e.preventDefault();redo()}
    else if(l==='a'){e.preventDefault();anc={id:view.length?view[0].id:ADD,c:0};cur={id:view.length?view[view.length-1].id:ADD,c:VC.length-1};extras=[];paintSel()}

    else if(k==='Enter'){e.preventDefault();if(cur.id!==ADD)msgPop(cur.id)}
    else if(k==='Home'){e.preventDefault();setCur(0,0,e.shiftKey)}
    else if(k==='End'){e.preventDefault();setCur(view.length-1,VC.length-1,e.shiftKey)}
    else if(k.indexOf('Arrow')===0){e.preventDefault();moveCur(k==='ArrowDown'?1:k==='ArrowUp'?-1:0,k==='ArrowRight'?1:k==='ArrowLeft'?-1:0,e.shiftKey,true)}
    return;
  }
  if(e.altKey){var a=k.toLowerCase();if(a==='n'){e.preventDefault();openPanel(null)}else if(a==='w'){e.preventDefault();if(cur.id!==ADD)openCompose(cur.id)}else if(a==='m'){e.preventDefault();if(cur.id!==ADD)msgPop(cur.id)}else if(a==='h'){e.preventDefault();$('#fs').focus()}return}
  switch(k){
    case 'ArrowDown':e.preventDefault();moveCur(1,0,e.shiftKey);break;
    case 'ArrowUp':e.preventDefault();moveCur(-1,0,e.shiftKey);break;
    case 'ArrowRight':e.preventDefault();moveCur(0,1,e.shiftKey);break;
    case 'ArrowLeft':e.preventDefault();moveCur(0,-1,e.shiftKey);break;
    case 'PageDown':e.preventDefault();moveCur(10,0,e.shiftKey);break;
    case 'PageUp':e.preventDefault();moveCur(-10,0,e.shiftKey);break;
    case 'Home':e.preventDefault();moveCur(0,-1,e.shiftKey,true);break;
    case 'End':e.preventDefault();moveCur(0,1,e.shiftKey,true);break;
    case 'Tab':{
      var i=idxOf(cur.id),c=cur.c+(e.shiftKey?-1:1);
      if(c<0){if(i===0)return;e.preventDefault();setCur(i-1,VC.length-1);return}
      if(c>=VC.length){if(i>=view.length)return;e.preventDefault();setCur(i+1,0);return}
      e.preventDefault();setCur(i,c);return}
    case 'Enter':e.preventDefault();if(e.shiftKey)insertBelow();else startEdit();break;
    case 'F2':e.preventDefault();startEdit();break;
    case ' ':e.preventDefault();if(cur.id!==ADD)openPanel(cur.id);break;
    case 'Delete':case 'Backspace':e.preventDefault();clearRanges();break;
    case 'Escape':if(picked.size){picked.clear();renderBulk();render()}else if(extras.length||range().r1!==range().r2||range().c1!==range().c2)setCur(idxOf(cur.id),cur.c);break;
    default:
      if(k.length===1&&!e.isComposing&&VC[cur.c].t!=='ro'){e.preventDefault();startEdit(k)}
  }
}

      var nn=applyMessage(editing,f,msgEdit);nn._new=editing._new;editing=nn;var wasEdit=msgEdit!=null;msgEdit=null;
      persist(editing,wasEdit?'Zpráva upravena':'Zpráva zapsána','zpráva');drawPanel();
    }
    else if(p==='mecancel'){readForm();msgEdit=null;drawPanel()}
    else if(p==='compose'||p==='conv'){
      readForm();var cur0=byId(editing.id);if(cur0&&JSON.stringify(stripNew(editing))!==JSON.stringify(cur0))persist(editing,null,'úprava kontaktu');
      if(p==='compose')openCompose(editing.id);else openConv(editing.id);
    }
    else if(p==='del'){
      if(el.dataset.sure){var gone=stripNew(editing),e2;removeContact(editing.id);e2=undoS[undoS.length-1];closePanel();toast('Smazáno',function(){undo(e2)})}
      else{el.dataset.sure='1';el.textContent='Opravdu smazat?'}
    }
    return;
  }
  if(el.dataset.dl!==undefined&&editing){readForm();var di=+el.dataset.dl;editing.log=(editing.log||[]).filter(function(l,i){return i!==di});editing.status=statusFromLog(editing);msgEdit=null;persist(editing,'Záznam smazán','smazání zprávy');drawPanel();return}
  if(el.dataset.me!==undefined&&editing){readForm();msgEdit=+el.dataset.me;drawPanel();var mt=$('#m-text');if(mt)mt.focus();return}
});
/* myš v mřížce */
var dragging=false,rz=null;
wrap.addEventListener('mousedown',function(e){
  if(e.button!==0)return;var t=e.target;
  if(isMobile())return;
  if(ce&&ce.input&&t===ce.input)return;
  var h=t.closest('.rz');
  if(h){e.preventDefault();var j=+h.dataset.rz;rz={j:j,x:e.clientX,w:colW(VC[j]),el:h};h.classList.add('drag');return}
  if(t.closest('.hrow'))return;
  if(t.closest('a.lnk')||t.closest('[data-ck]')||t.closest('[data-open]')||t.closest('[data-msg]')||t.closest('[data-sendnow]')||t.closest('[data-wrote]')||t.closest('[data-compose]'))return;
  var cell=t.closest('.row .cell[data-c]'),numc=t.closest('.row .cell.num');
  if(!cell&&!numc)return;
  var rowEl_=t.closest('.row'),id=rowEl_.dataset.id,c=cell?+cell.dataset.c:0;
  e.preventDefault();
  if(ce&&ce.input)commitEdit('none',true);else if(ce)cancelEdit();
  if(idxOf(id)<0)return;
  var ctrl=e.ctrlKey||e.metaKey;
  if(numc){    // klik na číslo řádku = celý řádek
    var a2=e.shiftKey?anc:{id:id,c:0};
    if(ctrl&&!e.shiftKey)extras.push({a:anc,f:cur});else if(!e.shiftKey)extras=[];
    anc={id:a2.id,c:0};cur={id:id,c:VC.length-1};if(!e.shiftKey)anc={id:id,c:0};paintSel();wrap.focus({preventScroll:true});dragging=true;return;
  }
  if(e.shiftKey){cur={id:id,c:c};paintSel()}
  else if(ctrl){extras.push({a:anc,f:cur});anc={id:id,c:c};cur={id:id,c:c};paintSel()}
  else{extras=[];anc={id:id,c:c};cur={id:id,c:c};paintSel()}
  wrap.focus({preventScroll:true});dragging=!e.shiftKey;
  if(t.closest('[data-badge]')&&!e.shiftKey&&!ctrl&&id!==ADD){dragging=false;startEdit()}
});
wrap.addEventListener('mouseover',function(e){
  var hh=e.target.closest&&e.target.closest('[data-hist]');if(hh&&!hh.title){var hc=byId(hh.closest('.row').dataset.id);if(hc)hh.title=histText(hc)}
  if(!dragging)return;var cell=e.target.closest('.row .cell[data-c]');if(!cell)return;
  var id=cell.closest('.row').dataset.id;if(cur.id===id&&cur.c===+cell.dataset.c)return;
  cur={id:id,c:+cell.dataset.c};paintSel();
});
document.addEventListener('mousemove',function(e){
  if(!rz)return;widths[VC[rz.j].k]=clamp(rz.w+e.clientX-rz.x,50,900);applyCols();
});
document.addEventListener('mouseup',function(){
  dragging=false;if(rz){rz.el.classList.remove('drag');rz=null;lsSet(WKEY,widths)}
});
wrap.addEventListener('dblclick',function(e){
  var h=e.target.closest('.rz');if(h){var k=VC[+h.dataset.rz].k;delete widths[k];lsSet(WKEY,widths);applyCols();return}
  if(isMobile()||e.target.closest('a.lnk')||e.target.closest('[data-open]'))return;
  var cell=e.target.closest('.row .cell[data-c]');if(!cell||ce)return;startEdit();
});
wrap.addEventListener('click',function(e){   // mobil: klepnutí na řádek otevře panel
  if(!isMobile())return;if(e.target.closest('[data-msg],[data-sendnow],[data-wrote]'))return;var row=e.target.closest('.row');if(!row)return;
  if(row.dataset.id===ADD)openPanel(null);else openPanel(row.dataset.id);
});
wrap.addEventListener('scroll',function(){wrap.classList.toggle('sx',wrap.scrollLeft>0);if(pop){if(pop.edit)placePop();else closePop(true)}});
window.addEventListener('resize',function(){if(pop)placePop()});
window.matchMedia('(max-width:699px)').addEventListener('change',function(){if(ce)cancelEdit();else render()});
document.addEventListener('mousedown',function(e){
  if(e.target.classList&&e.target.classList.contains('dlg-ov')){closeDlg();return}
  if(e.target.id==='ov'){closePanel();return}
  if(!pop)return;
  if(pop.el.contains(e.target)){if(pop.edit&&e.target.id!=='dp')e.preventDefault();return}
  if(pop.opener&&pop.opener.contains(e.target))skipClick=true;
  if(pop.kind==='status'){if(ce&&!(ce.cell&&ce.cell.contains(e.target)))cancelEdit()}
  else if(!pop.edit)closePop(true);
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(dlg){
    if(e.key==='Escape'){e.preventDefault();closeDlg();return}
    if(e.key==='Tab'){var df=[].slice.call(dlg.el.querySelectorAll('button,input,select,textarea,summary,[tabindex]:not([tabindex="-1"])')).filter(function(x){return !x.disabled&&x.offsetParent!==null});if(df.length){var d0=df[0],d1=df[df.length-1];if(e.shiftKey&&document.activeElement===d0){e.preventDefault();d1.focus()}else if(!e.shiftKey&&document.activeElement===d1){e.preventDefault();d0.focus()}}}
    return;
  }
  if(editing){
    if(e.key==='Escape'){closePanel();return}
    if(e.key==='Tab'){var f=[].slice.call(document.querySelectorAll('.panel button,.panel input,.panel select,.panel textarea')).filter(function(x){return !x.disabled});if(!f.length)return;var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){var b=document.querySelector(t.id==='m-text'?'[data-p=addlog]':'[data-p=save]');if(b)b.click()}
    return;
  }
  if(ce&&ce.input&&t===ce.input){editorKey(e);return}
  if(t===wrap){if(ce&&ce.kind==='status'){menuKey(e);return}gridKey(e);return}
  if(t.id==='fs'){
    if(e.key==='Escape'){if(t.value){t.value='';fSearch='';render()}else wrap.focus({preventScroll:true})}
    else if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();wrap.focus({preventScroll:true})}
    return;
  }
  if(e.key==='Escape'&&pop){closePop();return}
  if(e.key==='/'&&(e.ctrlKey||e.metaKey)){e.preventDefault();helpPop(wrap);return}
  var tg=t.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(t===document.body&&/^Arrow/.test(e.key)&&!isMobile()){wrap.focus({preventScroll:true});gridKey(e);return}
  if(t.closest&&t.closest('.pop'))return;
  if(e.key==='n'){e.preventDefault();openPanel(null)}
  if(e.key==='/'){e.preventDefault();$('#fs').focus()}
  if(e.key==='?'){e.preventDefault();helpPop(wrap)}
});
document.addEventListener('input',function(e){
  if(e.target.id==='fs'){fSearch=e.target.value;render()}
  if(e.target.classList&&e.target.classList.contains('cv-x')&&cv)cv.turns[+e.target.dataset.i].text=e.target.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='file'){var f=t.files[0];if(f){var fr=new FileReader();fr.onload=function(){importText(f.name,String(fr.result))};fr.readAsText(f,'utf-8')}t.value='';return}
  if(t.id==='b-status'&&t.value){var v=t.value;bulkApply(function(c){c.status=v;return c},'změna stavu');return}
  if(t.id==='b-due'&&t.value){bulkDue(t.value);return}
  if(t.id==='im-file'){var f0=t.files[0];if(f0){var fr0=new FileReader();fr0.onload=function(){$('#im-text').value=String(fr0.result);impParse()};fr0.readAsText(f0,'utf-8')}t.value='';return}
  if(t.classList&&t.classList.contains('im-sel')){imp.groups[+t.dataset.g].sel=t.value;impSummary();return}
  if(t.classList&&t.classList.contains('cv-who')){cv.turns[+t.dataset.i].who=t.value;return}
  if(t.classList&&t.classList.contains('cv-d')){cv.turns[+t.dataset.i].date=t.value;return}
  if(t.id==='mem-how'||t.id==='mem-offer'){lsSet(STYLEKEY,{how:$('#mem-how').value,offer:$('#mem-offer').value});return}
  if(t.id==='s-base'||t.id==='s-prog'||t.id==='s-steps'){var io=ui.intv||{};io.base=clamp(+$('#s-base').value||7,1,365);io.prog=$('#s-prog').checked;io.steps=parseSteps($('#s-steps').value);ui.intv=io;saveUi();$('#s-steps').value=io.steps.join(', ');render();return}
  if(t.id==='s-time'){ui.remind=Object.assign(ui.remind||{},{time:t.value||'09:00'});saveUi();return}
  if(t.id==='df-date'&&pop&&pop.kind==='datefix'){var nx=$('#df-next');if(nx&&!nx.dataset.touched&&pop.dfGap!=null&&t.value)nx.value=addDays(t.value,pop.dfGap);return}
  if(t.id==='df-next'){t.dataset.touched='1';return}
  if(t.id==='m-fu'){t.dataset.touched='1';$('#m-fud').hidden=t.value!=='custom';return}
  if(t.id==='m-outcome'){var fu=$('#m-fu');if(fu&&!fu.dataset.touched&&fu.options[0].value!=='keep'){var term=['odmitl','schuzka','zajem'].indexOf(t.value)>=0;fu.value=term?'none':String(+ui.fuDays||7);$('#m-fud').hidden=true}return}
  if(t.id==='dp'&&ce&&ce.input){ce.input.value=t.value;commitEdit('none');return}
  if(t.dataset&&t.dataset.col){
    var hide=hiddenCols();hide=hide.filter(function(x){return x!==t.dataset.col});if(!t.checked)hide.push(t.dataset.col);ui.hide=hide;saveUi();
    var kept=pop;render();pop=kept;placePop();return;
  }
});
document.addEventListener('keydown',function(e){   // Enter v poli Obor v hromadné liště
  if(e.target.id==='b-field'&&e.key==='Enter'){e.preventDefault();var b=document.querySelector('[data-bulk=field]');if(b)b.click()}
});
/* schránka */
function gridActive(){return !editing&&!ce&&document.activeElement===wrap}
document.addEventListener('copy',function(e){if(!gridActive())return;e.clipboardData.setData('text/plain',rangeTsv());e.preventDefault();toast('Zkopírováno')});
document.addEventListener('cut',function(e){if(!gridActive())return;e.clipboardData.setData('text/plain',rangeTsv());e.preventDefault();clearRanges()});
document.addEventListener('paste',function(e){if(!gridActive())return;var t=e.clipboardData.getData('text/plain');if(!t)return;e.preventDefault();doPaste(t)});

/* ---------- start ---------- */
var rawBefore=null;try{rawBefore=localStorage.getItem(KEY)}catch(e){}
contacts=load();
if(contacts.some(needsMig)){   // jednorázová migrace starých dat (původní data zůstanou zálohovaná)
  try{if(rawBefore&&!localStorage.getItem(KEY+'_premigrace'))localStorage.setItem(KEY+'_premigrace',rawBefore)}catch(e){}
  contacts.forEach(migrateContact);persistAll();
}
render();
/* přepočet „dnes / po termínu“: každou minutu hlídáme změnu dne a hodiny, při návratu na kartu vždy */
var lastDay=today(),lastHour=new Date().getHours();
function idle(){return !editing&&!ce&&!pop}
function tick(){
  var t=today(),h=new Date().getHours();
  if(t!==lastDay)bannerOn=true;
  if((t!==lastDay||h!==lastHour)&&idle()){lastDay=t;lastHour=h;render()}
  timedNotify();
}
function resume(){
  if(document.visibilityState!=='visible')return;
  bannerOn=true;if(idle()){lastDay=today();lastHour=new Date().getHours();render()}
  timedNotify();
}
setInterval(tick,60*1000);
document.addEventListener('visibilitychange',resume);
window.addEventListener('focus',resume);
if(remind().on){notifyDigest();if(nowHm()>=remind().time){ui.lastNotified=today();saveUi()}}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
