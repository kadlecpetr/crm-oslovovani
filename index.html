<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oslovovací CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Mřížka jako v Excelu: sticky hlavička, zmrazený sloupec Jméno, tenké čáry, inline editace. Detail kontaktu je boční panel. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f4f4f2; --ink:#1c1c1a; --muted:#6b6b66; --line:#e3e3df; --line2:#c9c9c3;
  --accent:#0f6e66; --accent-ink:#ffffff; --late:#c2362b; --warn:#a85a05;
  --head:#f1f1ee; --zebra:#fafaf8; --hover:#f0f4f3; --chkbg:#e3f1ef; --selbg:rgba(15,110,102,.13);
  --f-body:'Instrument Sans',system-ui,sans-serif;
  --overlay:rgba(20,20,18,.35); --rh:30px; --numw:46px; --ckw:34px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#141413; --surface2:#1f1f1d; --ink:#ebebe8; --muted:#9a9a94; --line:#2e2e2b; --line2:#46463f;
  --accent:#3cc2b4; --accent-ink:#06201d; --late:#ff8a7e; --warn:#f0a94a; --overlay:rgba(0,0,0,.55);
  --head:#1f1f1d; --zebra:#181817; --hover:#212625; --chkbg:#16302d; --selbg:rgba(60,194,180,.17); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#141413; --surface2:#1f1f1d; --ink:#ebebe8; --muted:#9a9a94; --line:#2e2e2b; --line2:#46463f;
  --accent:#3cc2b4; --accent-ink:#06201d; --late:#ff8a7e; --warn:#f0a94a; --overlay:rgba(0,0,0,.55);
  --head:#1f1f1d; --zebra:#181817; --hover:#212625; --chkbg:#16302d; --selbg:rgba(60,194,180,.17); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;margin:0;overflow:hidden}
.wrap{height:100dvh;display:flex;flex-direction:column;min-height:0;
  padding:0 max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 0 8px;flex:none}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.btn{border:0;background:transparent;border-radius:6px;padding:6px 11px;font-weight:500;color:var(--ink)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn.sm{padding:4px 8px;font-size:13px;color:var(--muted)}
.btn.sm:hover{color:var(--ink)}
.btn.danger{color:var(--late)}
.hbtns{display:flex;gap:4px;align-items:center}
.toolbar{display:flex;gap:8px;align-items:center;flex:none;margin-bottom:6px}
.toolbar input[type=search]{background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:6px 10px;min-width:0;width:300px;max-width:100%;font-size:14px}
.toolbar input[type=search]:focus-visible{outline-offset:1px}
.views{display:flex;gap:2px;align-items:flex-end;flex:none;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.vt{display:inline-flex;align-items:center;gap:2px;border:0;border-bottom:2px solid transparent;background:none;padding:6px 10px 5px;color:var(--muted);font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0}
.vt:hover{background:var(--surface2);color:var(--ink)}
.vt.on{color:var(--ink);border-bottom-color:var(--accent)}
.vw{display:inline-flex;align-items:center}
.vw .vx{border:0;background:none;color:var(--muted);padding:0 5px;font-size:12px;border-radius:4px}
.vw .vx:hover{color:var(--late)}
.stats{display:flex;gap:6px;flex-wrap:wrap;flex:none;padding:8px 0;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
button.chip:hover{background:var(--surface2)}
.chip b{color:var(--ink);font-weight:600}.chip.late b{color:var(--late)}.chip.today b{color:var(--warn)}
.chip.on{background:var(--surface2);border-color:var(--accent)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--sc,var(--muted));display:inline-block}
[data-s=ignor]{--sc:#8c7a5b}[data-s=novy]{--sc:#9a9a94}[data-s=osloven]{--sc:#d4a017}[data-s=ceka]{--sc:#d4781c}[data-s=kontakt]{--sc:#2f7fd1}[data-s=schuzka]{--sc:#7c4fd0}[data-s=spoluprace]{--sc:#2a9d5c}[data-s=nezajem]{--sc:#c2362b}
/* hromadná lišta */
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;background:var(--chkbg);border:1px solid var(--accent);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.bulk[hidden]{display:none}
.bulk select,.bulk input{background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:13px;min-height:28px}
.bulk input{width:130px}
/* mřížka */
.gw{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);position:relative;overscroll-behavior:contain}
.gw:focus{outline:none}
.gw:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.g{width:max(var(--total),100%)}
.row,.hrow{display:grid;grid-template-columns:var(--cols);height:var(--rh);width:100%;border-bottom:1px solid var(--line);background:var(--rowbg,var(--surface))}
.row{content-visibility:auto;contain-intrinsic-size:auto 30px}
.row:nth-child(even){--rowbg:var(--zebra)}
.row:hover{--rowbg:var(--hover)}
.row.chk{--rowbg:var(--chkbg)}
.row.done .cell:not(.num):not(.ck){opacity:.62}
.hrow{position:sticky;top:0;z-index:6;--rowbg:var(--head);height:32px}
.cell{min-width:0;height:100%;padding:0 8px;display:flex;align-items:center;gap:4px;border-right:1px solid var(--line);overflow:hidden;white-space:nowrap;position:relative;background:inherit}
.cell.rng{background-image:linear-gradient(var(--selbg),var(--selbg))}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.gw:not(:focus-within) .cell.sel{box-shadow:inset 0 0 0 2px var(--muted)}
.cell.num,.cell.ck{position:sticky;z-index:2;justify-content:center;padding:0;color:var(--muted);font-size:12px;background:var(--rowbg,var(--surface))}
.cell.num{left:0;background-color:var(--head)}
.cell.num.hl{background-color:var(--line);color:var(--ink);font-weight:600}
.cell.ck{left:var(--numw)}
.cell.ck input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.cell[data-k=name]{position:sticky;left:calc(var(--numw) + var(--ckw));z-index:2}
.gw.sx .cell[data-k=name]{border-right:2px solid var(--line2)}
.hrow .cell{font-size:12px;font-weight:600;color:var(--muted);gap:2px}
.hrow .cell.num,.hrow .cell.ck{z-index:8}
.hrow .cell[data-k=name]{z-index:8}
.hl2{background:none;border:0;padding:0;font-weight:600;font-size:12px;color:inherit;display:inline-flex;gap:4px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left;height:100%}
.hl2:hover{color:var(--ink)}
.ar{font-size:9px;color:var(--accent)}.ar.dim{opacity:.35}
.hf{background:none;border:0;border-radius:4px;padding:1px 4px;font-size:11px;color:var(--muted)}
.hf:hover,.hf.on{background:var(--line);color:var(--ink)}
.hf.on{color:var(--accent)}
.rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:3}
.rz:hover,.rz.drag{background:var(--accent);opacity:.5}
.t{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ph{color:var(--muted)}
.cell[data-k=name] .t{font-weight:500}
.acts{position:absolute;right:3px;top:50%;transform:translateY(-50%);display:none;gap:2px;align-items:center;background:var(--rowbg,var(--surface));padding-left:4px}
.row:hover .acts,.cell.sel .acts,.acts:focus-within{display:flex}
.open,.msgb{height:22px;border:0;border-radius:4px;background:var(--line);color:var(--ink);font-size:12.5px;line-height:1;padding:0 6px;white-space:nowrap}
.open{width:22px;padding:0;font-size:13px}
.open:hover,.msgb:hover{background:var(--accent);color:var(--accent-ink)}
.mbtn{display:none}
.lk{display:flex;gap:2px;flex:none}
.lnk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;color:var(--accent);text-decoration:none;font-size:13px}
.lnk:hover{background:var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:1px 9px 1px 7px;border-radius:999px;font-size:12.5px;background:color-mix(in srgb,var(--sc) 17%,transparent);overflow:hidden;white-space:nowrap;cursor:pointer}
.badge::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--sc)}
.due{color:var(--muted)}
.cd{display:inline-flex;align-items:center;gap:4px;padding:2px 11px;border-radius:999px;font-weight:700;font-size:13.5px;background:var(--surface2);color:var(--muted);white-space:nowrap;flex:none}
.cd.late{background:var(--late);color:var(--bg)}.cd.late::before{content:"⚠"}
.cd.today{background:var(--warn);color:var(--bg)}
.cd.soon{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
.cd.far{font-weight:600}
.cdd{color:var(--muted);font-size:12px;margin-left:8px;white-space:nowrap}
.fuc{display:inline-block;padding:0 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px;margin-right:4px;white-space:nowrap;flex:none}
.sendnow{border:1px solid var(--line2);background:var(--surface);border-radius:5px;padding:1px 7px;font-size:12px;margin-left:6px;white-space:nowrap}
.sendnow:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint2{font-size:11.5px;color:var(--warn);margin-left:6px;white-space:nowrap}
.ph.w{color:var(--warn);font-style:italic;font-size:12.5px}
.cell[data-w]::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;border-bottom:1.5px dotted var(--warn);opacity:.7;pointer-events:none}
.ln{display:flex;gap:6px;align-items:center;min-width:0;flex:1;cursor:pointer}
.ln .badge{flex:none}
.ago{color:var(--muted);font-size:12px;flex:none}
.due.late{color:var(--late);font-weight:600}.due.late::before{content:"⚠ "}
.due.today{color:var(--warn);font-weight:600}
.last{color:var(--muted)}
.cell.ed{overflow:visible;padding:0;z-index:4}
.cell.ed input{width:100%;height:100%;border:0;outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface);padding:0 8px;font:inherit;color:var(--ink)}
.row.addrow .num{font-size:15px}
.row.addrow .cell[data-k=name] .t{font-weight:400}
.empty{padding:28px 16px;text-align:center;color:var(--muted);position:sticky;left:0}
.empty p{margin:0 0 12px}
.sbar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:6px;font-size:12.5px;color:var(--muted)}
/* popover */
.pop{position:fixed;z-index:25;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:4px;min-width:190px;max-width:min(420px,calc(100vw - 16px));max-height:min(380px,60vh);overflow:auto;font-size:13.5px}
.pi{display:flex;width:100%;gap:8px;align-items:center;justify-content:space-between;text-align:left;border:0;background:none;padding:6px 10px;border-radius:5px;white-space:nowrap}
.pi:hover,.pi.hi,.pi:focus-visible{background:var(--surface2);outline:none}
.pi.hi{box-shadow:inset 2px 0 0 var(--accent)}
.pi .sub{color:var(--muted);font-size:12px}
.pi.cur{font-weight:600}
.pop .pd{padding:6px 10px 4px}
.pop .pd input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.pop h4{margin:6px 10px 4px;font-size:12px;color:var(--muted);font-weight:600}
.pop .sc{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:6px 10px;font-size:13px;min-width:340px}
.pop .sc kbd{font:inherit;font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.pop label.pc{display:flex;gap:8px;align-items:center;margin:0;padding:6px 10px;font-size:13.5px;color:var(--ink)}
.msgpop{width:350px;padding:6px 12px 12px}
.mf label{margin:10px 0 3px}
.mf input,.mf select,.mf textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.mf textarea{min-height:56px}
.mf .foot{margin-top:12px}
.histpop{width:380px}
.hl{list-style:none;margin:0;padding:4px 10px;display:grid;gap:8px}
.hl li{display:grid;grid-template-columns:62px 1fr;gap:8px}
.hl .when,.log .when{color:var(--muted);white-space:nowrap}
.note{display:block;color:var(--muted);margin-top:2px;white-space:pre-wrap}
.sech{margin:24px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.pop .vsave{display:flex;gap:6px;padding:6px}
.pop .vsave input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0}
/* panel */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:30;display:flex;justify-content:flex-end;overscroll-behavior:contain}
.panel{background:var(--surface);width:min(480px,100%);height:100%;overflow-y:auto;
  padding:28px max(24px,env(safe-area-inset-right,0px)) 48px 24px;padding-top:calc(28px + env(safe-area-inset-top,0px))}
.panel h3{font-size:18px;font-weight:600;margin:0}
.ph2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;position:sticky;top:-28px;background:var(--surface);padding:8px 0;z-index:1}
label{display:block;font-size:12px;color:var(--muted);margin:18px 0 4px}
.panel input,.panel select,.panel textarea{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:6px;padding:8px 10px;min-width:0}
.panel input:focus-visible,.panel select:focus-visible,.panel textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:8px}
.quick button{background:none;border:0;padding:2px 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.quick button:hover{color:var(--ink)}
.sec{margin-top:32px}
.log{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;font-size:14px;align-items:start}
.log .mbt{display:flex}
.log .note{color:var(--ink)}
.log .x{background:none;border:0;color:var(--muted);padding:0 4px}.log .x:hover{color:var(--late)}
.log .when{color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:24px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin-top:16px}
.toast button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;margin-left:12px;padding:0}
.toast{animation:tin .15s ease-out;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:40;font-size:14px;max-width:calc(100vw - 24px)}
@keyframes tin{from{opacity:0}}
@media(pointer:coarse){.btn{min-height:44px}.btn.sm{padding:10px 14px}.quick button{padding:10px 0}.toolbar input{min-height:44px}.log .x{min-height:44px;min-width:44px}.chip{padding:10px 14px}.vt{min-height:44px}.open{opacity:1}.pi{min-height:44px}.bulk select,.bulk input{min-height:44px}}
@media(max-width:699px){
  input,select,textarea{font-size:16px!important}
  header{padding-top:max(12px,env(safe-area-inset-top,0px))}
  .desk,.sbar,.hrow{display:none!important}
  .toolbar input[type=search]{width:100%;flex:1}
  .stats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chip{flex:none}
  .btn,.vt,.chip{min-height:44px}.btn.sm{padding:10px 12px}.stats{padding:4px 0 8px}
  .gw{border-left:0;border-right:0;border-radius:0;overflow-x:hidden}
  .g{width:100%}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;height:auto;min-height:68px;padding:8px 4px;column-gap:12px;align-content:center;cursor:pointer;content-visibility:visible}
  .row .cell{border:0;padding:0;height:auto;display:none;position:static;background:none}
  .row .cell[data-w]::after{display:none}
  .row .cell[data-k=name],.row .cell[data-k=status],.row .cell[data-k=nextDate]{display:flex}
  .row .cell[data-k=name]{grid-column:1;grid-row:1;font-size:15px}
  .row .cell[data-k=status]{grid-column:1;grid-row:2;padding-top:3px;flex-wrap:wrap;gap:2px 0}
  .row .cell[data-k=nextDate]{grid-column:2;grid-row:1 / 3;justify-self:end;align-self:center;flex-direction:column;align-items:flex-end;gap:2px}
  .row .cdd{display:none}
  .cd{font-size:14px}
  .mbtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:13px;font-weight:500}
  .acts{display:none!important}
  .row.addrow .cell[data-k=status],.row.addrow .cell[data-k=nextDate]{display:none}
  .row.addrow{min-height:48px}
  .pop.msgpop{left:0!important;right:0;bottom:0;top:auto!important;width:100%;max-width:100%;border-radius:12px 12px 0 0;max-height:88dvh;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
  .histpop{width:100%;left:0!important;right:0}
  .cell.sel,.cell.rng{box-shadow:none;background-image:none}
  .gw:focus-visible{box-shadow:none}
  .bulk{display:none!important}
}
@media(prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:0}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Oslovovací CRM</h1>
    <div class="hbtns"><button class="btn sm desk" id="kb" title="Klávesové zkratky (Ctrl+/)">⌨ Zkratky</button><button class="btn sm" id="exp" title="Stáhnout CSV pro Excel">Export</button><button class="btn sm" id="imp" title="Načíst CSV nebo JSON zálohu">Import</button><button class="btn primary" id="add">+ Nový</button><input type="file" id="file" accept=".csv,.json,text/csv,application/json" hidden></div>
  </header>
  <div class="toolbar">
    <input id="fs" type="search" placeholder="Hledat…  ( / )" aria-label="Hledat">
    <button class="btn sm desk" id="colbtn" aria-haspopup="true">Sloupce ▾</button>
  </div>
  <div class="views" id="views" role="tablist" aria-label="Pohledy"></div>
  <div class="stats" id="stats"></div>
  <div class="bulk" id="bulk" hidden></div>
  <div class="gw" id="gw" tabindex="0" role="grid" aria-label="Kontakty" aria-multiselectable="true">
    <div class="g" id="g"><div class="hrow" id="hrow" role="row"></div><div id="rows"></div><div id="extra"></div></div>
  </div>
  <div class="sbar"><span id="count"></span><span>Enter upravit · Alt+M zpráva · Mezerník detail · Shift+Enter nový řádek · Ctrl+Z zpět · Ctrl+/ zkratky</span></div>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';
var STATUSES=[['novy','Neoslovený'],['osloven','Osloven (bez výsledku)'],['ceka','Čeká se na odpověď'],['ignor','Ignor (bez odpovědi)'],['kontakt','Jednáme o schůzce'],['schuzka','Schůzka domluvena'],['spoluprace','Zájem / spolupráce'],['nezajem','Odmítl']];
var SHORT={novy:'Neoslovený',osloven:'Osloven',ceka:'Čeká se',ignor:'Ignor',kontakt:'Jednáme',schuzka:'Schůzka',spoluprace:'Spolupráce',nezajem:'Odmítl'};
/* výsledek zprávy: [klíč, popisek, odpovídající stav kontaktu, krátký popisek] */

var KINDS=[['prvni','První zpráva'],['followup','Follow-up'],['odpoved','Odpověď'],['hovor','Hovor'],['schuzka','Schůzka'],['poznamka','Poznámka']];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function isIso(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')}
function addDays(base,n){var p=base.split('-');return ymd(new Date(+p[0],+p[1]-1,+p[2]+n))}
function addMonths(base,n){var p=base.split('-'),d=new Date(+p[0],+p[1]-1+n,1),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(+p[2],last));return ymd(d)}
function diffDays(a,b){var pa=a.split('-'),pb=b.split('-');return Math.round((new Date(+pa[0],+pa[1]-1,+pa[2])-new Date(+pb[0],+pb[1]-1,+pb[2]))/864e5)}
var WD=['ne','po','út','st','čt','pá','so'],fmtCache={};
function fmtDate(s){
  var r=fmtCache[s];if(r)return r;var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
  return fmtCache[s]=WD[d.getDay()]+' '+ +p[2]+'. '+ +p[1]+'.'+(+p[0]!==new Date().getFullYear()?' '+p[0]:'');
}
function fmtCz(s){if(!isIso(s))return s||'';var p=s.split('-');return +p[2]+'. '+ +p[1]+'. '+p[0]}
function fmtStamp(iso){return new Date(iso).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}
function statusLabel(k){for(var i=0;i<STATUSES.length;i++)if(STATUSES[i][0]===k)return STATUSES[i][1];return k}
var uidN=0;function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+(uidN++).toString(36)}
var coll=new Intl.Collator('cs');function csc(a,b){return coll.compare(a,b)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function isMobile(){return window.matchMedia('(max-width:699px)').matches}
function toast(t,undoFn){
  var o=document.querySelectorAll('.toast');for(var i=0;i<o.length;i++)o[i].remove();
  var e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;
  if(undoFn){var b=document.createElement('button');b.textContent='Vrátit';b.onclick=function(){undoFn();e.remove()};e.appendChild(b)}
  document.body.appendChild(e);setTimeout(function(){e.remove()},undoFn?6000:3000);
}

/* ---------- úložiště (localStorage) ---------- */
var KEY='crm_contacts',UIKEY='crm_ui',WKEY='crm_colw',VKEY='crm_views';
function lsGet(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v==null?def:v}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(){var raw=null;try{raw=localStorage.getItem(KEY);var a=JSON.parse(raw||'[]');return Array.isArray(a)?a:[]}catch(e){try{localStorage.setItem(KEY+'_broken_'+Date.now(),raw)}catch(_){}setTimeout(function(){toast('Uložená data byla poškozená, kopie je zachována')},300);return []}}
function persistAll(){try{localStorage.setItem(KEY,JSON.stringify(contacts))}catch(e){toast('Uložení se nepovedlo')}}

/* ---------- změny a historie (undo/redo) ---------- */
var undoS=[],redoS=[];
function applyOne(id,obj){var i=contacts.findIndex(function(x){return x.id===id});if(!obj){if(i>=0)contacts.splice(i,1)}else if(i>=0)contacts[i]=obj;else contacts.push(obj)}
function byId(id){for(var i=0;i<contacts.length;i++)if(contacts[i].id===id)return contacts[i];return null}
/* changes: [{id,before,after}], before/after = celý kontakt nebo null */
function commitChanges(changes,label){
  if(!changes.length)return null;
  changes.forEach(function(ch){applyOne(ch.id,ch.after)});
  var e={label:label,changes:changes};undoS.push(e);if(undoS.length>100)undoS.shift();redoS=[];
  persistAll();render(changes.map(function(ch){return ch.id}));return e;
}
function undo(e){
  var i=e?undoS.indexOf(e):undoS.length-1;if(i<0){toast('Není co vracet');return}
  e=undoS.splice(i,1)[0];for(var k=e.changes.length-1;k>=0;k--)applyOne(e.changes[k].id,e.changes[k].before);
  redoS.push(e);persistAll();render(e.changes.map(function(ch){return ch.id}));toast('Zpět: '+e.label);
}
function redo(){
  var e=redoS.pop();if(!e){toast('Není co opakovat');return}
  e.changes.forEach(function(ch){applyOne(ch.id,ch.after)});undoS.push(e);persistAll();render(e.changes.map(function(ch){return ch.id}));toast('Znovu: '+e.label);
}
function saveContact(c,label){commitChanges([{id:c.id,before:byId(c.id),after:c}],label||'úprava kontaktu')}
function removeContact(id){var b=byId(id);if(b)commitChanges([{id:id,before:b,after:null}],'smazání kontaktu')}

/* ---------- logika ---------- */
function fields(){var m={};contacts.forEach(function(c){if(c.field)m[c.field]=(m[c.field]||0)+1});return Object.keys(m).sort(csc)}
function isDone(c){return DONE.indexOf(c.status)>=0}
function dueKind(c){if(!isIso(c.nextDate)||isDone(c))return '';var d=diffDays(c.nextDate,today());return d<0?'late':d===0?'today':''}
/* ---------- zprávy (log) a odvozené údaje ---------- */
function outObj(k){for(var i=0;i<OUTCOMES.length;i++)if(OUTCOMES[i][0]===k)return OUTCOMES[i];return null}
function outLabel(k){var o=outObj(k);return o?o[1]:''}
function outBadge(k){var o=outObj(k);return o?'<span class="badge" data-s="'+o[2]+'" title="'+esc(o[1])+'">'+esc(o[3])+'</span>':''}
function kindLabel(k){for(var i=0;i<KINDS.length;i++)if(KINDS[i][0]===k)return KINDS[i][1];return k||''}
function statusToOutcome(st){return {ceka:'ceka',ignor:'ignor',nezajem:'odmitl',kontakt:'jednani',schuzka:'schuzka',spoluprace:'zajem'}[st]||''}
function outcomeKey(v){var n=norm(v);if(!n)return '';if(/ignor/.test(n))return 'ignor';if(/odmit|nezaj/.test(n))return 'odmitl';if(/jedn/.test(n))return 'jednani';if(/schuz/.test(n))return 'schuzka';if(/zajem|spolup/.test(n))return 'zajem';if(/ceka|cekam/.test(n))return 'ceka';return ''}
function msgs(c){return (c.log||[]).filter(function(l){return l&&l.at&&!isNaN(new Date(l.at))})}
function byAt(a,b){return a.at<b.at?-1:a.at>b.at?1:0}
function firstIdx(c){var best=-1;(c.log||[]).forEach(function(l,i){if(l&&l.at&&l.kind==='prvni'&&(best<0||l.at<c.log[best].at))best=i});return best}
function firstMsg(c){var i=firstIdx(c);return i<0?null:c.log[i]}
function fus(c){return msgs(c).filter(function(l){return l.kind==='followup'}).sort(byAt)}
function lastMsg(c){var m=null;msgs(c).forEach(function(l){if(!m||l.at>=m.at)m=l});return m}
function isUnsent(c){return !firstMsg(c)&&c.status==='novy'}
/* stav kontaktu se odvozuje z výsledku poslední zprávy s výsledkem */
function statusFromLog(n){
  var m=null;msgs(n).forEach(function(l){if(l.outcome&&(!m||l.at>=m.at))m=l});
  if(m){var o=outObj(m.outcome);return o?o[2]:n.status}
  if(!(n.log||[]).length&&(n.status==='ceka'||n.status==='ignor'||n.status==='osloven'))return 'novy';
  return n.status;
}
function dateToAt(d,old){if(old&&ymd(new Date(old))===d)return old;if(d===today())return new Date().toISOString();var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2],12).toISOString()}
function fmtShort(s){var p=s.split('-');return +p[2]+'. '+ +p[1]+'.'+(+p[0]!==new Date().getFullYear()?' '+p[0]:'')}
/* ---------- kontakt: Mail / Telefon / Jiné (migrace ze starého pole contact) ---------- */
var RE_MAIL=/[^\s@,;<>()]+@[^\s@,;<>()]+\.[a-z]{2,}/i;
var RE_URL=/(?:https?:\/\/|www\.)[^\s,;<>"']+|(?:[a-z0-9-]+\.)*(?:linkedin\.com|facebook\.com|instagram\.com|twitter\.com|x\.com)\/[^\s,;<>"']*/i;
var RE_TEL=/(?:\+|00)?\d[\d ()\-\/.]{7,}\d/;
function contactStr(c){return [c.mail,c.phone,c.other].filter(Boolean).join(', ')}
function splitContact(str){
  var rest=String(str||''),m,mails=[],oth=[],r={mail:'',phone:'',other:''};
  while((m=rest.match(RE_MAIL))){mails.push(m[0]);rest=rest.replace(m[0],' ')}
  r.mail=mails[0]||'';mails.slice(1).forEach(function(x){oth.push(x)});
  if((m=rest.match(RE_URL))){oth.push(m[0]);rest=rest.replace(m[0],' ')}
  if((m=rest.match(RE_TEL))&&m[0].replace(/\D/g,'').length>=9){r.phone=m[0].trim();rest=rest.replace(m[0],' ')}
  rest=rest.replace(/\b(tel|mob|mobil|telefon|e-?mail|mail|web|linkedin)\b\.?:?/gi,' ').replace(/[,;|]+/g,' ').replace(/\s+/g,' ').trim();
  if(rest)oth.push(rest);
  r.other=oth.join(', ');return r;
}
function needsMig(c){return (c.mail===undefined&&c.phone===undefined&&c.other===undefined)||!Array.isArray(c.log)||c.log.some(function(l){return l&&!l.kind})}
/* doplní nová pole; staré záznamy dostanou kind a outcome, nic se nemaže. Vrací true, když se něco změnilo. */
function migrateContact(c){
  var ch=false;
  if(c.mail===undefined&&c.phone===undefined&&c.other===undefined){var sp=splitContact(c.contact);c.mail=sp.mail;c.phone=sp.phone;c.other=sp.other;ch=true}
  ['mail','phone','other'].forEach(function(k){if(typeof c[k]!=='string'){c[k]='';ch=true}});
  if(!Array.isArray(c.log)){c.log=[];ch=true}
  if(c.log.some(function(l){return l&&!l.kind})){
    var order=c.log.map(function(l,i){return i}).sort(function(a,b){return String((c.log[a]||{}).at||'')<String((c.log[b]||{}).at||'')?-1:1});
    var seen=c.log.some(function(l){return l&&l.kind==='prvni'});
    order.forEach(function(i){
      var l=c.log[i];if(!l||l.kind)return;
      if(l.type==='napsal'){l.kind=seen?'followup':'prvni';seen=true;if(l.outcome===undefined)l.outcome='ceka'}
      else{l.kind={odpoved:'odpoved',hovor:'hovor',schuzka:'schuzka'}[l.type]||'poznamka';if(l.outcome===undefined)l.outcome=l.type==='odpoved'?'jednani':l.type==='schuzka'?'schuzka':''}
      if(l.text==null)l.text='';
    });
    var lm=lastMsg(c),o=statusToOutcome(c.status);   // poslední zpráva odráží dosavadní stav kontaktu
    if(lm&&lm.outcome&&o)lm.outcome=o;
    ch=true;
  }
  return ch;
}
function agoText(iso){
  var d=diffDays(today(),ymd(new Date(iso)));
  if(d<=0)return 'dnes';if(d===1)return 'včera';if(d<14)return 'před '+d+' d';if(d<60)return 'před '+Math.round(d/7)+' týd';if(d<365)return 'před '+Math.floor(d/30)+' měs';return 'před '+Math.floor(d/365)+' r';
}
function matchesFilter(c,q){
  if(fField&&(c.field||'')!==fField)return false;
  if(fStatus&&c.status!==fStatus)return false;
  if(fGroup==='new'&&!isUnsent(c))return false;
  if(fGroup==='wait'&&c.status!=='ceka'&&c.status!=='ignor')return false;
  if(fGroup==='meet'&&c.status!=='kontakt'&&c.status!=='schuzka')return false;
  if(fDue){var k=dueKind(c);if(fDue==='due'?!k:k!==fDue)return false}
  if(q){var lm=lastMsg(c);if([c.name,c.mail,c.phone,c.other,c.field,c.desc,c.nextAction,lm?lm.text:''].join(' ').toLowerCase().indexOf(q)<0)return false}
  return true;
}
function sortByDue(a,b){return (isDone(a)-isDone(b))||(a.nextDate||'9999').localeCompare(b.nextDate||'9999')||csc(String(a.name||''),String(b.name||''))}
function sortVal(c,k){
  if(k==='status'){for(var i=0;i<STATUSES.length;i++)if(STATUSES[i][0]===c.status)return i;return 99}
  if(k==='first'){var f=firstMsg(c);return f?f.at:null}
  if(k==='fu'){return fus(c).length||null}
  if(k==='last'){var l=lastMsg(c);return l?l.at:null}
  if(k==='lastnote'){var m=lastMsg(c);return m&&m.text?m.text.toLowerCase():null}
  var v=String(c[k]==null?'':c[k]).trim().toLowerCase();return v||null;
}
function sortFn(s){
  return function(a,b){
    var x=sortVal(a,s.k),y=sortVal(b,s.k),r;
    if(x==null||y==null){if(x==null&&y==null)r=0;else return x==null?1:-1}   // prázdné vždy na konec
    else r=(typeof x==='number'?x-y:csc(x,y))*s.dir;
    return r||csc(String(a.name||''),String(b.name||''));
  };
}
function computeView(){
  var q=fSearch.trim().toLowerCase();
  view=contacts.filter(function(c){return matchesFilter(c,q)}).sort(sortS?sortFn(sortS):sortByDue);
  pos=new Map();view.forEach(function(c,i){pos.set(c.id,i)});
}
function idxOf(id){return id===ADD?view.length:(pos.has(id)?pos.get(id):-1)}
function idAt(i){return i>=view.length?ADD:view[i].id}
function rowObj(id){return id===ADD?blank({id:ADD,_add:true}):byId(id)}
function blank(x){return Object.assign({id:uid(),name:'',contact:'',mail:'',phone:'',other:'',desc:'',field:'',status:'novy',nextDate:'',nextAction:'',created:new Date().toISOString(),log:[]},x||{})}
function newBase(){var b=blank();if(fStatus)b.status=fStatus;if(fField)b.field=fField;return b}

/* ---------- hodnoty buněk, data ---------- */
function validYmd(y,m,d){var dt=new Date(y,m-1,d);return dt.getFullYear()===+y&&dt.getMonth()===m-1&&dt.getDate()===+d?y+'-'+pad(m)+'-'+pad(d):null}
/* '' = bez termínu, null = nerozumím. Zná: 2026-11-05, 5.11., 5. 11. 2026, dnes, zítra, +3, +2t, +1m, po…ne */
function parseDateInput(raw){
  var v=norm(raw);if(!v)return '';var t=today(),m;
  if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return validYmd(+m[1],+m[2],+m[3]);
  if(m=v.match(/^(\d{1,2})\s*[.\/]\s*(\d{1,2})(?:\s*[.\/]\s*(\d{2,4}))?\s*\.?$/)){
    var y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):+t.slice(0,4),r=validYmd(y,+m[2],+m[1]);
    if(r&&!m[3]&&r<t)r=validYmd(y+1,+m[2],+m[1]);          // bez roku = nejbližší budoucí výskyt
    return r;
  }
  if(v==='dnes'||v==='d'||v==='today')return t;
  if(v==='zitra')return addDays(t,1);
  if(v==='pozitri')return addDays(t,2);
  if(m=v.match(/^\+\s*(\d+)\s*(d|dn\w*|t|tyd\w*|w|m|mes\w*)?$/)){
    var n=+m[1],u=(m[2]||'d').charAt(0);
    return u==='t'||u==='w'?addDays(t,7*n):u==='m'?addMonths(t,n):addDays(t,n);
  }
  var wd=['ne','po','ut','st','ct','pa','so'];
  if(m=v.match(/^(ne|po|ut|st|ct|pa|so)[a-z]*$/)){var tg=wd.indexOf(m[1]),cd=new Date().getDay();return addDays(t,((tg-cd+6)%7)+1)}
  return null;
}
/* vrátí nový kontakt s upravenou buňkou, null = neplatná hodnota / buňka jen ke čtení */
function isRo(k){for(var i=0;i<COLS.length;i++)if(COLS[i].k===k)return COLS[i].t==='ro';return false}
function withValue(c,k,raw){
  var n=Object.assign({},c);raw=String(raw==null?'':raw);
  if(isRo(k))return null;
  if(k==='status'){n.status=raw.trim()?statusKey(raw):'novy';return n}
  if(k==='nextDate'){var d=parseDateInput(raw);if(d===null)return null;n.nextDate=d;return n}
  if(k==='first'){   // datum první zprávy = záznam kind:'prvni' v historii
    var fd=parseDateInput(raw);if(fd===null)return null;
    n.log=(c.log||[]).slice();var fi=firstIdx(n);
    if(!fd){if(fi>=0)n.log.splice(fi,1)}
    else if(fi>=0)n.log[fi]=Object.assign({},n.log[fi],{at:dateToAt(fd,n.log[fi].at)});
    else n.log.push({at:dateToAt(fd),type:'napsal',kind:'prvni',outcome:'ceka',text:''});
    n.status=statusFromLog(n);return n;
  }
  n[k]=raw.replace(/\s*[\r\n]+\s*/g,' ').trim();
  if(k==='mail'||k==='phone'||k==='other')n.contact=contactStr(n);
  return n;
}
function cellText(c,k){   // text pro kopírování a porovnání
  if(k==='status')return statusLabel(c.status);
  if(k==='nextDate')return fmtCz(c.nextDate);
  if(k==='first'){var f=firstMsg(c);return f?fmtCz(ymd(new Date(f.at))):''}
  if(k==='fu')return fus(c).map(function(l,i){return 'FU'+(i+1)+' '+fmtShort(ymd(new Date(l.at)))}).join('; ');
  if(k==='lastnote'){var m=lastMsg(c);return m?(m.outcome?outLabel(m.outcome)+(m.text?': ':''):'')+(m.text||''):''}
  if(k==='last'){var l=lastMsg(c);return l?ymd(new Date(l.at)):''}
  return c[k]==null?'':String(c[k]);
}

/* ---------- odkazy (e-mail, telefon, URL) ---------- */
function lnk(href,icon,label,ext){return '<span class="lk"><a class="lnk" tabindex="-1" href="'+esc(href)+'"'+(ext?' target="_blank" rel="noopener noreferrer"':'')+' title="'+esc(label)+'" aria-label="'+esc(label)+'">'+icon+'</a></span>'}
function mailLink(v){var m=String(v||'').match(RE_MAIL);return m?lnk('mailto:'+m[0],'✉','Napsat e-mail '+m[0]):''}

function nextHtml(c){
  var h='';
  if(!isIso(c.nextDate))h=c.nextDate?'<span class="due">'+esc(c.nextDate)+'</span>':'';
  else if(isDone(c))h='<span class="due">'+fmtDate(c.nextDate)+'</span>';
  else{
    var d=diffDays(c.nextDate,today()),k=d<0?'late':d===0?'today':d<=3?'soon':'far';
    var tx=d<0?'po termínu '+(-d)+' d':d===0?'dnes':d===1?'zítra':'za '+(d<60?d+' d':Math.round(d/30)+' měs');
    h='<span class="cd '+k+'">'+esc(tx)+'</span><span class="cdd">'+fmtDate(c.nextDate)+'</span>';
  }
  return h+'<button class="mbtn" data-msg tabindex="-1">+ Zpráva</button>';
}
function badge(k,full){return '<span class="badge" data-s="'+esc(k)+'" data-badge title="'+esc(statusLabel(k))+'">'+esc(full?statusLabel(k):(SHORT[k]||statusLabel(k)))+'</span>'}
function cellInner(c,k){
  var add=c._add;
  switch(k){
    case 'name':return '<span class="t">'+(c.name?esc(c.name):'<span class="ph">'+(add?'+ přidat řádek':'(bez jména)')+'</span>')+'</span>'+(add?'':'<span class="acts"><button class="msgb" data-msg tabindex="-1" title="Zapsat zprávu / follow-up (Alt+M)" aria-label="Přidat zprávu nebo follow-up">+ Zpráva</button><button class="open" tabindex="-1" data-open aria-label="Otevřít detail" title="Detail (mezerník)">⤢</button></span>');
    case 'mail':return '<span class="t">'+(c.mail?esc(c.mail):(!add&&!c.phone?'<span class="ph w" title="Vyplň e-mail nebo telefon">doplnit mail / tel.</span>':''))+'</span>'+mailLink(c.mail);
    case 'phone':return '<span class="t">'+esc(c.phone)+'</span>'+telLink(c.phone);
    case 'other':return '<span class="t">'+esc(c.other)+'</span>'+urlLink(c.other);
    case 'status':return add?'':badge(c.status)+(c.status==='ignor'&&fus(c).length>=IGNOR_N?'<span class="hint2" title="'+IGNOR_N+'+ follow-upů bez odpovědi">zvaž ukončit</span>':'');
    case 'first':{
      if(add)return '';var f=firstMsg(c);if(f)return '<span>'+fmtShort(ymd(new Date(f.at)))+'</span>';
      return c.status==='novy'?'<span class="ph">neodesláno</span><button class="sendnow" data-sendnow tabindex="-1" title="Zapsat první zprávu s dnešním datem">Odeslat dnes</button>':'<span class="ph">bez data</span>';
    }
    case 'fu':{
      if(add)return '';
      return fus(c).map(function(l,i){var d=fmtShort(ymd(new Date(l.at)));return '<span class="fuc" title="'+esc('Follow-up '+(i+1)+': '+d+(l.outcome?' – '+outLabel(l.outcome):''))+'">FU'+(i+1)+' '+d+'</span>'}).join('');
    }
    case 'nextDate':return add?'':nextHtml(c);
    case 'lastnote':{
      if(add)return '';var m=lastMsg(c);if(!m)return '';
      return '<span class="ln" data-hist>'+(m.outcome?outBadge(m.outcome):'')+'<span class="t">'+(m.text?esc(m.text):'<span class="ph">'+esc(kindLabel(m.kind))+'</span>')+'</span><span class="ago">'+agoText(m.at)+'</span></span>';
    }
    case 'last':{if(add)return '';var l=lastMsg(c);return l?'<span class="last" title="'+esc(fmtStamp(l.at)+' – '+kindLabel(l.kind))+'">'+agoText(l.at)+'</span>':''}
    case 'desc':case 'nextAction':return '<span class="t" title="'+esc(c[k])+'">'+esc(c[k])+'</span>';
    default:return '<span class="t">'+esc(c[k])+'</span>';
  }
}

var painted=[],curIdx=0;
function rangeOf(a,f){var ai=idxOf(a.id),fi=idxOf(f.id);if(ai<0)ai=fi;if(fi<0)fi=ai;return{r1:Math.min(ai,fi),r2:Math.max(ai,fi),c1:Math.min(a.c,f.c),c2:Math.max(a.c,f.c)}}

function setCur(i,c,extend,keepExtras){
  i=clamp(i,0,view.length);c=clamp(c,0,VC.length-1);
  cur={id:idAt(i),c:c};if(!extend)anc={id:cur.id,c:c};
  if(!keepExtras)extras=[];

function paintSel(){
  var R=$('#rows');if(!R||!R.children.length)return;
  var fi=idxOf(cur.id);if(fi<0){fi=Math.min(curIdx,view.length);cur={id:idAt(fi),c:Math.min(cur.c,VC.length-1)}}
  if(idxOf(anc.id)<0)anc={id:cur.id,c:cur.c};
  if(cur.c>=VC.length)cur.c=VC.length-1;if(anc.c>=VC.length)anc.c=VC.length-1;
  curIdx=fi;
  painted.forEach(function(el){el.classList.remove('sel','rng','hl')});painted=[];
  var rs=extras.map(function(x){return rangeOf(x.a,x.f)}).concat([range()]);
  rs.forEach(function(g,n){
    var multi=g.r1!==g.r2||g.c1!==g.c2||n<rs.length-1||rs.length>1;
    for(var r=g.r1;r<=g.r2;r++){var row=R.children[r];if(!row)continue;row.children[0].classList.add('hl');painted.push(row.children[0]);
      for(var c=g.c1;c<=g.c2;c++){var el=row.children[c+2];if(!el)continue;if(multi)el.classList.add('rng');painted.push(el)}}
  });
  var el=R.children[fi].children[cur.c+2];
  if(el){el.classList.add('sel');painted.push(el);wrap.setAttribute('aria-activedescendant',el.id);if(!ce)reveal(el,cur.c)}
}
function reveal(el,c){
  var w=wrap,er=el.getBoundingClientRect(),wr=w.getBoundingClientRect(),hh=$('#hrow').offsetHeight||0;
  var top=wr.top+w.clientTop+hh,bot=wr.top+w.clientTop+w.clientHeight;
  if(er.top<top)w.scrollTop-=top-er.top;else if(er.bottom>bot)w.scrollTop+=er.bottom-bot;
  if(isMobile())return;
  var fw=NUMW+CKW+(VC[0]?colW(VC[0]):0),left=wr.left+w.clientLeft+(c===0?0:fw),right=wr.left+w.clientLeft+w.clientWidth;
  if(c>0&&er.left<left)w.scrollLeft-=left-er.left;else if(er.right>right)w.scrollLeft+=er.right-right;
}

var pop=null,skipClick=false;
function openPop(kind,anchor,html,o){

  pop={el:el,kind:kind,anchor:anchor,opener:o.opener||null,edit:!!o.edit,hi:-1};placePop();

function placePop(){
  if(!pop)return;
  if(pop.kind==='msg'&&isMobile()){pop.el.style.left='';pop.el.style.top='';return}   // na mobilu spodní panel (CSS)
  var r=pop.anchor.getBoundingClientRect(),p=pop.el,pw=p.offsetWidth,ph=p.offsetHeight;
  var l=Math.min(r.left,window.innerWidth-pw-8),t=r.bottom+2;
  if(t+ph>window.innerHeight-8)t=r.top-ph-2>8?r.top-ph-2:Math.max(8,window.innerHeight-ph-8);
  p.style.left=Math.max(8,l)+'px';p.style.top=t+'px';
}
function closePop(quiet){
  if(!pop)return;var p=pop;pop=null;p.el.remove();

function popKey(e){

  if(!pop||pop.edit)return;
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePop();return}
  if(pop.kind==='filter'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();var it=[].slice.call(pop.el.querySelectorAll('button,input')),i=it.indexOf(document.activeElement);
    i=e.key==='ArrowDown'?Math.min(it.length-1,i+1):Math.max(0,i-1);if(it[i])it[i].focus();

/* ---------- editace buněk ---------- */
function startEdit(seed){
  if(ce)return;var i=idxOf(cur.id),c=cur.c;if(i<0)return;
  var col=VC[c];
  if(col.t==='ro'){if(cur.id===ADD)return;if(col.k==='fu')msgPop(cur.id);else if(col.k==='lastnote')histPop(cur.id);else openPanel(cur.id);return}
  anc={id:cur.id,c:c};extras=[];paintSel();
  var base=rowObj(cur.id),cell=cellEl(i,c);if(!base||!cell)return;
  reveal(cell,c);
  if(col.t==='status'){ce={id:cur.id,c:c,k:col.k,kind:'status',cell:cell};statusMenu(cell,base.status,seed);return}
  var inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.setAttribute('aria-label',col.l);
  var val=col.t==='date'?cellText(base,col.k):(base[col.k]||'');
  inp.value=seed!=null?seed:val;
  ce={id:cur.id,c:c,k:col.k,kind:col.t,input:inp,orig:val,cell:cell};
  cell.classList.add('ed');cell.innerHTML='';cell.appendChild(inp);inp.focus();
  var end=inp.value.length;inp.setSelectionRange(end,end);
  inp.addEventListener('blur',function(e){
    if(!ce||ce.input!==inp)return;
    if(pop&&e.relatedTarget&&pop.el.contains(e.relatedTarget))return;
    commitEdit('none',true);
  });
  inp.addEventListener('input',function(){if(ce&&ce.kind==='field')fieldSuggest()});
  if(col.t==='field')fieldSuggest();
  if(col.t==='date')datePop();
}
function endEditUi(){var s=ce;ce=null;closePop(true);return s}
function cancelEdit(){
  if(!ce)return;var s=endEditUi();
  if(s.fresh){var b=byId(s.id);if(b&&!b.name&&!b.contact&&!b.desc&&!b.nextAction){applyOne(s.id,null);var k=undoS.length-1;if(k>=0&&undoS[k].fresh===s.id)undoS.pop();persistAll()}}
  render();wrap.focus({preventScroll:true});
}
/* move: down|up|left|right|none */
function commitEdit(move,fromBlur){
  if(!ce)return;var s=ce,raw=s.input?s.input.value:s.value,base=rowObj(s.id);
  var res=withValue(base,s.k,raw);
  if(res===null){
    toast('Datum nerozumím – zkus 5.11., zítra, +3d nebo po');
    if(fromBlur){cancelEdit();return}
    s.input.focus();s.input.select();return;
  }
  endEditUi();
  var ri=idxOf(s.id),c=s.c,ch=[],nid=s.id,target;
  if(s.id===ADD){
    if(JSON.stringify(res)!==JSON.stringify(base)){res=Object.assign(newBase(),res,{id:uid()});delete res._add;ch.push({id:res.id,before:null,after:res});nid=res.id}
  }else if(cellText(res,s.k)!==cellText(base,s.k)||(s.k==='status'&&res.status!==base.status)){ch.push({id:s.id,before:base,after:res})}
  var nr=ri,nc=c;
  if(move==='down')nr=ri+1;else if(move==='up')nr=ri-1;
  else if(move==='right'){nc=c+1;if(nc>=VC.length){nc=0;nr=ri+1}}
  else if(move==='left'){nc=c-1;if(nc<0){nc=VC.length-1;nr=ri-1}}
  nr=clamp(nr,0,view.length);
  if(s.id===ADD&&nid!==ADD){   // právě vznikl řádek: Enter zůstane v přidávacím řádku, Tab pokračuje v novém
    target=(move==='right'||move==='left')?nid:ADD;if(move==='none')target=nid;if(move==='up')target=idAt(Math.max(0,view.length-1));
  }else target=idAt(nr);
  cur={id:target,c:nc};anc={id:target,c:nc};extras=[];
  if(ch.length){var e=commitChanges(ch,'úprava buňky');if(e&&s.fresh)e.fresh=s.id}else render();
  if(!fromBlur)wrap.focus({preventScroll:true});
}
function statusMenu(cell,curKey,seed){

  var el=openPop('status',cell,h,{edit:true});
  var n=Math.max(0,STATUSES.map(function(s){return s[0]}).indexOf(curKey));
  if(seed){var q=norm(seed);for(var i=0;i<STATUSES.length;i++)if(norm(STATUSES[i][1]).indexOf(q)===0||norm(SHORT[STATUSES[i][0]]).indexOf(q)===0){n=i;break}}

}

function datePop(){

function editorKey(e){
  if(e.isComposing)return;var k=e.key;
  if(k==='Enter'){e.preventDefault();pickSuggestion();commitEdit(e.shiftKey?'up':'down')}
  else if(k==='Tab'){e.preventDefault();pickSuggestion();commitEdit(e.shiftKey?'left':'right')}
  else if(k==='Escape'){e.preventDefault();cancelEdit()}
  else if(ce.kind==='field'&&pop&&(k==='ArrowDown'||k==='ArrowUp')){e.preventDefault();hiItem(pop.hi<0?(k==='ArrowDown'?0:0):pop.hi+(k==='ArrowDown'?1:-1))}
}
function pickSuggestion(){
  if(ce&&ce.kind==='field'&&pop&&pop.kind==='field'&&pop.hi>=0){var it=pop.el.querySelectorAll('.pi')[pop.hi];if(it)ce.input.value=it.dataset.fv}
}
function menuKey(e){   // menu Stavu (fokus zůstává na mřížce)
  var k=e.key;if(!pop)return;
  if(k==='ArrowDown'){e.preventDefault();hiItem(pop.hi+1)}
  else if(k==='ArrowUp'){e.preventDefault();hiItem(pop.hi-1)}
  else if(k==='Enter'||k==='Tab'){e.preventDefault();pickStatus(STATUSES[pop.hi][0],k==='Tab'?(e.shiftKey?'left':'right'):'down')}
  else if(k==='Escape'){e.preventDefault();cancelEdit()}
  else if(k.length===1&&!e.ctrlKey&&!e.metaKey){e.preventDefault();var q=norm(k);for(var i=0;i<STATUSES.length;i++){var j=(pop.hi+1+i)%STATUSES.length;if(norm(SHORT[STATUSES[j][0]]).indexOf(q)===0){hiItem(j);break}}}
}

function allRanges(){return extras.map(function(x){return rangeOf(x.a,x.f)}).concat([range()])}
function clearRanges(){
  var seen={},ch=[],n=0;
  allRanges().forEach(function(g){
    for(var r=g.r1;r<=Math.min(g.r2,view.length-1);r++)for(var c=g.c1;c<=g.c2;c++){
      var k=VC[c].k;if(isRo(k))continue;var id=view[r].id,base=seen[id]||view[r],nx=withValue(base,k,'');
      if(nx&&cellText(nx,k)!==cellText(base,k)){seen[id]=nx;n++}
    }
  });
  Object.keys(seen).forEach(function(id){ch.push({id:id,before:byId(id),after:seen[id]})});
  if(!ch.length)return;var e=commitChanges(ch,'smazání obsahu buněk');toast('Vymazáno buněk: '+n,function(){undo(e)});
}
function tsvCell(v){return /[\t\n\r"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function rangeTsv(){
  var g=range(),out=[];
  for(var r=g.r1;r<=Math.min(g.r2,view.length-1);r++){var row=[];for(var c=g.c1;c<=g.c2;c++)row.push(tsvCell(cellText(view[r],VC[c].k)));out.push(row.join('\t'))}
  return out.join('\n');
}
/* název sloupce z hlavičky vložené tabulky -> klíč sloupce (nebo '') */
function headerKey(h){
  var n=norm(h);if(!n)return '';
  var map=[[/^jmeno|^name|^osoba/,'name'],[/^e-?mail|^mail/,'mail'],[/telefon|^tel$|phone|mobil/,'phone'],[/^jine|linkedin|^web/,'other'],[/^obor|odvetvi|^firma/,'field'],[/^stav|^status/,'status'],
    [/^prvni/,'first'],[/dalsi f|^follow|^termin/,'nextDate'],[/co udelat|^akce/,'nextAction'],[/^popis|^poznamka$/,'desc']];
  for(var i=0;i<map.length;i++)if(map[i][0].test(n))return map[i][1];
  return '';
}
function doPaste(text){
  var rows=parseDelim(text.replace(/\r\n?/g,'\n'),'\t');
  while(rows.length&&rows[rows.length-1].every(function(x){return !String(x).trim()}))rows.pop();
  if(!rows.length)return;
  var hdr=null;   // hlavička z Excelu: sloupce se přiřadí podle názvu, ne podle polohy
  if(rows.length>1&&rows[0].filter(function(x){return headerKey(x)}).length>=2){hdr=rows.shift().map(function(x){var k=headerKey(x);return VC.findIndex(function(c){return c.k===k})})}
  var g=range(),r0=g.r1,c0=g.c1,tg=[];
  if(rows.length===1&&rows[0].length===1&&(g.r1!==g.r2||g.c1!==g.c2)){
    for(var r=g.r1;r<=Math.min(g.r2,view.length-1);r++)for(var c=g.c1;c<=g.c2;c++)tg.push({r:r,c:c,v:rows[0][0]});
  }else rows.forEach(function(row,i){row.forEach(function(v,j){var cc=hdr?hdr[j]:c0+j;if(cc>=0&&cc<VC.length)tg.push({r:r0+i,c:cc,v:v})})});
  if(hdr){var hc=hdr.filter(function(x){return x>=0});if(hc.length)c0=Math.min.apply(null,hc)}
  var byRow={},order=[];
  tg.forEach(function(t){if(!byRow[t.r]){byRow[t.r]=[];order.push(t.r)}byRow[t.r].push(t)});
  var ch=[],cells=0,bad=0,created=0,firstId=null,lastId=null,maxC=c0;
  order.sort(function(a,b){return a-b}).forEach(function(r){
    var before=r<view.length?view[r]:null,n=before||newBase(),any=false;
    byRow[r].forEach(function(t){
      var nx=withValue(n,VC[t.c].k,t.v);
      if(nx===null){if(!isRo(VC[t.c].k))bad++;return}
      if(cellText(nx,VC[t.c].k)!==cellText(n,VC[t.c].k)||!before){n=nx;any=true;cells++;maxC=Math.max(maxC,t.c)}
    });
    if(!before&&!(n.name||n.contact||n.desc||n.nextAction||n.field))return;
    if(any||before){if(any){ch.push({id:n.id,before:before,after:n});if(!before)created++}}
    if(any){if(firstId==null)firstId=n.id;lastId=n.id}
  });
  if(!ch.length){toast(bad?'Vložení: žádná hodnota nebyla platná':'Nic k vložení');return}
  anc={id:firstId,c:c0};cur={id:lastId,c:maxC};extras=[];
  var e=commitChanges(ch,'vložení z tabulky');
  toast('Vloženo: '+cells+' buněk'+(created?', nových řádků: '+created:'')+(bad?', přeskočeno neplatných: '+bad:''),function(){undo(e)});
}

function csvCell(v){v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function download(name,type,text){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportCsv(){
  if(!contacts.length){toast('Není co exportovat');return}
  var rows=[HEAD].concat(contacts.slice().sort(sortByDue).map(function(c){var f=firstMsg(c),lm=lastMsg(c);return [c.name,c.mail,c.phone,c.other,c.field,statusLabel(c.status),f?ymd(new Date(f.at)):'',fus(c).length,c.nextDate,lm&&lm.outcome?outLabel(lm.outcome):'',lm?lm.text||'':'',c.desc,c.nextAction]}));
  download('oslovovani-'+today()+'.csv','text/csv;charset=utf-8','﻿'+rows.map(function(r){return r.map(csvCell).join(';')}).join('\r\n'));
  download('oslovovani-zaloha-'+today()+'.json','application/json',JSON.stringify(contacts,null,1));
  toast('Staženo: CSV pro Excel + JSON záloha (s historií)');

function parseDelim(t,d){
  var rows=[],row=[],cell='',q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"'&&cell==='')q=true;
    else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cell);cell='';rows.push(row);row=[]}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function parseCsv(t){
  t=t.replace(/^﻿/,'');var first=t.split(/\r?\n/)[0]||'';
  var d=(first.split(';').length>=first.split(',').length&&first.indexOf(';')>=0)?';':(first.indexOf('\t')>=0?'\t':',');
  return parseDelim(t,d).filter(function(r){return r.some(function(x){return x.trim()})});
}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}
function statusKey(v){
  var n=norm(v);if(!n)return 'novy';
  for(var i=0;i<STATUSES.length;i++){if(norm(STATUSES[i][1])===n||STATUSES[i][0]===n)return STATUSES[i][0]}
  if(/ignor/.test(n))return 'ignor';if(/odmit|nezaj|odm/.test(n))return 'nezajem';if(/spolup|klient|zajem/.test(n))return 'spoluprace';if(/schuz/.test(n))return 'schuzka';
  if(/ceka|cekam/.test(n))return 'ceka';if(/jedn|kontakt|odpov/.test(n))return 'kontakt';if(/novy|neoslov|nekontakt/.test(n))return 'novy';
  for(var j=0;j<STATUSES.length;j++){if(norm(STATUSES[j][1]).indexOf(n)===0)return STATUSES[j][0]}
  return 'osloven';
}
function normDate(v){v=String(v||'').trim();var m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);m=v.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);return m?m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]):''}
function importText(name,text){
  var list=[];
  try{
    if(/\.json$/i.test(name)){var a=JSON.parse(text);list=(Array.isArray(a)?a:[]).filter(function(c){return c&&c.name}).map(function(c){c.id=c.id||uid();c.status=c.status||'novy';migrateContact(c);return c})}
    else{
      var rows=parseCsv(text);if(rows.length<2){toast('Soubor je prázdný');return}
      var h=rows[0].map(norm);var col=function(re){for(var i=0;i<h.length;i++)if(re.test(h[i]))return i;return -1};
      var ix={name:col(/jmeno|name|osoba|kdo/),mail:col(/^e-?mail|^mail/),phone:col(/telefon|^tel$|phone|mobil/),other:col(/^jine|linkedin|^other|^web/),contact:col(/^kontakt|^contact/),
        field:col(/obor|odvetvi|field|firma|oblast/),status:col(/^stav|^status/),first:col(/^prvni/),date:col(/dalsi fu|^follow|termin|datum|^date/),act:col(/co udelat|akce|action/),
        outcome:col(/^vysledek|^outcome/),lastnote:col(/posledni poznam|last note/),desc:col(/^popis|^desc/)};
      if(ix.desc<0)ix.desc=col(/^poznam|^note/);
      if(ix.name<0)ix.name=0;
      var g=function(r,i){return i>=0&&r[i]!=null?String(r[i]).trim():''};
      rows.slice(1).forEach(function(r){
        var n=g(r,ix.name);if(!n)return;
        var o=blank({name:n,mail:g(r,ix.mail),phone:g(r,ix.phone),other:g(r,ix.other),field:g(r,ix.field),desc:g(r,ix.desc),nextDate:normDate(g(r,ix.date)),nextAction:g(r,ix.act)});
        if(ix.contact>=0){var sp=splitContact(g(r,ix.contact));o.mail=o.mail||sp.mail;o.phone=o.phone||sp.phone;o.other=o.other||sp.other}
        o.contact=contactStr(o);
        var oc=outcomeKey(g(r,ix.outcome)),fd=normDate(g(r,ix.first));
        o.status=g(r,ix.status)?statusKey(g(r,ix.status)):oc?outObj(oc)[2]:'novy';
        if(fd)o.log.push({at:dateToAt(fd),type:'napsal',kind:'prvni',outcome:oc||statusToOutcome(o.status)||'ceka',text:g(r,ix.lastnote)});
        list.push(o);
      });
    }
  }catch(e){toast('Soubor se nepodařilo přečíst');return}
  if(!list.length){toast('Nenašel jsem žádné kontakty');return}
  var seen={};contacts.forEach(function(c){seen[c.id]=1;seen[norm(c.name)+'|'+norm(contactStr(c))]=1});
  var ch=[];list.forEach(function(c){var k=norm(c.name)+'|'+norm(contactStr(c));if(seen[c.id]||seen[k])return;seen[k]=1;seen[c.id]=1;ch.push({id:c.id,before:null,after:c})});
  if(ch.length)commitChanges(ch,'import');else render();
  toast('Naimportováno: '+ch.length+(list.length-ch.length?' (přeskočeno duplicit: '+(list.length-ch.length)+')':''));
}

function gridKey(e){
  var k=e.key,mod=e.ctrlKey||e.metaKey;
  if(mod){
    var l=k.toLowerCase();
    if(l==='z'){e.preventDefault();e.shiftKey?redo():undo()}
    else if(l==='y'){e.preventDefault();redo()}
    else if(l==='a'){e.preventDefault();anc={id:view.length?view[0].id:ADD,c:0};cur={id:view.length?view[view.length-1].id:ADD,c:VC.length-1};extras=[];paintSel()}
    else if(k==='/'){e.preventDefault();helpPop(wrap)}
    else if(k==='Enter'){e.preventDefault();if(cur.id!==ADD)msgPop(cur.id)}
    else if(k==='Home'){e.preventDefault();setCur(0,0,e.shiftKey)}
    else if(k==='End'){e.preventDefault();setCur(view.length-1,VC.length-1,e.shiftKey)}
    else if(k.indexOf('Arrow')===0){e.preventDefault();moveCur(k==='ArrowDown'?1:k==='ArrowUp'?-1:0,k==='ArrowRight'?1:k==='ArrowLeft'?-1:0,e.shiftKey,true)}
    return;
  }
  if(e.altKey){var a=k.toLowerCase();if(a==='n'){e.preventDefault();openPanel(null)}else if(a==='m'){e.preventDefault();if(cur.id!==ADD)msgPop(cur.id)}else if(a==='h'){e.preventDefault();$('#fs').focus()}return}
  switch(k){
    case 'ArrowDown':e.preventDefault();moveCur(1,0,e.shiftKey);break;
    case 'ArrowUp':e.preventDefault();moveCur(-1,0,e.shiftKey);break;
    case 'ArrowRight':e.preventDefault();moveCur(0,1,e.shiftKey);break;
    case 'ArrowLeft':e.preventDefault();moveCur(0,-1,e.shiftKey);break;
    case 'PageDown':e.preventDefault();moveCur(10,0,e.shiftKey);break;
    case 'PageUp':e.preventDefault();moveCur(-10,0,e.shiftKey);break;
    case 'Home':e.preventDefault();moveCur(0,-1,e.shiftKey,true);break;
    case 'End':e.preventDefault();moveCur(0,1,e.shiftKey,true);break;
    case 'Tab':{
      var i=idxOf(cur.id),c=cur.c+(e.shiftKey?-1:1);
      if(c<0){if(i===0)return;e.preventDefault();setCur(i-1,VC.length-1);return}
      if(c>=VC.length){if(i>=view.length)return;e.preventDefault();setCur(i+1,0);return}
      e.preventDefault();setCur(i,c);return}
    case 'Enter':e.preventDefault();if(e.shiftKey)insertBelow();else startEdit();break;
    case 'F2':e.preventDefault();startEdit();break;
    case ' ':e.preventDefault();if(cur.id!==ADD)openPanel(cur.id);break;
    case 'Delete':case 'Backspace':e.preventDefault();clearRanges();break;
    case 'Escape':if(picked.size){picked.clear();renderBulk();render()}else if(extras.length||range().r1!==range().r2||range().c1!==range().c2)setCur(idxOf(cur.id),cur.c);break;
    default:
      if(k.length===1&&!e.isComposing&&VC[cur.c].t!=='ro'){e.preventDefault();startEdit(k)}
  }
}

document.addEventListener('mouseup',function(){
  dragging=false;if(rz){rz.el.classList.remove('drag');rz=null;lsSet(WKEY,widths)}
});
wrap.addEventListener('dblclick',function(e){
  var h=e.target.closest('.rz');if(h){var k=VC[+h.dataset.rz].k;delete widths[k];lsSet(WKEY,widths);applyCols();return}
  if(isMobile()||e.target.closest('a.lnk')||e.target.closest('[data-open]'))return;
  var cell=e.target.closest('.row .cell[data-c]');if(!cell||ce)return;startEdit();
});
wrap.addEventListener('click',function(e){   // mobil: klepnutí na řádek otevře panel
  if(!isMobile())return;if(e.target.closest('[data-msg],[data-sendnow]'))return;var row=e.target.closest('.row');if(!row)return;
  if(row.dataset.id===ADD)openPanel(null);else openPanel(row.dataset.id);
});
wrap.addEventListener('scroll',function(){wrap.classList.toggle('sx',wrap.scrollLeft>0);if(pop){if(pop.edit)placePop();else closePop(true)}});
window.addEventListener('resize',function(){if(pop)placePop()});
window.matchMedia('(max-width:699px)').addEventListener('change',function(){if(ce)cancelEdit();else render()});
document.addEventListener('mousedown',function(e){
  if(e.target.id==='ov'){closePanel();return}
  if(!pop)return;
  if(pop.el.contains(e.target)){if(pop.edit&&e.target.id!=='dp')e.preventDefault();return}
  if(pop.opener&&pop.opener.contains(e.target))skipClick=true;
  if(pop.kind==='status'){if(ce&&!(ce.cell&&ce.cell.contains(e.target)))cancelEdit()}
  else if(!pop.edit)closePop(true);
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(editing){
    if(e.key==='Escape'){closePanel();return}
    if(e.key==='Tab'){var f=[].slice.call(document.querySelectorAll('.panel button,.panel input,.panel select,.panel textarea')).filter(function(x){return !x.disabled});if(!f.length)return;var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){var b=document.querySelector(t.id==='m-text'?'[data-p=addlog]':'[data-p=save]');if(b)b.click()}
    return;
  }
  if(ce&&ce.input&&t===ce.input){editorKey(e);return}
  if(t===wrap){if(ce&&ce.kind==='status'){menuKey(e);return}gridKey(e);return}
  if(t.id==='fs'){
    if(e.key==='Escape'){if(t.value){t.value='';fSearch='';render()}else wrap.focus({preventScroll:true})}
    else if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();wrap.focus({preventScroll:true})}
    return;
  }
  if(e.key==='Escape'&&pop){closePop();return}
  if(e.key==='/'&&(e.ctrlKey||e.metaKey)){e.preventDefault();helpPop(wrap);return}
  var tg=t.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(t===document.body&&/^Arrow/.test(e.key)&&!isMobile()){wrap.focus({preventScroll:true});gridKey(e);return}
  if(t.closest&&t.closest('.pop'))return;
  if(e.key==='n'){e.preventDefault();openPanel(null)}
  if(e.key==='/'){e.preventDefault();$('#fs').focus()}
  if(e.key==='?'){e.preventDefault();helpPop(wrap)}
});
document.addEventListener('input',function(e){
  if(e.target.id==='fs'){fSearch=e.target.value;render()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='file'){var f=t.files[0];if(f){var fr=new FileReader();fr.onload=function(){importText(f.name,String(fr.result))};fr.readAsText(f,'utf-8')}t.value='';return}
  if(t.id==='b-status'&&t.value){var v=t.value;bulkApply(function(c){c.status=v;return c},'změna stavu');return}
  if(t.id==='b-due'&&t.value){bulkDue(t.value);return}
  if(t.id==='m-fu'){t.dataset.touched='1';$('#m-fud').hidden=t.value!=='custom';return}
  if(t.id==='m-outcome'){var fu=$('#m-fu');if(fu&&!fu.dataset.touched&&fu.options[0].value!=='keep'){var term=['odmitl','schuzka','zajem'].indexOf(t.value)>=0;fu.value=term?'none':String(+ui.fuDays||7);$('#m-fud').hidden=true}return}
  if(t.id==='dp'&&ce&&ce.input){ce.input.value=t.value;commitEdit('none');return}
  if(t.dataset&&t.dataset.col){
    var hide=hiddenCols();hide=hide.filter(function(x){return x!==t.dataset.col});if(!t.checked)hide.push(t.dataset.col);ui.hide=hide;saveUi();
    var kept=pop;render();pop=kept;placePop();return;
  }
});
document.addEventListener('keydown',function(e){   // Enter v poli Obor v hromadné liště
  if(e.target.id==='b-field'&&e.key==='Enter'){e.preventDefault();var b=document.querySelector('[data-bulk=field]');if(b)b.click()}
});
/* schránka */
function gridActive(){return !editing&&!ce&&document.activeElement===wrap}
document.addEventListener('copy',function(e){if(!gridActive())return;e.clipboardData.setData('text/plain',rangeTsv());e.preventDefault();toast('Zkopírováno')});
document.addEventListener('cut',function(e){if(!gridActive())return;e.clipboardData.setData('text/plain',rangeTsv());e.preventDefault();clearRanges()});
document.addEventListener('paste',function(e){if(!gridActive())return;var t=e.clipboardData.getData('text/plain');if(!t)return;e.preventDefault();doPaste(t)});

/* ---------- start ---------- */
var rawBefore=null;try{rawBefore=localStorage.getItem(KEY)}catch(e){}
contacts=load();
if(contacts.some(needsMig)){   // jednorázová migrace starých dat (původní data zůstanou zálohovaná)
  try{if(rawBefore&&!localStorage.getItem(KEY+'_premigrace'))localStorage.setItem(KEY+'_premigrace',rawBefore)}catch(e){}
  contacts.forEach(migrateContact);persistAll();
}
render();
setInterval(function(){if(!editing&&!ce&&document.visibilityState==='visible')render()},5*60*1000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!editing&&!ce)render()});
})();
</script>
</body>
</html>
